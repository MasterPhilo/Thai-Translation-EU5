
l_english:
 stockholm_desc: "เมืองนี้ถูกสถาปนาขึ้นในปี 1252 โดยเบอร์เกอร์ ยาร์ล บนทำเลที่ถูกเลือกทางยุทธศาสตร์ ในจุดที่ทะเลสาบมาลาเรนมาบรรจบกับทะเลบอลติก สิ่งนี้ทำให้สต็อกโฮล์มทำหน้าที่ เป็นทั้งป้อมปราการคอยควบคุมการเข้าถึงทะเลสาบ และเป็นศูนย์กลางการค้าที่เชื่อมต่อพื้นที่ส่วนในของสวีเดน เข้ากับโครงข่ายการค้าของฮันเซอและบอลติก"
 paris_desc: "บนฝั่งแม่น้ำแซน ปารีสได้รุ่งเรืองขึ้นจากนิคมอันต่ำต้อย สู่รัตนชาติประดับราชบัลลังก์แห่งฝรั่งเศส ด้วยอาสนวิหาร ตลาด และสถานศึกษา ทำให้ที่นี่กลายเป็นหนึ่งในศูนย์กลาง อำนาจและวัฒนธรรมชั้นนำของยุโรป"
 london_desc: "ลอนดอนตั้งหลักมั่นอยู่บนแม่น้ำเทมส์ โดยเติบโตจากลอนดินิอุมของโรมัน สู่การเป็นนครชั้นนำของอังกฤษ การค้าที่รุ่งเรือง และราชสำนัก ทำให้ที่นี่กลายเป็นหัวใจทางการเมือง และเศรษฐกิจของราชอาณาจักร"
 rome_desc: "นครอมตะบนลุ่มน้ำไทเบอร์ผู้ปกครองจักรวรรดิ ที่แผ่ขยายครอบคลุมหลายทวีป แม้หลังจากการล่มสลายของจักรวรรดิ โรมยังคงยืนหยัดในฐานะประทีปแห่งศรัทธา และอำนาจปกครอง อันเป็นที่ประทับขององค์พระสันตะปาปา"
 jerusalem_desc: "ในฐานะจุดบรรจบแห่งศรัทธา และการดิ้นรน เยรูซาเล็มเป็นที่เคารพสักการะของทั้งชาวยิว ชาวคริสต์ และชาวมุสลิม เหล่านักแสวงบุญ ผู้พิชิต ต่างร่วมกันหล่อหลอมประวัติศาสตร์อันศักดิ์สิทธิ์ ทว่าปั่นป่วนของเมืองนี้อย่างต่อเนื่อง"
 alexandria_desc: "ครั้งหนึ่งเคยเป็นประทีปแห่งเมดิเตอร์เรเนียน อะเล็กซานเดรียรุ่งเรืองในฐานะทางแยกแห่งการค้า และวิชาการ ประทีปหอคอยกับหอสมุดของเมือง เคยประกาศศักดาถึงนครที่ซึ่งวัฒนธรรม และจักรวรรดิมาบรรจบกัน"
 constantinople_desc: "ประดับยอดด้วยฮายาโซฟีอา และล้อมรอบด้วยกำแพงอันเกรียงไกร คอนสแตนติโนเปิลยืนหยัด เป็นหัวใจของจักรวรรดิโรมันตะวันออก เป็นเวลาพันปีที่ความมั่งคั่ง และความยิ่งใหญ่ ทำให้ที่นี่เป็นที่อิจฉาของคนทั้งโลก"
 sitges_desc: "ในยุคกลาง ปราสาทแห่งหนึ่งถูกสร้างขึ้นบนเนินเขา ซึ่งปัจจุบันเป็นที่ตั้งของศาลาว่าการ เจ้าของคนแรกคือ เขตปกครองมุขนายกแห่งบาร์เซโลนา แต่ในศตวรรษที่ 12 ก็ได้เปลี่ยนมาอยู่ภายใต้การถือครองของตระกูล ซึ่งเป็นที่มาของชื่อเมืองนี้"
 valladolid_desc: "สถาปนาขึ้นในช่วงทศวรรษสุดท้ายของศตวรรษที่ 11 โดยเคานต์เปโดร อันซูเรซ และเคาน์เตสเอย์โล อัลฟอนโซ ใกล้กับสะพานข้ามแม่น้ำปิซวยร์กา บายาโดลิดได้พัฒนาเป็นเมืองพาณิชย์ ในใจกลางของเมเซตาเหนือ เมื่อถึงศตวรรษที่ 14 ก็ได้กลายเป็นเมืองที่สำคัญที่สุดของภูมิภาค เคียงคู่กับบูร์โกส และเป็นศูนย์กลางการบริหารหลัก ในช่วงการสำเร็จราชการของสมเด็จพระราชินีมารีอา เด โมลินา และรัชสมัยของพระราชนัดดาอย่างพระเจ้าอัลฟอนโซที่ 11"
 penafiel_desc: "#italic เปนญา ฟิเดลิส#! หรือ 'ขุนเขาของผู้ภักดี' ถูกสถาปนาขึ้นในศตวรรษที่ 10 บนยอดเขาที่ควบคุมส่วนกลาง ของหุบเขาแม่น้ำดูเอโรทางยุทธศาสตร์ ทำให้กลายเป็นจุดปะทะสำคัญในสงครามจู่โจมชายแดน กับรัฐกาหลิบแห่งกอร์โดบา เคานต์ซานโช การ์ซีอาแห่งกัสติยาได้เสริมปราการอย่างแน่นหนา และมอบสิทธิพิเศษ 'ฟูเอโร' ให้ในช่วงปี 1013 หลังจากนั้นมันได้เติบโตเป็นเมืองที่มั่งคั่ง เนื่องจากอุตสาหกรรมไวน์ที่รุ่งเรือง จนจบลงด้วยการถูกควบคุมโดย วงศ์สกุลอันทรงอำนาจของดอน ฮวน มานูเอล"
 toro_desc: "โตโรถูกสถาปนาขึ้นในศตวรรษที่ 10 โดยเป็นส่วนหนึ่งของความพยายาม โดยเหล่าเจ้าแผ่นดินแห่งเลออน ในการเสริมปราการชายแดนของราชอาณาจักร ณ หุบเขาแม่น้ำดูเอโร ในการต่อสู้กับรัฐกาหลิบแห่งกอร์โดบา ต่อมาได้พัฒนาเป็นเมืองสำคัญ เนื่องจากทำเลทางยุทธศาสตร์ ตลอดจนทุ่งเกษตรกรรม และไร่องุ่นอันอุดมสมบูรณ์"
 thessaloniki_desc: "ได้รับการยกย่องมาช้านานว่าเป็นเมืองอันดับสอง ของจักรวรรดิไบแซนไทน์รองจากคอนสแตนติโนเปิล ความมั่งคั่งและเกียรติภูมิของเทสซาโลนิกิ เกิดจากทำเลทางยุทธศาสตร์ในการพาณิชย์ ท่าเรือที่พลุกพล่านของเธอ เป็นเส้นทางผ่านของสินค้าอันมีค่าระหว่างอิตาลี และแผ่นดินแม่ของโรมัน โดยทำหน้าที่เป็นสะพานเชื่อมสำคัญ ระหว่างตะวันออกและตะวันตก"
 malmo_desc: "กองบัญชาการสำคัญบนช่องแคบเออเรซุนด์ มัลเมอควบคุมเส้นทางสัญจรระหว่างบอลติก และทะเลเหนือ กำแพงที่เสริมปราการ กับเหล่าฝ่ายตั้งรับที่ระแวดระวัง ทำให้ที่นี่เป็นศูนย์กลางอำนาจ และเป็นเมืองที่ถูกหล่อหลอมด้วยยุทธศาสตร์ และความทะเยอทะยาน"
 bilbao_desc: "สถาปนาอย่างเป็นทางการในปี 1300 โดยดิเอโก โลเปซ เด ฮาโร เจ้าผู้ครองบิสกาย ในไม่ช้าเมืองนี้ก็กลายเป็นศูนย์กลางสำคัญในสเปนตอนเหนือ ตั้งอยู่ในหุบเขาแคบ ๆ และเป็นจุดเริ่มต้นของปากแม่น้ำเนร์วิออน นิคมที่มีกำแพงล้อมรอบนี้ ได้พัฒนาอุตสาหกรรมอู่ต่อเรือที่เข้มแข็ง และกลายเป็นท่าเรือหลักในการส่งออกขนสัตว์เมริโนของกัสติยา และสินแร่เหล็กคุณภาพสูงในท้องถิ่น ไปยังท่าเรือของอังกฤษ และเฟลมมิช"
 radom_desc: "เมืองที่ขยายตัวโดยเจ้าแผ่นดินเพียสต์พระองค์สุดท้าย พระเจ้าคาซิมีร์ที่ 3 มหาราช ยังคงเป็นสถานที่สำคัญทางการเมือง ตลอดช่วงปลายยุคกลางและเรเนซองส์ เมืองนี้ยังเป็นสถานที่ลงนามในสนธิสัญญาวิลนีอุส และราดอมในปี 1401 และการอนุมัติพระราชบัญญัติ #italic นิฮิล โนวี#! ในปี 1505 ระหว่างการประชุมสภาในปราสาทหลวง"
 krakow_desc: "เริ่มต้นจากการเป็นหมู่บ้านเล็ก ๆ บนเนินเขาวาเวล ถูกกล่าวถึงชื่อเป็นครั้งแรกในปี 965 โดยถูกบรรยายว่าเป็นศูนย์กลางการค้าที่โดดเด่นในยุคนั้น ที่นี่กลายเป็นที่ประทับของเหล่าเจ้าแผ่นดินโปแลนด์ จากวงศ์สกุลเพียสต์ในปี 1038 และต่อมาได้ทำหน้าที่เป็นศูนย์กลางการบริหาร เศรษฐกิจ และวัฒนธรรมของราชอาณาจักรโปแลนด์"
 megara_desc: "สถาปนาและมีผู้อยู่อาศัยมาตั้งแต่สมัยโบราณ เมการาถูกปกครองโดยเจ้าแผ่นดินในตำนาน เช่น นิซอสและไบซัส เมืองนี้กลายเป็นมหาอำนาจสำคัญในคาบสมุทรกรีก มีชื่อเสียงด้านความแข็งแกร่งของทัพเรือ และการค้าที่รุ่งเรือง เหล่าผู้ตั้งรกรากของเมืองได้ออกไป สร้างนิคมสำคัญทั่วเมดิเตอร์เรเนียน รวมถึงไบแซนทิออน เคอร์โซเนซอส และเซลินุส อย่างไรก็ตาม เมื่อเวลาผ่านไป เมการาก็ค่อย ๆ เลือนหายไปในความมืดมน เหลือทิ้งไว้เพียงร่องรอยของความโดดเด่นในอดีตเท่านั้น"
 grojec_desc: "จนกระทั่งศตวรรษที่ 12 ที่แห่งนี้เคยเป็นที่ตั้งของ เขตปกครองเจ้าปราสาทท้องถิ่น และเขตปกครองอัครมุขมณฑลแห่งพอซนาน แต่ความสำคัญได้ค่อย ๆ ลดน้อยลงให้แก่แชร์สก์ที่อยู่ข้างเคียง"
 gdansk_desc: "นามของมันถูกบันทึกครั้งแรกในปี 997 ว่านครกดังสก์ โดยมีต้นกำเนิดมาจากการตั้งรกราก ที่อยู่บนชายฝั่งทะเลบอลติก ที่นี่ได้กลายเป็นเมืองท่าการต่อเรือ และการค้าที่สำคัญ เป็นการตอกย้ำฐานะหนึ่งในนครที่มั่งคั่ง และทรงอิทธิพลที่สุดในยุโรปตะวันออก"
 athens_desc: "ได้รับการพิจารณาว่าเป็นศูนย์กลาง ทางวัฒนธรรมของกรีกโบราณ เอเธนส์เติบโตขึ้น เป็นหนึ่งในนครรัฐที่เกรียงไกรที่สุดในยุคนั้น ด้วยความเป็นอริกับสปาร์ตา ธีบส์ และรัฐอื่น ๆ ในยุคบรรพกาล มันค่อย ๆ เติบโตขึ้นเป็นมหาอำนาจทางทะเลที่ครอบงำทะเลอีเจียน ด้วยการถูกสยบภายใต้จักรวรรดิมาซิโดเนีย และต่อมาคือจักรวรรดิโรมัน และไบแซนไทน์ ตัวเมืองได้เผชิญกับความเสื่อมโทรมครั้งใหญ่ และหลังปี 1204 ก็ได้กลายเป็นศูนย์กลางของรัฐนักรบครูเสด"
 wieliczka_desc: "เมืองวีแยลิชกาถูกสถาปนาขึ้นในปี 1290 โดยพระเจ้าปแชมิเซิลที่ 2 แห่งโปแลนด์ เนื่องด้วยการขุดหาแหล่งเกลือในท้องถิ่น ในฐานะเมืองเหมืองแร่หลัก ที่นี่ได้รับสิทธิพิเศษมากมาย และเหมืองเกลือท้องถิ่น ก็รุ่งเรืองขึ้นในเวลาอันสั้น เหมืองเกลือวีแยลิชกา และเหมืองพี่น้องในบอคเนีย ได้กลายเป็นส่วนหนึ่งของบริษัทเหมืองแร่ #italic ชูปือ คราคอฟสกีเย#! ในเอกสารทางการ เมืองนี้เป็นที่รู้จักในนาม #italic วีแยลกา ซุล#! ซึ่งมีความหมายว่า #italic เกลืออันยิ่งใหญ่#!"
 leksand_desc: "หมู่บ้านบนชายฝั่งทางใต้ของทะเลสาบซิลยันแห่งนี้ มีผู้คนอาศัยอยู่มานานหลายสหัสวรรษ โบสถ์ถูกสร้างขึ้นในช่วงต้นศตวรรษที่ 12 และปัจจุบันมีชื่อเสียงที่สุดจากการที่ นักเทศน์นิกายลูเทอแรนคนแรก ของพวกเขาเป็นบรรพบุรุษของโยฮัน"
 leipzig_desc: "สถาปนาขึ้นในปี 1165 ณ ทางแยกของ #italic เวีย อิมเปริอี#! และ #italic เวีย เรเกีย#! ไลพ์ซิกเติบโตขึ้นเป็นศูนย์กลางการค้าที่มั่งคั่ง ต่อมาได้รับสิทธิพิเศษที่สำคัญจากจักรพรรดิ ไลพ์ซิกและการค้าของเมืองเป็นศูนย์กลางสำคัญ สำหรับการค้าขนสัตว์ และอุตสาหกรรมหนังสือที่กำลังพัฒนา"
 augsburg_desc: "ครั้งหนึ่งเคยเป็นที่รู้จักในนาม #italic เอากุสตา วิเดลิคุม#! ในรัชสมัยของจักรพรรดิโรมันทราจัน นครรัฐอิสระเอาก์สบวร์กเป็นหนึ่งในเมืองที่เก่าแก่ที่สุด ในจักรวรรดิโรมันอันศักดิ์สิทธิ์ เมื่อสิ้นสุดยุคกลางตอนต้น เอาก์สบวร์กมีความสำคัญมากขึ้นเนื่องจากใช้เป็นสถานที่ สำหรับหนึ่งในการป้องกันที่ประสบความสำเร็จ ต่อการรุกรานของชาวฮังการีในปี 955 ในปี 1276 ความสำคัญนี้ได้ขยายตัวมากขึ้นไปอีก เมื่อเอาก์สบวร์กได้รับสิทธิเป็นนครหลวง จากพระเจ้ารูดอล์ฟ ฟอน ฮับส์บูร์ก ซึ่งเป็นการเปิดทางสู่ศาสนาแห่งความเจริญในอนาคต"
 warsaw_desc: "มีต้นกำเนิดจากการเป็นเมืองประมงขนาดเล็กในมาโซเวีย นครแห่งนี้เริ่มโดดเด่นหลังจากเมืองหลวง ถูกย้ายมาจากคราคูฟ โดยพระเจ้าซิกิมุนด์ที่ 3 ในปี 1596 ตั้งแต่นั้นมามันก็เติบโตอย่างต่อเนื่อง จนกลายเป็นเมืองที่ใหญ่ที่สุดของโปแลนด์ในศตวรรษที่ 18 ในศตวรรษเดียวกันนั้น ที่นี่ได้เห็นการพัฒนาอย่างกว้างขวาง ซึ่งส่งผลต่อวงการสถาปัตยกรรม และงานฝีมือของโปแลนด์"
 tunis_desc: "สถาปนาขึ้นครั้งแรกในชื่อคาร์เธจ โดยพระราชินีไดโดในตำนานเมื่อปี 814 ก่อนคริสตกาล กลายเป็นเมืองหลวงของชนชาติพิวนิกในชื่อเดียวกัน โดยถูกทำลาย และสร้างขึ้นใหม่ในภายหลังโดยชาวโรมัน หลังจากสงครามนองเลือดสามครั้ง นครตูนิสสมัยใหม่ถูกสถาปนาขึ้นโดยชาวอาหรับในปี 698 ณ ชายขอบของซากปรักหักพังโบราณเหล่านี้ การพิชิตของอัลโมฮัดในศตวรรษที่ 12 ได้เห็นการยกฐานะสู่เมืองหลวงของภูมิภาค สถานะที่ถูกรวบรวมโดยวงศ์สกุลฮัฟซิด"
 heidelberg_desc: "ในปลายศตวรรษที่ 12 ไฮเดลแบร์กได้กลายเป็นที่ตั้งของฟัลทซ์กราฟริมไรน์ และปราสาทที่มีชื่อเสียงก็ได้ถูกสร้างขึ้น ไฮเดลแบร์กเป็นที่รู้จักในฐานะที่เป็นที่ตั้งของ มหาวิทยาลัยเยอรมันแห่งแรก ดังนั้นจึงเป็นศูนย์กลางแห่งการเรียนรู้มาอย่างยาวนาน หลังจากนั้นก็ได้กลายเป็นศูนย์กลาง ของการปฏิรูปและความอดกลั้น โดยมีฟัลทซ์กลายเป็นผู้นำของแนวร่วมนิกายโปรเตสแตนต์ในที่สุด ต่อมา ปราสาทและรูปลักษณ์อันเป็นเอกลักษณ์ได้ดึงดูดกวีมากมายมาสู่นคร ซึ่งนำไปสู่การเป็นสัญลักษณ์ของลัทธิจินตนิยม ทำให้เมืองนี้ได้รับสมญานามว่า #italic นครแห่งลัทธิจินตนิยม#!"
 aviles_desc: "ย้อนกลับไปในศตวรรษที่ 10 อาบิเลสเป็นเมืองที่พัฒนาขึ้นตามปากแม่น้ำ ซึ่งมอบความสำคัญทางยุทธศาสตร์ในฐานะเมืองท่า ในปราสาทเกาซอนที่อยู่ใกล้เคียง พระเจ้าอัลฟอนโซที่ 3 แห่งอัสตูเรียสได้ทรงสั่งให้สร้าง กางเขนแห่งชัยชนะเพื่อการถวายพระพร ซึ่งประดับด้วยทองคำ และอัญมณีล้ำค่า และปัจจุบันเป็นสัญลักษณ์ของทั้งราชอาณาจักร ตั้งแต่ศตวรรษที่ 11 เป็นต้นมา อาบิเลสได้กลายเป็นเมืองหลวงของราชวงศ์ เป็นที่ยอมรับในการค้าทางทะเล ตลอดจนการเก็บรักษา และจำหน่ายเกลือ"
 pingjin_desc: "ไท่หยวน ที่ตั้งของศาสนสถานศักดิ์สิทธิ์ศาลเจ้าจิ้น เป็นหนึ่งในเมืองที่สำคัญที่สุดในซานซี และจีนตอนเหนือ มาตั้งแต่ศตวรรษที่ 5 ก่อนคริสตกาล ในปี 979 พระเจ้าฮ่องเต้ซ่งไท่จงทรงสั่งให้นครโบราณจิ้นหยาง ถูกน้ำท่วมและทำลายทิ้งเมื่อครั้งพิชิตฮั่นเหนือ จากนั้นจึงเปลี่ยนชื่อเป็นเขตผิงจิ้น (แปลว่า 'การทำให้ซานซีสงบ') มหันตภัยที่เมืองต้องใช้เวลานานในการฟื้นตัว"
 dunstable_desc: "จากนครโรมันสู่เมืองอาราม มีชื่อเสียงในฐานะราชมณเฑียรของพระเจ้าเฮนรีที่ 1 (1109) กางเขนของเอเลนอร์ (1290) การหย่าร้างของพระเจ้าเฮนรีที่ 8 (1533) และสถานที่เกณฑ์พลของครอมเวลล์ (1642)"
 paderborn_desc: "เขตปกครองมุขนายกสถาปนาขึ้นราวปี ค.ศ. 800 เป็นจุดนัดพบครั้งแรกของพระเจ้าชาร์เลอมาญ และสมเด็จพระสันตะปาปาลีโอที่ 3 ถูกปิดล้อม 16 ครั้งในสงครามสามสิบปี ถูกทำลายย่อยยับโดยกองทัพสวีเดนในปี 1646"
 porto_desc: "ถูกขานนามว่า #italic ซิดาเด อินวิกตา#! หรือ 'นครผู้ไม่พ่าย' มันเป็นที่มาของชื่อโปรตุเกส และทำให้ไวน์พอร์ตแห่งโดรู เป็นที่เลื่องลือไปไกลเกินกว่าชายฝั่งของมัน"
 jiaxing_desc: "เจียซิงเป็นพื้นที่ชายแดนระหว่างภูมิภาคอู๋ และเย่ว์ 'เจีย' หมายถึงความงาม และความเป็นสิริมงคล ในขณะที่ 'ซิง' หมายถึงความมั่งคั่ง และรุ่งเรือง"
 torgau_desc: "ในปี 1452 เจ้านครรัฐผู้คัดเลือกพระเจ้าเฟรเดอริกที่ 2 ได้ทรงสถาปนาบ่อหมีแห่งแรกในทอร์เกา ซึ่งมีการขยายขนาดอย่างสม่เสมอจนถึงปี 1624 โดยมีพื้นที่รองรับหมีได้ถึง 39 ตัว"
 changsha_desc: "นับตั้งแต่การสถาปนา ใจกลางเมืองฉางซายังคงไม่เปลี่ยนแปลงมาเป็นเวลาสองพันปี"
 ningxiang_desc: "#italic จุน#! (ภาชนะใส่เหล้า) สัมฤทธิ์ที่ใหญ่ที่สุดของราชวงศ์ซาง (สามพันปีก่อน) ถูกขุดพบ ณ ที่แห่งนี้"
 wurzburg_desc: "เวิร์ซบูร์กผงาดขึ้นในฐานะกองบัญชาการของฟรังโกเนีย โดยกลายเป็นเขตปกครองมุขนายกในปี 741 ที่นี่เจริญรุ่งเรืองรอบป้อมปราการ และเส้นทางการค้าแม่น้ำไมน์ในช่วงต้นยุคกลาง"
 hanover_desc: "ฮันโนเฟอร์รุ่งเรืองขึ้นจากการตั้งรกรากในยุคกลาง สู่การเป็นนครสำคัญ ในจักรวรรดิโรมันอันศักดิ์สิทธิ์ ปกครองโดยราชวงศ์เวลฟ์ และรุ่งโรจน์ ในฐานะศูนย์กลางแห่งการค้า อำนาจ และวัฒนธรรม"
 osnabruck_desc: "ออสนาบรึค ศูนย์กลางการค้าสมัยยุคกลาง ในจักรวรรดิโรมันอันศักดิ์สิทธิ์ มีชื่อเสียงในฐานะเขตปกครองมุขนายก และเป็นสถานที่จัดการเจรจาสันติภาพแห่งเวสต์ฟาเลีย"
 glasgow_desc: "เกลสกา (กลาสโกว์) สถาปนาขึ้นเป็นเขตปกครองมุขนายกสมัยยุคกลาง รุ่งเรืองอยู่รายรอบอาสนวิหารอันยิ่งใหญ่ ได้รับสถานะเบิร์ก และมีมหาวิทยาลัยที่หล่อหลอมการเรียนรู้ของสกอตแลนด์"
 neva_desc: "ดินดอนสามเหลี่ยมปากแม่น้ำเนวา ครั้งหนึ่งเคยเป็นส่วนหนึ่งของเส้นทางการค้าวารันเจียน-กรีก ได้กลายเป็นเซนต์ปีเตอร์สเบิร์กในปี 1703 และดำรงเป็นเมืองหลวงของรัสเซียมานานกว่า 200 ปี"
 dubno_desc: "ดุบโน ถูกบันทึกครั้งแรกในปี 1100 เติบโตสู่ศูนย์กลางการค้าแห่งโวลิเนีย มีชื่อเสียงจากงานเทศกาลค้าขายและปราสาทปี 1492 ภายหลังเป็นอมตะในวรรณกรรม #italic ตารัส บูลบา#! ของโกโกล"
 baden_desc: "เดิมเป็นที่รู้จักในนาม #italic คิวิตัส ออเรเลีย อาเควนซิส#! หลังสถาปนาโดยชาวโรมัน นครนี้เริ่มใช้ชื่อ 'บาเดิน-บาเดิน' ในช่วงต้นยุคกลาง และเป็นที่มาของชื่อตำแหน่งมาร์เกรฟแห่งบาเดิน"
 erbach_desc: "ในปลายศตวรรษที่ 18 แอร์บัคพัฒนาสู่ศูนย์กลางหลักของการแกะสลักงาช้าง หลังจากเคานต์ฟรานซิสที่ 1 แห่งแอร์บัค ผู้มีความหลงใหลในโบราณวัตถุ ได้มอบเงินอุปถัมภ์แก่สมาคมอาชีพแกะสลักงาช้างท้องถิ่น"
 manhattan_desc: "เดิมเป็นที่อยู่อาศัยของชาวเลนาเป เกาะที่พวกเขาเรียกว่าแมนฮัตตา ถูกซื้อโดยผู้ตั้งรกรากชาวดัตช์ ด้วยสินค้าการค้ามูลค่า 60 กิลเดอร์ ที่นี่พวกเขาจะสร้างป้อมปราการ อันเป็นศูนย์กลางอำนาจของนครนิวอัมสเตอร์ดัม"
 doncaster_desc: "ครั้งหนึ่งเคยเป็นป้อมดานัมของโรมัน เมื่อถึงปี 1337 ดอนคาสเตอร์ได้กลายเป็นเมืองตลาดแห่งยอร์กเชียร์ บนถนนเกรต นอร์ท ที่ซึ่งผู้สัญจรและพ่อค้าลำเลียงสินค้า ระหว่างลอนดอน และทางเหนือ"
 kitchissippi_desc: "ตั้งชื่อตามแม่น้ำคิชิ ซิบิ ที่แห่งนี้ชาวอนิชินาเบเคยล่าสัตว์และค้าขาย จนกระทั่งการตั้งรกราก ของอังกฤษขยายการค้าไม้แปรรูป และภายหลังทำให้ที่นี่เป็นที่ตั้งของการบริหารอาณานิคม"
 saint_marceilin_desc: "สถาปนาในศตวรรษที่ 11 แซ็ง-มาร์เซอแล็งเคยเป็นที่ตั้งสภาโดแฟ็ง ระหว่างปี 1337 และ 1340 เมืองนี้มีชื่อเสียงจากชีสนุ่มผิวขาว ซึ่งถูกจัดถวายแด่หลุยส์ที่ 11 ในปี 1461"
 caerphilly_desc: "แหล่งถ่านหินคุณภาพสูงสุดในยุโรป หุบเขาเวลส์กลายเป็นศูนย์กลางการผลิตเหล็ก ในช่วงครึ่งหลังของศตวรรษที่ 18"
 grenoble_desc: "เกรโนเบิลเป็นเมืองขนาดพอเหมาะแต่สำคัญทางยุทธศาสตร์ ตั้งอยู่ในเทือกเขาแอลป์ของฝรั่งเศส ทำหน้าที่เป็นเมืองหลวงของโดแฟ็ง ล้อมรอบด้วยแม่น้ำและภูเขา ปกป้องโดยกำแพง และข่มขวัญด้วยป้อมปราการบัสตีย์ ชีวิตใจกลางอยู่ที่อาสนวิหาร และถนนแคบ ๆ ที่คดเคี้ยว เต็มไปด้วยพ่อค้า ช่างฝีมือ และชาวชนบทที่นำสินค้ามาจากหุบเขาโดยรอบ"
 kinsale_desc: "คินเซลเป็นเมืองท่าขนาดเล็กทว่าคึกคัก บนชายฝั่งทางใต้ของไอร์แลนด์ กำบังด้วยอ่าวธรรมชาติที่ลึก การประมงและการค้าชายฝั่งเลี้ยงดูประชากรส่วนใหญ่ โดยมีพ่อค้าแลกเปลี่ยนปลาน้ำเค็ม หนังสสัตว์ และขนสัตว์ กับไวน์ เกลือ และสินค้าฟุ่มเฟือยจากไอบีเรีย และฝรั่งเศส ถนนแคบ ๆ รวมตัวกันรอบท่าเทียบเรือ ที่ซึ่งนักเดินเรือท้องถิ่น ปะปนกับพ่อค้าต่างชาติที่แวะเวียนมา แม้จะมีขนาดพอเหมาะ แต่อ่าวของคินเซลทำให้มีความสำคัญทางยุทธศาสตร์ เป็นประตูเชื่อมระหว่างไอร์แลนด์ และยุโรปภาคพื้นทวีป"
 stockton_desc: "สต็อกตันคือการตั้งรกรากของชาวแองโกล-แซกซอน บนฝั่งเหนือของแม่น้ำทีส์ และมีประชากรเบาบางจนกระทั่งมุขนายก ปลดปล่อยทาสติดที่ดินของเมือง ทำให้ช่างฝีมือสนใจย้ายเข้ามา ที่นี่กลายเป็นตลาดสำคัญในการส่งออกขนสัตว์ และนำเข้าไวน์ ทว่ายังไม่มีประชากรเพิ่มขึ้นอย่างมีนัยสำคัญ จนกระทั่งการปฏิวัติอุตสาหกรรม"
 kunow_desc: "ส่วนสำคัญของฐานันดรในเขตปกครองมุขนายกแห่งคราคูฟ โดยมีเขตคริสตจักรดำรงอยู่ตั้งแต่ปี 1281 นามของเมืองน่าจะมาจากตัวมาร์เทน (ภาษาโปแลนด์คือ 'คูนา') ซึ่งชุกชุมในป่าที่ปกคลุมพื้นที่เหล่านี้"
 lublin_desc: "ลูบลินสถาปนาขึ้นเป็นการตั้งรกรากในช่วงรอยต่อศตวรรษที่ 12 และ 13 และได้รับกฎบัตรจากววาดือสวัฟ 'ผู้สูงเพียงศอก' ในปี 1317 ในศตวรรษต่อ ๆ มา นครนี้ได้กลายเป็นศูนย์กลางการค้าที่สำคัญ และในศตวรรษที่ 16 ก็ได้เข้าสู่ยุคทอง มั่งคั่งขึ้นด้วยผลของสหภาพลูบลิน และการค้าที่กว้างขวาง โดยเฉพาะกับทางตะวันออก"
 kendal_desc: "เอนดัลสถาปนาขึ้นพร้อมป้อมโรมันบนฝั่งแม่น้ำเคนต์ ในศตวรรษที่ 1 คริสตกาล เมืองเติบโตภายใต้การปกครองของนอร์มัน ได้รับสิทธิตลาดในปี 1189 จากพระเจ้าริชาร์ดที่ 1 เพื่อแลกกับเงินทุนสำหรับการทำสงครามครูเสด ซึ่งนำความมั่งคั่งมาสู่เมือง ที่นี่กลายเป็นศูนย์กลางการค้าขนสัตว์สมัยยุคกลาง และปราสาทหลักถือครองโดยตระกูลพาร์ ซึ่งมีพระนางแคทเธอรีน พาร์ พระมเหสีของพระเจ้าเฮนรีที่ 8 เป็นสมาชิกที่มีชื่อเสียงที่สุด"
