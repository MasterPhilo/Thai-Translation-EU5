 flatland_desc: "ที่ราบหมายถึงภูมิประเทศ ที่ไม่มีความผันแปรทางภูมิศาสตร์ที่สำคัญ จึงไม่มีอุปสรรคต่อการเคลื่อนทัพของ [army|e] หรือการพัฒนา [building|e]"
 mountains_desc: "ภูมิประเทศแบบเทือกเขามีความสูงจากระดับน้ำทะเลมาก และมีลาดชันสูง โดยมีพื้นที่ราบที่แคบน้อยมาก จึงเป็นเรื่องยากที่ [armies|e] จะข้ามผ่าน และสู้รบ รวมถึงยากต่อการพัฒนาทำเล"
 hills_desc: "ภูมิประเทศแบบเนินเขามีความผันแปรทางภูมิศาสตร์ แต่ความลาดชันนั้นไม่สูง หรือชันเท่าเทือกเขา ดังนั้นบทลงโทษที่ได้รับจึงไม่ร้ายแรงเท่า"
 plateau_desc: "พื้นที่เหล่านี้คือบริเวณที่ค่อนข้างราบซึ่งตั้งอยู่ บนที่สูง จึงมีบทลงโทษบางประการเมื่อเทียบกับ ที่ราบเนื่องจากระดับความสูง"
 wetlands_desc: "$wetlands$ คือภูมิประเทศที่มีน้ำท่วมขังเป็นบางส่วน โดยทั่วไปมักอยู่ใกล้แม่น้ำ ทะเลสาบ หรือชายฝั่ง"
 ocean_desc: "นี่คือทะเลเปิดระหว่างทวีปที่มีเพียง เรือที่ยอดเยี่ยมที่สุดเท่านั้นที่สามารถสัญจรได้"
 deep_ocean_desc: "นี่คือทะเลเปิดระหว่างทวีปในพื้นที่ที่ห่างไกล จากชายฝั่งมากที่สุด ซึ่งมีเพียงเรือที่ยอดเยี่ยมที่สุดเท่านั้นที่สามารถสัญจรได้"
 coastal_ocean_desc: "นี่คือทะเลเปิดระหว่างทวีปในบริเวณที่ใกล้กับ ชายฝั่ง ซึ่งมีเพียงเรือที่ยอดเยี่ยมที่สุดเท่านั้นที่สามารถสัญจรได้"
 inland_sea_desc: "ทะเลปิดหมายถึงทะเลที่ถูกล้อมรอบด้วยแผ่นดิน เช่น ทะเลเมดิเตอร์เรเนียนหรือทะเลบอลติก"
 atoll_desc: "วงแหวนปะการังคือเกาะรูปวงกลมที่มีความสูง จากระดับน้ำทะเลต่ำ ซึ่งมักจะล้อมรอบทะเลสาบน้ำเค็ม"
 narrows_desc: "น่านน้ำแคบคือพื้นที่ทางทะเลที่มีชายฝั่งขนาบข้าง หลายด้าน เช่น ช่องแคบหรือน่านน้ำภายในหมู่เกาะ ซึ่งไม่มีพื้นที่กวางขวางสำหรับการเคลื่อนที่"
 lakes_desc: "ทะเลสาบหมายถึงแหล่งน้ำภายในแผ่นดิน ที่ไม่มีส่วนติดต่อกับทะเลเปิด เว้นแต่ทางแม่น้ำที่อาจเชื่อมถึงได้ ดังนั้นจึงมิมี [ships|e] ที่สำคัญใด ๆ สามารถล่องเรือในแหล่งน้ำนี้ได้"
 high_lakes_desc: "$lakes_desc$"
 #
 plateau_wasteland_desc: "$plateau_desc$"
 mountain_wasteland_desc: "$mountains_desc$"
 hills_wasteland_desc: "$hills_desc$"
 wetlands_wasteland_desc: "$wetlands_desc$"
 dune_wasteland_desc: "$desert_desc$"
 flatland_wasteland_desc: "$flatland_desc$"
 mesa_wasteland_desc: "$desert_desc$"
 ocean_wasteland_desc: "นี่คือน่านน้ำมหาสมุทรที่อยู่นอกเขตกระแสน้ำหลัก จึงมิใช่เส้นทางที่สะดวกสำหรับเรือที่จะสัญจรไป เนื่องจากอาจส่งผลให้ต้องติดค้างอยู่กลางมหาสมุทรได้"
 
 tropical_desc: "$tropical$ หมายถึงพื้นที่ที่มีอุณหภูมิเฉลี่ยสูง และไม่มีฤดูหนาวปรากฏ"
 arid_desc: "$arid$ หมายถึงพื้นที่ซึ่งขาดแคลนทรัพยากรน้ำ อย่างรุนแรง"
 mediterranean_desc: "$mediterranean$ หมายถึงพื้นที่ที่มีภูมิอากาศ อันสมบูรณ์แบบซึ่งเป็นที่ปรารถนาในการอยู่อาศัย"
 continental_desc: "$continental$ หมายถึงพื้นที่ที่มีฤดูหนาว อันเยือกเย็น"
 arctic_desc: "$arctic$ หมายถึงพื้นที่ที่มีฤดูหนาว อันหนาวเหน็บยิ่งนัก"
 cold_arid_desc: "$cold_arid$ หมายถึงพื้นที่ซึ่งขาดแคลนทรัพยากรน้ำ อย่างรุนแรงแต่ยังมีฤดูหนาวปรากฏให้เห็น"
 oceanic_desc: "$oceanic$ หมายถึงพื้นที่ที่มีฤดูหนาวไม่รุนแรง แต่มีความชื้นสูง"
 subtropical_desc: "$subtropical$ หมายถึงพื้นที่ที่มีอุณหภูมิเฉลี่ยสูง และมีฤดูหนาวที่ไม่รุนแรง"
 
 desert_desc: "ทะเลทรายคือภูมิประเทศที่รกร้างว่างเปล่า มีหยาดน้ำฟ้าน้อยมาก และแทบจะไม่มีศักยภาพในการดำรงอยู่ ของพืชพรรณหรือสัตว์ป่า"
 sparse_desc: "พื้นที่เบาบางหมายถึงพื้นที่ราบกว้างขวาง ที่มีต้นไม้ขึ้นอยู่น้อยนิดหรือไม่มีเลย"
 grasslands_desc: "ทุ่งหญ้าหมายถึงภูมิประเทศที่ปกคลุมด้วยหญ้าเป็นหลัก โดยมีต้นไม้หรือพุ่มไม้เพียงน้อยนิดหรือไม่มีเลย"
 farmland_desc: "แดนเพาะปลูกหมายถึงภูมิประเทศที่ถูกสร้างขึ้นโดยมนุษย์ เพื่อใช้ในการเพาะปลูกพืช และ/หรือทำทุ่งหญ้าเลี้ยงสัตว์อันกว้างขวาง"
 woods_desc: "ป่าโปร่งหมายถึงภูมิประเทศที่มีพืชพรรณ หนาแน่นน้อยกว่าป่าไม้"
 forest_desc: "ป่าไม้หมายถึงภูมิประเทศที่มีพืชพรรณหนาแน่น"
 jungle_desc: "ป่าดิบชื้นหมายถึงภูมิประเทศที่มีป่าทึบ และพืชพรรณพันตู อันส่งผลให้การดำเนินการใด ๆ บนที่ดินนั้นเป็นไปอย่างยากลำบาก"

