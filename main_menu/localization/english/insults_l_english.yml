l_english:
 insult_default: "มารดาเจ้าเป็นหนูแฮมสเตอร์ และบิดาเจ้าก็มีกลิ่นเหม็นเยี่ยงผลเอลเดอร์เบอร์รี่!"
 insult_default2: "วันพิพากษามาถึงแล้ว! เหล่าสมุนของลูซิเฟอร์เดินย่ำอยู่บนพิภพ — โอ้ มิใช่หรอก เป็นเพียงพวก [TARGET_COUNTRY.GetAdjective] เท่านั้นเอง"
 insult_default3: "ยิ่งไปกว่านั้น ข้าเชื่อว่า [TARGET_COUNTRY.GetCapital.GetName] จักต้องถูกทำลายเสีย!"
 insult_default4: "เมื่อเรื่องราวในยุคเราถูกจารึกโดยคนรุ่นหลัง พวกเขาจักมองดูเจ้าด้วยความเวทนาปนรังเกียจ ที่เรียกว่าความสงสาร"
 insult_default5: "การเข้าส้วมครั้งล่าสุดของข้า ยังน่าอภิรมย์เสียยิ่งกว่าการร่วมโต๊ะอาหารกับทูต [TARGET_COUNTRY.GetAdjective]"
 insult_default6: "โอ้ ดูนั่นสิ มีเศษขยะโสโครกชิ้นงามอยู่ตรงนี้ด้วย"
 insult_default7: "โลหิตของเจ้าจักชโลมดินแดนที่ข้าชิงมาให้ยิ่งอุดมสมบูรณ์"
 insult_default8: "พวก [TARGET_COUNTRY.GetAdjective] มิรู้อันใดเลยเกี่ยวกับการปกครองประเทศ!"
 insult_default9: "มีปัญหาหนึ่งชุกชุมยิ่งนักใน [TARGET_COUNTRY.GetName] และข้าสงสัยว่าต้นเหตุคือ [TARGET_COUNTRY.GetCulture.GetName]"
 insult_default10: "ในเกมการเมืองอันยิ่งใหญ่นี้ เจ้าเป็นเพียงเบี้ยตัวหนึ่งเท่านั้น"
 insult_default11: "ใน [COUNTRY.GetName] คำว่า '[TARGET_COUNTRY.GetName]' มีความหมายเดียวกับมูลสัตว์"
 insult_default12: "เลื่องลือระบือไกลถึงความชั่วช้าของเจ้า ตั้งแต่ไอร์แลนด์จดไปถึงคาเธ่ย์"
 insult_default13: "วัฒนธรรม [TARGET_COUNTRY.GetAdjective] เป็นสิ่งย้อนแย้งในตัวมันเอง เจ้ามิคิดเช่นนั้นหรือ?"
 insult_default14: "ขอให้ท้องฟ้าของเจ้าเต็มไปด้วยดาวหาง"
 insult_default15: "หามีแผนที่ใดงามได้ยิ่งตราบที่ชาติของเจ้ายังปรากฏอยู่บนนั้น"
 insult_no_army: "เจ้าจักทำอันใดได้ เลือดไหลใส่ข้าหรืออย่างไร?"
 insult_bookkeeping: "สักวันหนึ่ง แม้แต่เหล่าพ่อค้า [TARGET_COUNTRY.GetAdjective] ก็จักเข้าใจการทำบัญชี"
 insult_rome: "บางที ทัพบก ของข้าควรไปพิสูจน์ดูว่าถนนทุกสายมุ่งสู่กรุงโรมจริงหรือไม่"
 insult_heir_hunter: "ข้าได้ยินมาว่าทายาทของเจ้าโปรดปรานการล่าสัตว์ จงระวังตัวให้ดีเถิด จักเป็นที่น่าเสียดายยิ่งหากเกิดอุบัติเหตุที่ไม่คาดฝันขึ้น"
 insult_monarchy: "คนทั้งตระกูลของเจ้าต่างหลงผิดว่าตนนั้นมีความสามารถ"
 insult_european_indian: "ที่นี่หรือคือแหล่งปลูกพริกไทย? ดูเหมือนเราจะมาถึงทันเวลา เก็บเกี่ยวผลผลิตอันอุดมสมบูรณ์..."
 insult_diamonds: "เขากล่าวกันว่าเพชรนั้นเป็นอมตะ และดูเหมือนเจ้าจะมีอยู่มากโขทีเดียว แบ่งให้เราสักนิด แล้วเราจักมาดูกันว่ามันจักอยู่ยงกว่า วงศ์สกุล ของเจ้าหรือไม่"
 insult_christian_muslim: "ช่างน่าแปลกใจที่คนนอกรีตเช่นเจ้า กลับได้ครอบครองดินแดนที่มั่งคั่ง และรุ่งเรืองถึงเพียงนี้ โชคดีที่ในไม่ช้ามันจะถูกแก้ไขให้ถูกต้อง"
 insult_against_bahmanis: "ในไม่ช้าทรัพย์สมบัติทั้งหมดของเจ้าจักตกเป็นของเรา รวมถึงเก้าอี้เทอร์ควอยซ์ อันน่าขันที่เจ้าหวงแหนนักหนาด้วย"
 insult_against_timurid: "เจ้าอาจเป็น ชาติ ที่ดีได้ หากมิได้มัวแต่เข่นฆ่ากันเอง เพื่อแย่งชิงว่าผู้ใดสืบสายเลือด มาจากฆาตกรที่ยิ่งใหญ่ที่สุดแห่งยุค"
 insult_against_deccani: "ในขณะที่เรากำลังสร้างอารยธรรม เจ้ากลับเอาแต่หลบซ่อนตัวอยู่ท่ามกลาง พวกพเนจรแห่งเดกกัน จงก้มหัวเสียเดี๋ยวนี้ มิเช่นนั้นจงเผชิญจุดจบด้วยน้ำมือของทายาทแห่งติมูร์ และเจงกีส"
 insult_portugal_vs_africa_or_india: "เราเดินทางมาไกล และฝ่าฟันภยันตรายมากมายเพื่อมาถึงชายฝั่งของเจ้า ทว่าไม่มีสิ่งใดเตรียมใจเราให้พร้อม สำหรับบาปอันน่าชิงชังในราชสำนักแสนนอกรีตของเจ้าได้เลย"
 insult_against_habsburg: "ราชบัลลังก์ [COUNTRY.GetAdjective] จักมิยอมแปดเปื้อนด้วยสายเลือดอันต้องสาป และอัปลักษณ์ของเจ้า"
 insult_byz_to_ven: "เจ้าคือภัยพิบัติของแผ่นดินนี้ และจักต้องถูกแขวนคอบนกำแพงเมือง ของเจ้าเองสำหรับสิ่งที่เจ้าได้ก่อไว้!"
 insult_guybrush: "เจ้าสู้ได้งุ่มง่ามเยี่ยงวัว!"
 insult_against_guybrush: "เจ้าสู้ได้เงอะงะเยี่ยงชาวนาเลี้ยงโค!"
 insult_low_dipadm: "เศียรของ [TARGET_COUNTRY.GetRuler.GetName] ช่างว่างเปล่าประหนึ่งกางเกงในของขันที"
 insult_cossack_to_turk: "โอ้ สุลต่าน เจ้าปีศาจเติร์ก และโคตรเหง้าเหล่ากอปีศาจผู้ถูกสาปแช่ง เยี่ยงมือเยี่ยงเท้าของลูซิเฟอร์"
 insult_muslim_truce: "เมื่อลูกหลานของเรามองย้อนกลับมาในวันนี้ จักเป็นที่ประจักษ์ว่าแม้เจ้าจักโกนหนวดเคราเราออกได้ แต่เราจักตัดแขนของเจ้าทิ้งเสีย"
 insult_against_denmark: "มีบางสิ่งเน่าเฟะในเดนมาร์ก"
 insult_against_england: "หาก [TARGET_COUNTRY.GetGovernment.GetRuler.GetName] ตกลงไปในแม่น้ำเทมส์ นั่นนับเป็นคราวเคราะห์ แต่หากมีผู้ใดฉุดกระชาก [TARGET_COUNTRY.GetGovernment.GetRuler.GetHerHim] ขึ้นมาอีกครา นั่นย่อมเป็นหายนะ"
 insult_marprelate: "[TARGET_COUNTRY.GetGovernment.GetRuler.GetName] เป็นทั้งสมณะที่หยิ่งยโส ฝักใฝ่ในสันตะปาปา ช่างอวดดี ลบหลู่ความเชื่อ แพร่ระบาด และเป็นตัวกาลีของผู้ชิงราชบัลลังก์"
 insult_marprelate2: "[TARGET_COUNTRY.GetGovernment.GetRulerTitle] ของเจ้านั้นเป็นผู้ปกครองศาสนจักร ที่มิชอบด้วยกฎหมาย ผิดมนุษย์มนา จอมปลอม และสำส่อนยิ่ง เป็นดั่งบัญชาของปีศาจ เจ้าสันตะปาปาผู้น่าสมเพช ผู้ต่อต้านพระคริสต์ ไอ้ปีศาจจำแลง ไอ้จอมกะล่อน และคนลวงโลกตัวฉกาจ"
 insult_against_saxony: "คงเป็นที่น่าเสียดายหากเกิดเรื่องไม่ดีขึ้น กับเครื่องลายครามไมส์เนอร์ของเจ้า..."
 insult_fort: "กำแพงของเจ้าจักพังทลายลงต่อหน้าปืนใหญ่ ของเราเยี่ยงผืนทรายต่อหน้าท้องทะเล"
 insult_revolutionary: "ซากศพของเจ้าจักปูทางสู่ ความก้าวหน้า [TARGET_COUNTRY.GetGovernment.GetRuler.GetName]!"
 insult_monarchy_rank: "สิ่งน่าสมเพชบนหัวเจ้านั่นหรือ คือสิ่งที่ใช้แทน ราชบัลลังก์ ใน [TARGET_COUNTRY.GetName]?"
 insult_low_adm: "ข้าเตรียมคำสบประมาทอีกบทไว้ให้เจ้า แต่ข้าเกรงว่าเจ้าจักอ่านมันไม่ออกเสียมากกว่า"
 insult_against_gbr: "ถึงเวลาแล้วที่ดวงตะวันจะอัสดงลงเหนือจักรวรรดิบริติช"
 insult_from_arabs: "ขอให้เจ้าถูกเย็บทั้งเป็นไว้ในท้องอูฐที่ตายแล้ว"
 insult_against_craven: "ข้าขอแนะนำให้เจ้าเปลี่ยนกางเกงเครื่องแบบ เป็นสีน้ำตาลเสียเถิด"
 insult_against_sinner: "[TARGET_COUNTRY.GetConsort.GetName] ล่วงรู้หรือไม่ว่าเจ้าซ่อน นางกำนัล ไว้ในห้องบรรทมกี่นางกัน?"
 insult_against_hre: "เจ้าหาได้มีความศักดิ์สิทธิ์ หาได้เป็นโรมัน และหาได้เป็นจักรวรรดิไม่"
 insult_against_serbia: "นกอินทรีของเจ้ามีสองหัว แต่กลับหามี ราชบัลลังก์ แม้เพียงหนึ่งเดียวไม่"
 insult_against_european_in_india: "ถึงเวลาที่เจ้าต้องไปแล้ว"
 insult_japanese: "แม้แต่การทำเซ็ปปูกูก็ไม่อาจ กอบกู้เกียรติยศของเจ้าคืนมาได้"
 insult_loans: "สภาวะเศรษฐกิจอันย่ำแย่ของเจ้านั้น เป็นคำเตือนแก่เหล่า ผู้ปกครอง ทั้งปวง"
 insult_rebels: "ข้าได้ยินมาว่า ราษฎร ของเจ้ากำลังก่อขบถ และตัวเจ้าเองก็น่ารังเกียจพอกัน"
 insult_low_mil_tech: "ทหาร ของเจ้าเล็งเป้าให้ถูกโรงนาได้หรือยัง หรือพวกมันยังนึกว่าปืนคาบศิลาคือกระบองอยู่?"
 insult_golden_horde_vs_muscovy: "พวกพนักงานเก็บส่วยจอมโอหังอย่างพวกเจ้า ควรเจียมตัวเสียบ้าง ว่าต้องถูกเหยียบย่ำอยู่ใต้เกือกม้าของเรา!"
 insult_wallachia_to_ottomans: "เราจักเสียบประจาน [TARGET_COUNTRY.GetGovernment.GetRuler.GetName] ไว้บนยอดหอก เหมือนที่เราทำกับ กองทัพ อันน่าเวทนาของเจ้า"
 insult_barbary_pirates: "เจ้าหลอกหลอนน่านน้ำเมดิเตอร์เรเนียนมานานเกินไปแล้ว เจ้า โจรสลัด ต้องสาป!"
 insult_turkish_drunkard: "เจ้าคือสุลต่านแห่งรูมจริง ๆ สินะ เจ้าหมูขี้เมา!"
 insult_against_england2: "ราชอาณาจักรของเจ้านั้น มีค่าเพียงแค่ม้าตัวเดียวจริงๆ"
 insult_against_scotland: "เราจักพรากชีวิตของพวกเจ้า และอิสรภาพของพวกเจ้าด้วย!"
 insult_for_buddhists: "ขอให้เจ้าต้องเวียนว่ายตายเกิดในสังสารวัฏ และใช้ชีวิตนับพันภพชาติโดยไร้ซึ่งความสุข หรือความประจักษ์แจ้ง"
 insult_for_persians: "ห่าฝนธนูของเราจักบดบังดวงตะวัน!"
 chinese_insult_1: "ข้าได้ยินมาว่า [TARGET_COUNTRY.GetGovernment.GetRuler.GetName] เป็นผู้ศรัทธาใน [TARGET_COUNTRY.GetReligion.GetName] อย่างแรงกล้า ซึ่งนั่นจักเป็นตัวตัดสินชะตากรรมของ [TARGET_COUNTRY.GetGovernment.GetRuler.GetHerHim] ในชาติหน้า แต่ทว่าคือ องค์จักรพรรดิ ต่างหากที่จักเป็นผู้ตัดสินชะตาของเจ้าในชาตินี้"
 chinese_insult_2: "จงแสดงความนอบน้อมต่อ องค์จักรพรรดิ และเสวยสุขในชีวิตเถิด มิเช่นนั้นเจ้าจักได้เผชิญหน้ากับกองทัพสวรรค์!"
 chinese_insult_3: "ความชั่วช้าของเจ้าที่ผ่านมาเป็นเพียง แผลถลอกเล็กน้อยเท่านั้น จงแก้ไขเสียก่อนที่มันจะอักเสบจนเกินเยียวยา"
 insult_explorer_vs_africa_or_india: "เจ้ามีธงหรือไม่?"
 insult_republic_to_monarchy: "ฟังนะ การที่มีสตรีแปลกหน้ามานอนในหนองน้ำ แล้วเที่ยวแจกจ่ายดาบนั้น มิใช่รากฐานของระเบียบ การปกครอง อำนาจบริหารสูงสุดต้องมาจากอาณัติของมวลชน มิใช่จากพิธีกรรมทางน้ำอันน่าหัวร่อ"
 insult_from_pirates_1: "เจ้าเพิ่งพูดอันใดกับข้า เจ้าคนพาล? ข้าล่องเรือไปทั่วทั้งเจ็ดคาบสมุทร และมีการบุกยึดเรือมาแล้วกว่าร้อยครั้ง"
 insult_from_pirates_2: "ข้าจักสาดกระสุนปูพรมใส่เจ้าให้ยับ และเจ้าจักต้องสำลักมันตาย เจ้าจมแน่ เจ้าคนระยำ"
 insult_from_pirates_3: "หากเจ้ายังคงเอาแต่ดื่มเหล้ารัม โลกนี้จักพ้นภาระจากคนถ่อยที่สกปรกโสโครกในเร็ววัน!"
 insult_from_pirates_4: "ข้าเคยเลี้ยงสุนัขที่ฉลาดกว่าเจ้าเสียอีก"
 insult_from_pirates_5: "ข้าให้เจ้าเลือก เจ้าจักยอมถูกคว้านท้อง หรือจะถูกตัดหัว!"
 insult_to_pirates_1: "เจ้าเป็น โจรสลัด ที่ห่วยที่สุดเท่าที่ข้าเคยได้ยินชื่อมาเลยจริงๆ"
 insult_jungle: "จริงอยู่ ข้ายอมรับว่า [TARGET_COUNTRY.GetName] นั้นไพศาลกว่า [COUNTRY.GetName] แต่เจ้าต้องยอมรับว่า [COUNTRY.GetGovernment.GetRuler.GetName] ปกครองเหล่าบุรุษ ในขณะที่ [TARGET_COUNTRY.GetName] ปกครองเพียงป่าเขาและยุง"
 insult_german_humor: "เขากล่าวกันว่า อารมณ์ขันของชาวเยอรมันนั้นมิใช่เรื่องตลกเลย"