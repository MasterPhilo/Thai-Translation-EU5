l_english:

#Misc
  generic_colonize_explore: "ย่างกรายสู่ดินแดนลี้ลับ"
  generic_colonize_explore_DESCRIPTION: "เสียงเรียกจากเส้นขอบฟ้าอันห่างไกล และดินแดนไร้เจ้าของ ปลุกเร้าปณิธานของพวกเรา เราจักต้องทำแผนที่ท้องทะเล ค้นพบดินแดนใหม่ และแผ่อิทธิพลเพื่อประกันความมั่งคั่ง ของแว่นแคว้นในกาลข้างหน้า"
  generic_colonize_explore_CRITERIA_DESCRIPTION: "พวกเราได้เริ่มการสำรวจน่านน้ำที่ยังไม่มีในแผนที่ หรือได้วางรากฐานสำหรับการขยายอาณานิคม เป็นที่เรียบร้อยแล้ว"
  generic_colonize_explore_BUTTON_TOOLTIP: "ดินแดนลี้ลับมอบศักยภาพอันไร้ขีดจำกัด ทั้งในด้านความเจริญ ความมั่งคั่ง และเกียรติภูมิ เราจักต้องไขว่คว้ามันไว้"
  generic_colonize_explore_BUTTON_DETAILS: "โลกกว้างใหญ่ไพศาลภายนอกพรมแดนของเรา เต็มไปด้วยความลี้ลับ และโอกาสมากมาย ด้วยการสำรวจภูมิภาคที่ยังไร้ชื่อและจัดตั้งนิคม เราย่อมสามารถรักษาที่ทางของตนในประวัติศาสตร์ และกำหนดชะตากรรมของแว่นแคว้นเราได้!"

#Missions
  mission_hire_explorer: "จ้างนักสำรวจ"
  mission_hire_explorer_desc: "เราต้องการนักสำรวจที่เปี่ยมความสามารถ เพื่อเข้าควบคุมดินแดนลี้ลับอย่างเหมาะสม"
  mission_chart_horizon: "บันทึกเส้นขอบฟ้า"
  mission_chart_horizon_desc: "การเดินทางของเหล่านักผจญภัยทั้งทางบก และทางทะเล จักเข้าครอบครองเส้นขอบฟ้า ทำการสำรวจและสร้างแผนที่ของดินแดน ที่ไม่เคยมีผู้ใดในหมู่พวกเราได้พานพบมาก่อน"
  mission_new_maps: "แผนที่ใหม่"
  mission_new_maps_desc: "เพื่อให้เข้าใจถึงความสำคัญของการค้นพบใหม่ได้อย่างถ่องแท้ เราจักต้องผลักดันการส่งกองสำรวจเพื่อจดบันทึก และจัดทำแผนที่ดินแดนเหล่านั้นให้เสร็จสิ้น"
  mission_overseas_efforts: "ความมานะในแดนโพ้นทะเล"
  mission_overseas_efforts_desc: "เป็นที่ประจักษ์แล้วว่าพวกเรากำลังยืนอยู่ บนหน้าประวัติศาสตร์ของยุคสมัยใหม่ การกรีธาทัพออกไปเพื่ออ้างสิทธิ์ในดินแดนลี้ลับ คือการจารึกชื่อของพวกเราไว้ ในพงศาวดารสืบไปนับศตวรรษ"
  mission_settle_horizon: "ตั้งรกรากเหนือขอบฟ้า"
  mission_settle_horizon_desc: "ความต้องการขยายดินแดนทำให้ คณะที่ปรึกษาเห็นพ้องกับแนวคิด ในการส่งผู้คนไปยังนิคมที่มีศักยภาพ การไหลเข้าของผู้ตั้งรกราก จะนำไปสู่การเผยแพร่องค์ความรู้ และการรับเอานวัตกรรมตลอดจนวัตถุดิบใหม่ๆ อย่างไม่ต้องสงสัย"
  mission_colonial_ambitions: "ปณิธานแห่งอาณานิคม"
  mission_colonial_ambitions_desc: "การตั้งรกรากบนชายฝั่งต่างแดน และการใช้ทรัพยากรเหล่านั้น เป็นหนทางอันยอดเยี่ยมในการขยายขอบเขตทางพาณิชย์ และส่งผลถึงอำนาจของพวกเราด้วย ด้วยเหตุนั้น เราจักต้องแสวงหาการจัดตั้งบริวารใต้อาณานิคม ที่พร้อมจะรับใช้และส่งเสริมผลประโยชน์ของพวกเรา"


#Tooltips
  land_explo_key: "หากเราทำภารกิจสำเร็จโดยมี [exploration|e] ทางบกอย่างน้อย #Y 1#! รายการ:"
  yes_land_explo_bonus_tt: "@trigger_yes! $land_explo_key$"
  no_land_explo_bonus_tt: "@trigger_no! $land_explo_key$"
  sea_explo_key: "หากเราทำภารกิจสำเร็จโดยมี [exploration|e] ทางทะเลอย่างน้อย #Y 1#! รายการ:"
  yes_sea_explo_bonus_tt: "@trigger_yes! $sea_explo_key$"
  no_sea_explo_bonus_tt: "@trigger_yes! $sea_explo_key$"
  mission_colonial_ambitions_tt: "หนึ่งใน [subjects|e] ของเราจะได้รับ #G การลดลง#! ของค่า [liberty_desire|e]"
  mission_settle_horizon_tt: "อาจเกิด [events|e] รายเดือนเกี่ยวกับนิคมอาณานิคมของเรา ในระหว่างที่ [mission_task|e] นี้ยังดำเนินอยู่"
  
 

#Events

  generic_colonial_exploration_events.1.title: "เหล่านักผจญภัยคู่แข่ง"
  generic_colonial_exploration_events.1.desc: "ยุคสมัยอันยิ่งใหญ่แห่งการทำแผนที่เส้นขอบฟ้า ได้นำพาเหล่านักเดินเรือ และนักผจญภัยผู้ช่ำชองรุ่นใหม่ที่กระหาย จะเปิดโปงความลับของดินแดนลี้ลับ ในหมู่พวกเขานั้น มีนักสำรวจชื่อก้องหลายคน เช่น [target_character_1.GetName] และ [target_character_2.GetName] ที่ก้าวขึ้นมาโดดเด่น ซึ่งต่างคนต่างก็หิวโหยที่จะออกเดินทาง เพื่อสร้างชื่อเสียงให้แก่ตนเอง\n\nธรรมชาติของการแข่งขันได้ผลักดันทั้งคู่ให้ก้าวไปสู่จุดที่สูงยิ่งขึ้น พยายามที่จะเหนือกว่าอีกฝ่ายทั้งในด้านทักษะและปณิธาน ขณะที่การเป็นคู่อริทวีความรุนแรงขึ้น หนึ่งในพวกเขาก็เริ่มที่จะฉายแววโดดเด่น ด้วยพรสวรรค์อันเป็นเลิศที่เปล่งประกายยิ่งกว่าครั้งใดๆ พร้อมที่จะนำพาผู้คนของเราไปสู่เกียรติยศที่ยิ่งใหญ่กว่าเดิม"
  generic_colonial_exploration_events.1.a: "สนับสนุน [target_character_1.GetNameWithNoTooltip]"
  generic_colonial_exploration_events.1.b: "[target_character_2.GetNameWithNoTooltip] จะนำเราไปสู่เกียรติภูมิ!"
  generic_colonial_exploration_events.1.c: "แล้ว [target_character_3.GetNameWithNoTooltip] เล่า?"
  generic_colonial_exploration_events.1.d: "ความยิ่งใหญ่เช่นนี้มิอาจถูกกักขังไว้ด้วยเพียงตัวบุคคล!"
  next_completed_exploration_will_fire_event_tt: "การ [exploration|e] ครั้งถัดไปที่เราทำสำเร็จภายในระยะเวลา #Y 10#! ปี จะส่งผลให้เกิด [event|e]"

  generic_colonial_exploration_events.2.title: "อนาคตแห่งการสำรวจ"
  generic_colonial_exploration_events.2.desc: "หลังจากหลายเดือนแห่งการเดินทางอันเต็มไปด้วยภยันตราย และการทำแผนที่อย่างพิถีพิถัน นักสำรวจของเราได้กลับมาพร้อมกับ บันทึกรายละเอียดของดินแดนอันห่างไกล และน่านน้ำที่ยังไม่มีในแผนที่ การค้นพบของพวกเขานั้นไม่ธรรมดา โดยมอบทั้งโอกาสในทันทีสำหรับการส่งกองสำรวจเพิ่มเติม และข้อมูลเชิงลึกที่สามารถต่อยอดวิทยาการการเดินเรือได้\n\nอย่างไรก็ตาม [ROOT.GetCountry.GetGovernment.GetCourtTitle] ยังคงมีความเห็นแตกแยกกัน ถึงวิธีการที่ดีที่สุดในการใช้ขุมทรัพย์ทางปัญญานี้ ฝ่ายหนึ่งโต้แย้งว่าควรเสริมอำนาจให้นักสำรวจ ที่มีแววที่สุดเพื่อขยายขอบเขตออกไปอีก ขณะที่อีกฝ่ายเสนอว่าควรนำการค้นพบเหล่านี้ ไปแปรเปลี่ยนเป็นความก้าวหน้าทางนวัตกรรม เพื่อเป็นประโยชน์แก่ชนรุ่นหลัง การตัดสินใจในครั้งนี้จะกำหนดทิศทางความพยายาม ในการสำรวจของประชากรเราอย่างแน่นอน"
  generic_colonial_exploration_events.2.a: "สนับสนุนทุนการวิจัยในอนาคต"
  generic_colonial_exploration_events.2.b: "สนับสนุนเหล่านักสำรวจของเราในตอนนี้"

  generic_colonial_exploration_events.3.title: "อนาคตแห่งการสำรวจ"
  generic_colonial_exploration_events.3.desc: "เหล่าผู้ตั้งรกรากใน [target_charter.GetName] ได้เสนอแผนการที่จะเปลี่ยนความเชื่อ ของชนพื้นเมืองในท้องถิ่นให้มาเป็น [ROOT.GetCountry.GetReligion.GetName] และเปลี่ยนวัฒนธรรมให้เป็น [ROOT.GetCountry.GetCulture.GetName] ในเวลาต่อมา ด้วยความเชื่อที่ว่าความพยายามดังกล่าว ไม่เพียงแต่จะนำมาซึ่งความสว่างไสวทางจิตวิญญาณ แต่ยังช่วยกระชับความร่วมมือกับนิคมให้แน่นแฟ้นยิ่งขึ้น\n\nด้วยการยอมรับในวิถีทางของเรา ชนพื้นเมืองย่อมสามารถสนับสนุนการเติบโต และความมั่งคั่งของนิคมได้โดยตรงยิ่งขึ้น อย่างไรก็ดี ความพยายามเช่นนี้จำเป็นต้องได้รับการสนับสนุน ทางการเงินอย่างมหาศาลจาก [ROOT.GetCountry.GetCapital.GetName] เพื่อเป็นทุนในการเผยแผ่ความเชื่อและโครงการทางวัฒนธรรม ในขณะที่บางคนมองว่านี่เป็นการลงทุน ที่สำคัญสำหรับอนาคตของกฎบัตร แต่อีกบางส่วนกลับเตือนถึงการเข้าไปแทรกแซง วิถีชีวิตของชนพื้นเมือง ด้วยเกรงว่ามันอาจจะทำลายสมดุล อันเปราะบางภายในจังหวัดลงได้"
  generic_colonial_exploration_events.3.a: "เราจะสนับสนุนเงินทุนให้แก่ความพยายามเหล่านี้"
  generic_colonial_exploration_events.3.b: "อย่าได้ไปขัดขวางสถานะเดิมที่เป็นอยู่เลย"
  natives_left_undisturbed_tt: "#italic ชนพื้นเมืองใน [target_charter.GetNameWithNoTooltip] จะไม่ถูกรบกวน#!"

  generic_colonial_exploration_events.4.title: "นิคมเริ่มได้รับความนิยม"
  generic_colonial_exploration_events.4.desc: "ข่าวคราวเกี่ยวกับดินแดนอันกว้างใหญ่ และโอกาสที่น่าสนใจใน [target_charter.GetName] เริ่มแพร่กระจายไปทั่วแผ่นดินแม่ ทั้งพ่อค้า เกษตรกร และครอบครัวที่รักการผจญภัย ต่างพากันหลงใหลในเรื่องเล่าขานเกี่ยวกับความมั่งคั่ง และเสรีภาพในโลกใหม่นี้\n\nด้วยแรงกระตุ้นจากความสำเร็จ ของผู้ตั้งรกรากในยุคบุกเบิก หลายคนกำลังเตรียมตัวที่จะเดินทางข้ามน้ำ ข้ามทะเลเพื่อแสวงหาชีวิตที่ดีกว่า กระแสความสนใจที่เพิ่มขึ้นนี้สัญญาว่า จะช่วยเสริมสร้างประชากรของนิคม และเร่งการพัฒนาให้รวดเร็วยิ่งขึ้น เปลี่ยนโฉมหน้าของมันให้กลายเป็นศูนย์กลางของกิจกรรม และความเจริญรุ่งเรือง"
  generic_colonial_exploration_events.4.a: "เราได้แต่เพียงหวังว่าแนวโน้มนี้จะดำเนินต่อไป"