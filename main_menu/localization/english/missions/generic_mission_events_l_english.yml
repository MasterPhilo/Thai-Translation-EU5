l_english:

 generic_mission_events.4.title: "[arguing_estate.GetNameWithNoTooltip] ประท้วงใน [target_location.GetNameWithNoTooltip]"
 generic_mission_events.4.desc: "[arguing_estate.GetName] แสดงความกังวลที่เพิ่มขึ้น ต่ออิทธิพลที่มากขึ้นของฐานันดร [mission_target_estate.GetName] ภายในราชสำนักของเรา ใน [target_location.GetName] การประท้วงของพวกเขารุนแรงขึ้น โดยกล่าวหาว่า [target_character.GetName] ลำเอียงและละเลย ขนบประเพณีแห่งดุลอำนาจ\n\nความไม่สงบนี้ขู่ว่าจะทำลาย เสถียรภาพของความร่วมมือที่จัดสรรไว้อย่างรอบคอบ ระหว่างฐานันดรต่าง ๆ และบั่นทอนความเป็นหนึ่งเดียวภายใน [ROOT.GetCountry.GetFlavorRank] ของเรา ที่ปรึกษาและเจ้าหน้าที่ปกครองท้องถิ่น แนะนำอย่างยิ่งให้เราเข้าแทรกแซง ก่อนที่การประท้วงจะลุกลามไปทั่วทั้งเมืองหลวง"
 generic_mission_events.4.a: "เราจะไม่รับฟัง [arguing_estate.GetNameWithNoTooltip]"
 generic_mission_events.4.b: "คำร้องเรียนของพวกเขามีเหตุผลอยู่บ้าง"
 generic_mission_events.4.c: "[target_character.GetShortNameWithNoTooltip] จะทำให้พวกเขาสงบปากลงเอง!"
 generic_mission_events.4.d: "เรื่องเหล่านี้มิใช่ธุระกงการของเรา"
 upset_both_estates_devastate_target_location_tt: "การประท้วงอาจลุกลามจนเกินควบคุม และทำลาย [target_location.GetName] ในท้ายที่สุด"
 protests_die_down_tt: "การประท้วงยุติลงอย่างรวดเร็ว"

 generic_mission_events.5.title: "[target_character2.GetName] ร้องขอการบริจาค"
 generic_mission_events.5.desc: "[target_character2.GetName] ได้เข้าพบ [target_character1.GetName] พร้อมกับข้อเสนอที่ผ่านการคำนวณมาอย่างดี การบริจาคอย่างเผื่อแผ่แก่ฐานันดร [mission_target_estate.GetName] [target_character2.GetSheHe] แย้งว่า จะสร้างเงื่อนไขที่จำเป็นต่อการขยาย บทบาทของ [target_character2.GetHerHis] ภายใน [ROOT.GetCountry.GetGovernment.GetCabinetTitle]\n\nข้อเสนอนี้เกี่ยวข้องกับการเสริมสร้าง ฐานะส่วนตัวของ [target_character2.GetHerHis] มากพอ ๆ กับการกระชับ ความผูกพันระหว่าง [ROOT.GetCountry.GetFlavorRank] ของเรากับเหล่าฐานันดร"
 generic_mission_events.5.a: "ยื่นข้อเสนอที่ [target_character2.GetSheHe] มิอาจปฏิเสธได้"
 generic_mission_events.5.b: "เราไม่มีงบประมาณเพียงพอสำหรับการบริจาคเหล่านี้"

 generic_mission_events.6.title: "ฎีกาเพื่อการกระจายอำนาจปกครอง"
 generic_mission_events.6.desc: "[mission_target_estate.GetName] ได้ยื่นฎีกาอย่างเป็นทางการ เพื่อเรียกร้องให้กลับไปสู่ หลักอภิบาลแบบกระจายอำนาจ พวกเขาโต้แย้งว่าควรคืนอำนาจให้แก่ ผู้บริหารท้องถิ่น แทนที่จะรวมศูนย์ไว้ในมือของ [target_character.GetName] เพียงผู้เดียว\n\nการเคลื่อนไหวนี้ถูกมองว่า เป็นความพยายามที่จะลดทอนอำนาจที่เพิ่มขึ้นของ [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] และเพื่อปรับเปลี่ยนงบดุลของอิทธิพล ภายใน [ROOT.GetCountry.GetGovernment.GetCourtTitle] ของเรา"
 generic_mission_events.6.desc.generic: "เหล่าฐานันดรได้ยื่นฎีกาอย่างเป็นทางการ เพื่อเรียกร้องให้กลับไปสู่ หลักอภิบาลแบบกระจายอำนาจ พวกเขาโต้แย้งว่าควรคืนอำนาจให้แก่ ผู้บริหารท้องถิ่น แทนที่จะรวมศูนย์ไว้ในมือของ [target_character.GetName] เพียงผู้เดียว\n\nการเคลื่อนไหวนี้ถูกมองว่า เป็นความพยายามที่จะลดทอนอำนาจที่เพิ่มขึ้นของ [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] และเพื่อปรับเปลี่ยนงบดุลของอิทธิพล ภายใน [ROOT.GetCountry.GetGovernment.GetCourtTitle] ของเรา"
 generic_mission_events.6.a: "เราจะให้ความร่วมมือ"
 generic_mission_events.6.b: "พวกเขามิอาจมาชี้นิ้วสั่ง นโยบายของ [target_character.GetNameWithNoTooltip] ได้!"

 generic_mission_events.7.title: "[target_pop_scope.GetNameWithNoTooltip] นำความเจริญมาสู่ [target_province.GetNameWithNoTooltip]"
 generic_mission_events.7.desc: "ด้วยความร่วมมือของเรากับฐานันดร [mission_target_estate.GetName] ทำให้เหล่า [target_pop_scope.GetName] มีความสุขกับยุคสมัยแห่งความรุ่งเรือง ความสำเร็จของพวกเขาได้แปรเปลี่ยนเป็น ความก้าวหน้าที่ประจักษ์ชัดไปทั่วทั้ง [target_province.GetName]\n\nการพัฒนานี้เป็นข้อพิสูจน์ถึง ประโยชน์ของการร่วมมือกัน และนโยบายที่มีประสิทธิภาพซึ่งประกาศใช้โดย [ROOT.GetCountry.GetGovernment.GetCourtTitle] ของเรา ภายใต้การดูแลของ [target_character.GetShortName]"
 generic_mission_events.7.a: "ข้อพิสูจน์ถึงการอยู่ร่วมกันอย่างผาสุก!"
 generic_mission_events.7.b: "ทั้งหมดนี้เป็นเพราะนโยบายของ [target_character.GetShortNameWithNoTooltip]!"
 member_of_the_mission_target_estate_may_approach_us_again_after_months_tt: "[estate|e] อาจเข้าพบเราอีกครั้งในอีกไม่กี่เดือนข้างหน้า"

 generic_mission_events.8.title: "ขั้นตอนการรวมดินแดน"
 generic_mission_events.8.desc: "การรวมดินแดน [mission_target_subject.GetName] ดำเนินไปภายใต้การดูแลของ [target_character1.GetName] โดยที่ [mission_target_subject.Custom('GetRulerOrRegentTitle')] แห่ง [mission_target_subject.GetName] นามว่า [target_character2.GetName] ยังคงทำหน้าที่ปกครองจาก [target_location.GetName]\n\nความคืบหน้าเป็นไปอย่างมั่นคง และมีสัญญาณบ่งชี้ถึง การรวมดินแดนที่ราบรื่น หากกระบวนการนี้ดำเนินต่อไปโดยไม่ถูกรบกวน พวกเขาจะถูกรวมเข้าเป็นส่วนหนึ่ง อย่างสมบูรณ์ในที่สุด"
 generic_mission_events.8.a: "เราสามารถใช้แรงขับเคลื่อนนี้ให้เป็นประโยชน์"
 generic_mission_events.8.b: "ช้าแต่ชัวร์..."

 generic_mission_events.9.title: "อุบัติการณ์ทางการทูต"
 generic_mission_events.9.desc: "กระบวนการรวมดินแดนนั้นเป็นเรื่องที่ซับซ้อน ความไม่ลงรอยทางกฎหมาย และการรวมเข้าด้วยกัน ของกรอบแนวคิดทางหลักนิติธรรมสองแบบ ที่มักจะแตกต่างกัน สามารถนำไปสู่อุบัติการณ์ทางการทูต และอุปสรรคระหว่างทางได้โดยง่าย เหตุการณ์เช่นนี้เพิ่งเกิดขึ้นเมื่อไม่นานมานี้ ความผิดพลาดล่าสุดนี้มีแนวโน้มจะสร้าง ความเสียหายต่อความพยายามในการรวมดินแดนของเรา"
 generic_mission_events.9.a: "ไม่มีสิ่งใดที่ [target_character1.GetShortNameWithNoTooltip] จะเจรจาใหม่ไม่ได้"
 generic_mission_events.9.b: "นี่เป็นอุปสรรคต่อความก้าวหน้าของเราอย่างแน่นอน"
 generic_mission_events.9.c: "ดำเนินการต่อไปอย่างเด็ดขาด!"
 diplomatic_abilities_of_target_character_prevent_any_negative_incident: "ค่า [dip|e] ของ [target_character1.GetName] จะไม่ยอมให้อุบัติการณ์นี้ ส่งผลกระทบต่อกระบวนการรวมดินแดน"

 generic_mission_events.10.title: "การเรียนรู้ทางวัฒนธรรม"
 generic_mission_events.10.desc: "เมื่อ [mission_target_subject.GetName] ถูกรวมเข้ากับ [ROOT.GetCountry.GetFlavorRank] ของเรา เราพบว่าตนเองได้รับความมั่งคั่ง จากขนบประเพณีและวิถีทางของพวกเขา การแลกเปลี่ยนทั้งทางภาษา ศิลปะ และจารีตประเพณี ได้เริ่มหล่อหลอมประชากรทั้งสองฝ่าย\n\nการแลกเปลี่ยนทางวัฒนธรรมนี้ อาจเป็นหนึ่งในประโยชน์ระยะยาวที่ยิ่งใหญ่ที่สุด ของการรวมดินแดน และเหล่าผู้สร้างสรรค์งานศิลป์ของเรา จะได้รับประโยชน์จากสิ่งนี้ไปอีกหลายปี..."
 generic_mission_events.10.a: "วัฒนธรรม [target_culture.GetNameWithNoTooltip] รุ่งโรจน์สืบไป!"
 generic_mission_events.10.b: "เราสามารถดึงดูดผู้คนที่ยอดเยี่ยมที่สุดของพวกเขามาได้"

 generic_mission_events.11.title: "ความขัดแย้งระหว่าง [target_culture.GetNameWithNoTooltip] และ [target_culture2.GetNameWithNoTooltip]"
 generic_mission_events.11.desc: "แม้การรวมกันทางการเมืองจะดำเนินอยู่ แต่ความปรองดองทางวัฒนธรรมยังคงเป็นสิ่งที่ไขว่คว้าได้ยาก ประชากร [target_culture.GetNameWithNoTooltip] และ [target_culture2.GetNameWithNoTooltip] เริ่มปะทะกันในเรื่องจารีตประเพณี ภาษา และความขุ่นเคืองจากการถูกดูหมิ่น\n\nที่ปรึกษาบางคนของเรากระซิบว่า สถานการณ์อาจคลี่คลายได้ง่ายขึ้น หากโยนความผิดไปที่บุคคลใดบุคคลหนึ่งเพียงคนเดียว ขณะที่คนอื่นมองว่าเป็นเรื่องปกติ ที่จะเห็นความขัดแย้งทางวัฒนธรรม ในการรวมตัวกันของสองรัฐที่มีความแตกต่างกัน"
 generic_mission_events.11.a: "สิ่งนี้จะส่งผลเสียต่อแนวหน้าทางการทูตของเรา"
 generic_mission_events.11.b: "โยนความผิดทั้งหมดไปที่ [target_scapegoat_character.GetNameWithNoTooltip] เสีย!"

 generic_mission_events.12.title: "ความสัมพันธ์ทางการทูตกับ [target_overlord.GetNameWithNoTooltip]"
 generic_mission_events.12.desc: "[target_overlord.GetName] ได้ดำเนินการเพื่อกระชับความสัมพันธ์กับเรา ไม่ว่าจะมีมูลเหตุจากความกังวลทางยุทธศาสตร์ หรือความสนใจอย่างแท้จริง ความพยายามของพวกเขาที่จะดึงเราเข้าไปใกล้ชิดยิ่งขึ้นนั้น มิอาจรอดพ้นสายตาเราไปได้\n\nมีเพียงกาลเวลาเท่านั้นที่จะพิสูจน์ว่า ท่าทีเหล่านี้มีความจริงใจ หรือเป็นเพียงส่วนหนึ่งของอุบายที่ลึกซึ้งกว่า สำหรับตอนนี้ เราจักต้องเฝ้าระวังและสังเกตการณ์สถานการณ์ ที่กำลังดำเนินไปอย่างใกล้ชิด"
 generic_mission_events.12.a: "เราจะเฝ้าดูความเคลื่อนไหวของพวกเขา ด้วยความสนใจยิ่ง!"
 overlord_info_generic_vassal_mission_pack_tt: "[target_overlord.GetName] กำลังดำเนินภารกิจ [ShowMissionName('generic_vassal_ties')] [mission|e] ต่อเราอย่างแข็งขัน"

 generic_mission_events.13.title: "ความเจริญของ [target_location.GetNameWithNoTooltip]"
 generic_mission_events.13.desc: "[target_location.GetName] อันเป็น [target_location.GetRank.GetName] ที่โดดเด่นซึ่งตั้งอยู่ใน [target_province.GetName] ได้เปลี่ยนโฉมอย่างรวดเร็วสู่การเป็น ศูนย์กลางการพาณิชย์และหลักอภิบาลที่กำลังรุ่งเรือง เหล่าพ่อค้าต่างหลั่งไหลมายังตลาด ช่างฝีมือต่างก่อตั้งโรงปฏิบัติงานใหม่ และเจ้าหน้าที่ท้องถิ่นแผ่ขยายอิทธิพลของตน เมื่อ [target_location.GetRank.GetNameWithNoTooltip] เติบโตขึ้นทั้งในด้านความมั่งคั่งและอำนาจ ซึ่งนี่เป็นผลลัพธ์จากการที่เรามุ่งเน้น การรวมอำนาจภายใน [ROOT.GetCountry.GetFlavorRank] ของเราอย่างไม่ต้องสงสัย และเป็นสัญญาณของสิ่งที่จะเกิดขึ้น ภายใต้การนำอันชาญฉลาดของ [target_character.GetName]"
 generic_mission_events.13.a: "ความพยายามของเราเริ่มผลิดอกออกผลแล้ว!"
 generic_mission_events.13.b: "จงสนับสนุนงบประมาณ ให้กับกระแสการรวมอำนาจครั้งใหม่นี้"
 generic_mission_events.13.c: "ไม่มีความจำเป็นต้องเข้าแทรกแซง"
 valid_province_tt: "มี [province|e] ที่เข้าเงื่อนไขสำหรับตัวเลือก [event|e] นี้"

 generic_mission_events.14.title: "[target_province.GetNameWithNoTooltip] ต่อต้านการรวมอำนาจ"
 generic_mission_events.14.desc: "แม้จะมีวิสัยทัศน์และความเด็ดเดี่ยวของ [target_character.GetName] แต่ผู้คนใน [target_province.GetName] กลับเริ่มหวาดระแวง ต่อแนวโน้มการรวมอำนาจที่เพิ่งถูกบังคับใช้กับพวกเขา เหล่าผู้อาวุโสในเมืองต่างตัดพ้อถึงขนบประเพณีที่สูญหาย เหล่าพนักงานเมืองต่างนิ่งเฉย และเสียงกระซิบเรื่องอำนาจปกครองตนเอง ก็แพร่กระจายไปตามแถบชนบท สิ่งที่ตั้งใจจะสร้างระเบียบกลับถูกมองว่าเป็นการก้าวก่าย การต่อต้านมิได้อุบัติขึ้นในรูปของการก่อการกบฏอย่างเปิดเผย แต่มาในรูปของความเงียบอันดื้อรั้น และการขัดขืนอย่างมีชั้นเชิง ซึ่งเป็นคลื่นใต้น้ำที่ขู่ว่าจะกัดเซาะ รากฐานอำนาจบัญชาของเราไปทั่วทั้ง [ROOT.GetCountry.GetFlavorRank]"
 generic_mission_events.14.a: "พวกเขาลืมที่ต่ำที่สูงเสียแล้ว"
 generic_mission_events.14.b: "ช่างน่าเวทนา พวกเขามิอาจเข้าใจในเจตจำนงของเราได้"
 generic_mission_events.14.c: "โยนความผิดทั้งหมดไปที่ [target_character2.GetShortNameWithNoTooltip] เสีย!"
 suitable_character_exists_tt: "มี [character|e] ที่เหมาะสมสำหรับตัวเลือก [event|e] นี้"

 generic_mission_events.15.title: "การละเลยชนบท"
 generic_mission_events.15.desc: "ผู้คนใน [target_province.GetName] พร้อมกับผู้อยู่อาศัยในหัวเมืองจังหวัด [target_location.GetName] ต่างแสดงความไม่พอใจที่เพิ่มขึ้น ในขณะที่สายตาของเราจับจ้องไปยังนครใหญ่ และการขยายตัวของหลักอภิบาลส่วนกลาง ชุมชนชนบทเหล่านี้กลับรู้สึกเหมือนถูกทอดทิ้ง และถูกลืมเลือนอยู่ภายใต้ร่มเงาของความก้าวหน้า ฎีกาของพวกเขาเริ่มดังระงมขึ้น: จงยุติการปฏิรูป หันกลับมาใส่ใจผืนแผ่นดิน และรำลึกถึงเหล่าผู้ที่ตรากตรำพรวนดิน และร้อยรัด [ROOT.GetCountry.GetFlavorRank] เข้าด้วยกันจากเบื้องล่าง"
 generic_mission_events.15.a: "อุปสรรคชั่วคราวเพียงเล็กน้อยเท่านั้น"
 generic_mission_events.15.b: "เรามิได้แยแสต่อความทุกข์ร้อนของพวกชาวไร่ชาวนา"
 generic_mission_events.15.c: "จงขอความช่วยเหลือจาก [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]"
 progress_towards_centralization_will_not_be_hindered_tt: "ความก้าวหน้าของเราสู่ค่านิยมทางสังคมแบบ [ShowSocietyDirectionName('centralization')] [societal_value|e] จะไม่ถูกขัดขวาง"

 generic_mission_events.16.title: "ร่างปฏิรูปการภาษีของ [target_character.GetNameWithNoTooltip]"
 generic_mission_events.16.desc: "ท่ามกลางกระแสการรวมอำนาจ [target_character.GetName] ได้นำเสนอแผนการปฏิรูปขนานใหญ่ เพื่อปรับปรุงระบบการภาษีของ [ROOT.GetCountry.GetFlavorRank] ของเรา แผนนี้ถูกออกแบบมาเพื่อเสริมสร้างเงินคลัง และทำให้การจัดเก็บรายรับมีประสิทธิภาพยิ่งขึ้น การเปลี่ยนแปลงนี้จะดึงอำนาจการเงิน ออกจากขั้วอำนาจท้องถิ่นและรวบรวมมันไว้ในมือของ [target_character.GetHerHis] อย่างมั่นคง ทว่าความทะเยอทะยานเช่นนั้น ย่อมมิอาจรอดพ้นสายตาใครไปได้ แท้จริงแล้ว ฐานันดรทุกแห่งตั้งแต่ [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ไปจนถึง [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ต่างอยู่ในสภาวะที่ต้องสูญเสียอิทธิพล และความกระวนกระวายของพวกเขา กำลังแปรเปลี่ยนเป็นการต่อต้าน"
 generic_mission_events.16.a: "ดำเนินแผนการปฏิรูปต่อไป"
 generic_mission_events.16.b: "อย่าได้ทำลายสถานะเดิมที่เป็นอยู่เลย"

 generic_mission_events.17.title: "โอกาสในการตั้งเมืองใหม่ใน [target_location.GetNameWithNoTooltip]"
 generic_mission_events.17.desc: "การตั้งรกรากใน [target_location.GetName] เติบโตขึ้นอย่างมั่นคง ท้องถนนในยามนี้คลาคล่ำไปด้วยเกษตรกร พ่อค้า และช่างฝีมือที่แสวงหาโอกาส ใกล้กับศูนย์กลางของ [ROOT.GetCountry.GetFlavorRank] แม้จะยังเป็นเพียง [target_location.GetRank.GetName] ขนาดเล็ก แต่ตำแหน่งที่ตั้งใกล้กับ [ROOT.GetCountry.GetCapital.GetName] ทำให้ที่นี่มีความสำคัญทางยุทธศาสตร์ และมีอนาคตทางเศรษฐกิจ ผืนดินนั้นอุดมสมบูรณ์ เส้นทางสัญจรสะดวกสบาย และประชากรท้องถิ่นต่างกระหาย ที่จะได้รับการยอมรับและความเติบโต\n\nด้วยการลงทุนที่เหมาะสม [target_location.GetNameWithNoTooltip] จะสามารถเปลี่ยนโฉมเป็นเมืองที่เหมาะสม พร้อมพรั่งด้วยตลาด โรงปฏิบัติงาน และกฎบัตรประจำเมือง สิ่งนี้ไม่เพียงแต่จะนำความระเบียบ และความมั่งคั่งมาสู่ภูมิภาค แต่ยังเป็นสัญลักษณ์ที่ประจักษ์ชัด ถึงความทะเยอทะยานในการรวมอำนาจของเรา สิ่งที่เหลืออยู่มีเพียงการสละทรัพย์ และเจตจำนง เพื่อทำให้มันสำเร็จลุล่วง"
 generic_mission_events.17.a: "[target_location.GetNameWithNoTooltip] จะกลายเป็นเมืองที่ยอดเยี่ยม!"
 generic_mission_events.17.b: "อย่าได้หาเรื่องใส่ตัวเลย"
 cost_of_town_scales_tt: "ราคาของ [urban_location|e] ใหม่นี้จะลดลงตามค่านิยมทางสังคมแบบ [ShowSocietyDirectionName('centralization')] [societal_value|e] รวมถึงตัวผันแปร [ShowModifierTypeName('town_upgrade_cost_modifier')] [modifier|e] ของเรา"

 generic_mission_events.18.title: "เหล่านักวิชาการแห่ง [target_location.GetNameWithNoTooltip]"
 generic_mission_events.18.desc: "ท่ามกลางห้องเรียนที่เงียบสงบใน [target_location.GetName] นักวิชาการกลุ่มเล็ก ๆ แต่เปี่ยมด้วยความกระตือรือร้นได้ถือกำเนิดขึ้น พวกเขามิได้แสวงหาเพียงการอุปถัมภ์ แต่ต้องการการยอมรับ ข้อเรียกร้องให้รับรองว่าการแสวงหาความรู้ เหตุผล และการค้นพบ คือเสาหลักสำคัญของ [ROOT.GetCountry.GetFlavorRank] ที่รวมอำนาจและมีการตื่นรู้ ได้มาถึงหูของ [target_character.GetName] แล้ว\n\nฎีกาของพวกเขาได้ร่างแผนการอันทะเยอทะยาน ตั้งแต่การแปลตำราต่างประเทศ การสร้างเครือข่ายติดต่อกับเหล่านักคิดในแดนไกล และการก่อสร้างสถาบันทางวิชาการที่เรียบง่ายแต่ยั่งยืน เป้าหมายของพวกเขาดูจะสอดคล้องกับ กระแสความก้าวหน้าล่าสุดที่เข้าครอบคลุม [ROOT.GetCountry.GetFlavorRank] ของเรา ทว่ากิจการเช่นนี้จำต้องใช้เงินตรา ความอดทน และการปกป้องจากเหล่าผู้ที่มองว่า การแสวงหาความรู้เป็นเพียงสิ่งรบกวนสมาธิ จากการศึกสงครามและการบริหารราชการ"
 generic_mission_events.18.a: "จงสนับสนุนความุตสาหะของพวกเขา"
 generic_mission_events.18.b: "เรามิอาจสละเงินคลังจำนวนมาก ไปกับรายจ่ายที่ฟุ่มเฟือยเช่นนี้ได้"
 based_on_target_location_average_literacy_tt: "อ้างอิงจากค่าเฉลี่ย [literacy|e] ใน [target_location.GetName]:"
 scholars_in_target_location_wont_approach_tt: "#italic เหล่านักวิชาการใน [target_location.GetName] อาจเข้าพบเราอีกครั้งในอีกไม่กี่เดือนข้างหน้า ในขณะที่ [mission_task|e] ปัจจุบันกำลังดำเนินอยู่#!"

 generic_mission_events.19.title: "ปราชญ์เมธีสำหรับ [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 generic_mission_events.19.desc: "ข่าวแพร่สะพัดไปอย่างรวดเร็ว ผ่านโถงทางเดินใน [ROOT.GetCountry.GetCapital.GetName] ศิลปินผู้มีแววแต่ยังไร้ผลงานประจักษ์ นามว่า [target_character2.GetName] ได้เดินทางมาพร้อมกับทฤษฎีที่กล้าหาญ ต้นฉบับที่มีบันทึกประกอบ และวิสัยทัศน์ที่จะปรับโฉม วัฒนธรรมทางปัญญาของ [ROOT.GetCountry.GetFlavorRank] บางคนเรียก [target_character2.GetHerHim] ว่าพวกสิบแปดมงกุฎ บ้างก็ว่าเป็นอัจฉริยะ ที่แน่ชัดคือ [target_character2.GetSheHe] ต้องการการอุปถัมภ์ และตำแหน่งในราชสำนักเพื่อให้แนวคิดของเขาเบ่งบาน\n\nเหล่าผู้ที่ให้ค่าแก่เหตุผลและการปฏิรูป ต่างกระตุ้นให้เราลองให้โอกาสสักครั้ง ส่วนผู้ที่ยึดติดกับลำดับชั้นและขนบประเพณี กลับอยากเห็น [target_character2.GetHerHis] ไสหัวไปเสีย ก่อนที่ [target_character2.GetSheHe] จะทันได้เอ่ยปากออกมาอีกคำ"
 generic_mission_events.19.a: "[target_character.GetSheHe|U] ดูมีอนาคตไกล!"
 generic_mission_events.19.b: "พวกโง่เขลาไร้พรสวรรค์อีกคน เดินทางมาทำรก [ROOT.GetCountry.GetGovernment.GetCourtTitle] เสียเปล่า"
 skill_of_scientist_scales_with_country_literacy_tt: "[artistic_skill|e] ของ [target_character2.GetName] จะขึ้นอยู่กับค่าเฉลี่ย [literacy|e] ทั่วทั้ง [ROOT.GetCountry.GetFlavorRank] ของเราเพียงบางส่วน"
 artist_will_be_promtly_defenestrated_tt: "#italic [target_character2.GetName] จะถูกจับโยนออกทางหน้าต่างในทันที และมิอาจแก้ไขได้#!"

 generic_mission_events.20.title: "ความคิดอ่านของ [target_character2.GetNameWithNoTooltip]"
 generic_mission_events.20.desc: "บทนิพนธ์ที่เขียนขึ้นโดย [target_character2.GetName] เริ่มแพร่กระจายท่ามกลางวงสังคมผู้รู้หนังสือใน [ROOT.GetCountry.GetCapital.GetName] ทั้งกล้าหาญ เป็นที่ถกเถียง และเขียนขึ้นอย่างสละสลวย พวกเขาท้าทายหลักคำสอนเก่า และเสนอการปฏิรูปขนานใหญ่ต่อหลักอภิบาล กฎหมาย และระเบียบทางจิตวิญญาณ บางคนกระซิบว่า [target_character2.GetSheHe] คืออัจฉริยะ บ้างก็ร่ำร้องว่าเป็นการลบหลู่ศาสนา ไม่ว่าความจริงจะเป็นอย่างไร งานเขียนเหล่านี้ได้จุดประเด็นโต้เถียงไปไกลกว่าหอศึกษา และยามนี้พวกมันวางอยู่เบื้องหน้าเรา เพื่อรอการตัดสินใจ วิธีที่เราเลือกจะตอบสนอง อาจกำหนดไม่เพียงแค่ชะตากรรมของเจ้าของผลงาน แต่รวมถึงทิศทางทางปัญญาของ [ROOT.GetCountry.GetFlavorRank] ของเราเองด้วย"
 generic_mission_events.20.a: "งานเขียนของ [target_character2.GetHerHis] มีส่วนที่ดีอยู่"
 generic_mission_events.20.b: "นี่คือนอกรีต จงเผามันเสีย!"
 generic_mission_events.20.c: "จงขายมันให้แก่ผู้ที่ให้ราคาสูงที่สุด"

 generic_mission_events.21.title: "งานวิจัยนอกรีต"
 generic_mission_events.21.desc: "ทฤษฎีล่าสุดที่อุบัติขึ้นจากการศึกษาของเหล่านักปราชญ์ของเรา ได้สร้างความโกรธแค้นภายในฐานันดร [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] แม้จะมีพื้นฐานมาจากการสังเกตและเหตุผล แต่ข้อสรุปทางวิทยาศาสตร์เหล่านี้ บั่นทอนความเชื่อที่สืบทอดกันมา และคัมภีร์อันศักดิ์สิทธิ์ ทำให้เกิดความกลัวเรื่องนอกรีตท่ามกลางเหล่าผู้ศรัทธา\n\nทว่าภายในราชสำนัก และวงสังคมปัญญาชน ประชากรของเราต่างยกย่องพวกเขาว่าเป็นผู้มีวิสัยทัศน์แห่ง [target_culture.GetName] การรับรองงานเช่นนี้จะเป็นก้าวที่ชัดเจนสู่ [ROOT.GetCountry.GetFlavorRank] ที่มีนวัตกรรมและเป็นทางโลก แต่ก็อาจจุดชนวนความขัดแย้งกับ ผู้ดูแลทางจิตวิญญาณของขนบประเพณี ที่มีอิทธิพลเท่ากับเหล่า [target_pop_scope.GetName]"
 generic_mission_events.21.a: "เรามิได้แยแสต่อการร้องแรกแหกกระเชอของพวก [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]"
 generic_mission_events.21.b: "อย่าได้สร้างศัตรูใหม่เลย"
 generic_mission_events.21.c: "สติปัญญาที่เฉลียวฉลาดที่สุดของเรา จะต้องไม่ถูกท้าทายโดยพวกคนแก่ในชุดคลุม!"
 will_not_hinder_our_progress_to_innovative_tt: "ความก้าวหน้าของเราสู่ค่านิยมทางสังคมแบบ [ShowSocietyDirectionName('innovative')] [societal_value|e] จะไม่ถูกขัดขวาง"
 clergy_do_not_dare_move_against_target_character_tt: "ฐานันดร [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] จะไม่กล้าดำเนินการใด ๆ ต่อ [target_character.GetName]"

 generic_mission_events.22.title: "หอสมุดแห่ง [target_location.GetNameWithNoTooltip]"
 generic_mission_events.22.desc: "เหล่าผู้มาเยือนและชาวเมืองแห่ง [target_location.GetName] ได้รวบรวมทรัพยากรและกำลัง เพื่อก่อตั้งหอสมุดแห่งใหม่ ด้วยความเห็นชอบและการสนับสนุนงบประมาณจากเรา สถาบันที่ตั้งใจจะจัดเก็บความรู้ ส่งเสริมการรู้หนังสือ และดึงดูดเหล่านักคิดจากใกล้และไกล หอสมุดแห่งนี้ยืนหยัดเป็นเครื่องพิสูจน์ ถึงความใฝ่รู้ทางปัญญาของเรา\n\nแม้จะมีขนาดไม่ใหญ่นัก แต่มันแสดงถึงความกระหายในความรู้ที่เพิ่มขึ้นภายใน [target_province.GetName] และยามนี้ชั้นวางหนังสือชุดแรก ต่างคลาคล่ำไปด้วยบทประพันธ์ใหม่ ๆ ต้นฉบับ และบันทึกต่าง ๆ ด้วยงบประมาณและการรับรองที่เหมาะสม มันอาจเบ่งบานเป็นประภาคารแห่งการศึกษา สำหรับทั้ง [ROOT.GetCountry.GetFlavorRank] และสร้างแรงบันดาลใจให้แก่ทั้งผู้ทรงความรู้ และผู้ทะเยอทะยานไปอีกหลายชั่วอายุคน"
 generic_mission_events.22.a: "การลงทุนที่ชาญฉลาดย่อมให้ผลตอบแทน!"
 generic_mission_events.22.b: "เชิญชวนผู้คนจากทั่ว [target_province.GetNameWithNoTooltip] มาที่นี่"
 generic_mission_events.22.c: "บางที [target_heir.GetShortNameWithNoTooltip] อาจจะใช้เวลาที่นั่นบ้าง?"
 heir_gains_depend_on_inno_and_literacy_tt: "[total_ability|e] ที่ได้รับจะขึ้นอยู่กับค่าเฉลี่ย [literacy|e] อย่างมาก รวมถึงระดับของค่านิยมทางสังคมแบบ [ShowSocietyDirectionName('innovative')] [societal_value|e] ทั่วทั้ง [ROOT.GetCountry.GetFlavorRank] ของเรา"

 generic_mission_events.23.title: "การแทรกแซงจากต่างแดน"
 generic_mission_events.23.desc: "เสียงกระซิบตามท้องถนนในเมืองหลวง และการพูดคุยลับหลังดูจะบ่งชี้ว่า เหล่าศัตรูของเราได้เริ่มดำเนินแผนการแล้ว การเหยียดหยามทางการทูต การทำข้อตกลงลับ และการที่เราดูเหมือนจะถูกกีดกันจากการเจรจาต่าง ๆ บ่งชี้ว่า [target_country.GetName] ได้ทำลายชื่อเสียงของเราทั้งในและต่างแดน นี่เป็นเพียงการยั่วยุล่าสุดที่เราต้องรับมืออย่างจริงจัง! อธิปไตยของชาติเราจะต้องไม่ถูกตั้งคำถาม แม้จะเป็นฝีมือของพวก [target_character2.GetName] และพรรคพวกของ [target_character2.GetHerHis] ก็ตาม!"
 generic_mission_events.23.a: "ช่างเป็นการกระทำที่สกปรกยิ่งนัก"
 already_destabilized_desc: "ยามนี้เรากำลังทุกข์ทนจากผลกระทบของ [modifier|e] นี้อยู่แล้ว"
 target_country_sow_discontent_tt: "[target_country.GetName] ได้ใช้คำสั่งทางการทูตแบบ [ShowRelationTypeName('sow_discontent')] [diplomatic_action|e] กับเรา ซึ่งเป็นการหว่านเมล็ดพันธุ์แห่งความไม่มั่นคง ไปทั่วทั้ง [ROOT.GetCountry.GetFlavorRank] ของเรา"

 generic_mission_events.24.title: "การอุปถัมภ์แห่ง [target_location.GetNameWithNoTooltip]"
 generic_mission_events.24.desc: "เพื่อให้สอดคล้องกับความทะเยอทะยานของเรา ในการรวมศูนย์ความมั่งคั่งและอำนาจทางเศรษฐกิจ ทางการท้องถิ่นใน [target_location.GetName] ได้ยื่นข้อเสนอสำหรับการลงทุนขนานใหญ่ พวกเขาโต้แย้งว่าโครงสร้างพื้นฐานที่ได้รับการปรับปรุง และศูนย์กลางการพาณิชย์ที่ขยายตัว จะเปลี่ยนให้ [target_location.GetRank.GetName] กลายเป็นรากฐานสำคัญของเศรษฐกิจใน [ROOT.GetCountry.GetFlavorRank] ของเรา\n\nงบประมาณที่ต้องการนั้นมีจำนวนมาก แต่ผลตอบแทนที่อาจได้รับ ทั้งในด้านเศรษฐกิจและการเมืองนั้นยิ่งใหญ่กว่า ที่ปรึกษาแนะนำให้เร่งดำเนินการ เพื่อเสริมสร้างความมั่นคงให้แก่การพัฒนานี้ ในฐานะส่วนหนึ่งของการผลักดันไปสู่เศรษฐกิจทุนนิยม"
 generic_mission_events.24.a: "เรื่องนี้สำคัญยิ่ง จงดำเนินการต่อไป"
 generic_mission_events.24.b: "ยามนี้เรามิอาจจัดสรรงบประมาณจำนวนมากเช่นนี้ได้"

 generic_mission_events.25.title: "ชาวชนบทที่ถูกทอดทิ้ง"
 generic_mission_events.25.desc: "ในขณะที่นโยบายของเราเอื้อประโยชน์ต่อ ศูนย์กลางเขตเมืองและการพาณิชย์มากขึ้นเรื่อย ๆ เสียงจากชนบทก็เริ่มกระวนกระวาย ใน [target_province.GetName] สภาหมู่บ้านต่างตัดพ้อถึงกองเกณฑ์ที่เพิ่มขึ้น การพัฒนาที่ถูกละเลย และการย้ายถิ่นของคนหนุ่มสาวเข้าสู่ตัวเมือง ความแตกต่างระหว่างตลาดในเมืองที่คึกคัก กับพื้นที่เกษตรกรรมที่เงียบเหงาและถูกลืมเลือน ยิ่งชัดเจนขึ้นทุกวัน บางคนใน [ROOT.GetCountry.GetGovernment.GetCourtTitle] ของเราแย้งว่านี่คือผลลัพธ์ที่หลีกเลี่ยงไม่ได้ ของความเติบโตในยุคสมัยใหม่ คนอื่น ๆ เตือนว่าการละเลยโดยไม่ตรวจสอบ อาจบานปลายเป็นการก่อการกบฏได้"
 generic_mission_events.25.a: "นั่นคือราคาของความก้าวหน้า"
 generic_mission_events.25.b: "เรามิอาจปล่อยให้การตั้งรกราก ในชนบทของเราเสื่อมถอยลงได้!"
 progress_towards_cap_economy_will_not_be_hindered_tt: "ความก้าวหน้าของเราสู่ค่านิยมทางสังคมแบบ [ShowSocietyDirectionName('capital_economy')] [societal_value|e] จะไม่ถูกขัดขวาง"

 generic_mission_events.26.title: "ความเจริญของอุตสาหกรรม [target_good.GetNameWithNoTooltip]"
 generic_mission_events.26.desc: "ความต้องการ [target_good.GetName] ที่พุ่งสูงขึ้น ได้จุดชนวนให้เกิดความรุ่งเรืองทางเศรษฐกิจใน [target_location.GetName] โรงปฏิบัติงานใหม่ ตลาดที่ขยายตัว และการค้าที่เพิ่มขึ้น ได้เปลี่ยนให้ [target_location.GetRank.GetName] กลายเป็นจุดเชื่อมต่อสำคัญ ภายในเศรษฐกิจทุนนิยมที่กำลังรุ่งเรืองของเรา ฐานันดร [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ต่างชื่นชมต่อการพัฒนานี้ และกระหายที่จะขยายอิทธิพลของตนออกไปอีก\n\nอย่างไรก็ตาม มีเสียงจากฐานันดร [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] พึมพำว่าที่ดินของพวกเขา กำลังถูกกลืนกินโดยการขยายตัวที่ไร้การตรวจสอบ โดยที่ผู้ตรากตรำพรวนดินแทบไม่ได้รับผลประโยชน์ใด ๆ"
 generic_mission_events.26.a: "เรายินดีต่อการพัฒนานี้"
 generic_mission_events.26.b: "อย่าได้ละเลยพวก [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]"

 generic_mission_events.27.title: "[target_province.GetNameWithNoTooltip] ต่อต้านการขยายเขตเมือง"
 generic_mission_events.27.desc: "ความพยายามของเราในการส่งเสริมการเติบโตของ เขตเมืองใน [target_province.GetName] ได้รับการต่อต้านอย่างหนัก! จารีตประเพณีท้องถิ่นและผู้นำต่างผลักดันการปฏิรูปกลับไป เพราะหวาดระแวงต่อการเปลี่ยนแปลง และกลัวว่าระบบราชการที่เพิ่มขึ้นจะกัดเซาะอำนาจปกครองตนเองของพวกเขา\n\nแม้ว่าจะยังไม่มีการขัดขืนอย่างเปิดเผย แต่ความล่าช้านั้นเห็นได้ชัด ผู้วางแผนและผู้บริหารเขตเมืองต่างตัดพ้อถึงอุปสรรค การประวิงเวลา และการขาดความร่วมมือ นี่อาจเป็นสัญญาณแรกของการต่อต้านที่ลึกซึ้งยิ่งขึ้น ต่อนโยบายที่เน้นเขตเมืองของเรา"
 generic_mission_events.27.a: "ความขัดแย้งบ้างเป็นเรื่องที่คาดการณ์ไว้แล้ว"
 generic_mission_events.27.b: "อย่าได้ทำลายสถานะเดิมที่เป็นอยู่เลย"

 generic_mission_events.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] เห็นชอบต่อความก้าวหน้าทางสังคม"
 generic_mission_events.28.desc: "ฐานันดร [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ได้แสดงการสนับสนุนอย่างเป็นทางการ ต่อการเปลี่ยนโฉมสู่เศรษฐกิจที่ขับเคลื่อนด้วยทุนนิยมของเรา ในการชุมนุมเมื่อไม่นานมานี้ใน [target_location.GetName] พวกเขาได้ยกย่องความมุ่งมั่นของ [ROOT.GetCountry.GetGovernment.GetCourtTitle] ของเราต่อการลงทุนในเขตเมือง แรงจูงใจทางการค้า และโครงสร้างพื้นฐาน\n\nในฐานะเครื่องหมายแห่งความกตัญญู และอาจเพื่อหวังความเมตตาในภายหน้า พวกเขาได้มอบเงินสนับสนุนก้อนใหญ่ให้แก่เงินคลัง ซึ่งระบุไว้เพื่อใช้สำหรับความพยายาม ในการสร้างเมืองในอนาคต"
 generic_mission_events.28.a: "เราขอบใจพวกเขาสำหรับของกำนัลนี้"