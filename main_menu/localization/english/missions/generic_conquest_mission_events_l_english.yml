l_english:

 conquest_mission_events.1.title: "การบริจาคเพื่อว่าราชการสงคราม"
 conquest_mission_events.1.desc: "ขณะที่ความตึงเครียดพุ่งสูงขึ้น และความจำเป็นในการเตรียมคลังสงคราม ให้พร้อมสรรพทวีความสำคัญยิ่ง เหล่าสมาชิกผู้ทรงอิทธิพลของ [target_estate.GetName] ได้เข้าเฝ้า [target_character.GetName] พร้อมข้อเสนออันเอื้อเฟื้อ ด้วยตระหนักถึงความสำคัญของกิจการทหารเกี่ยวกับประเทศ พวกเขาจึงได้ปวารณาเงินบริจาคจำนวนมาก เพื่อสนับสนุนราชการสงคราม\n\nทว่า ความโอบอ้อมอารีเช่นนี้ย่อมมิได้มาเปล่า เมื่อทาง [target_estate.GetNameWithNoTooltip] หวังจะใช้การเกื้อหนุนนี้ เป็นเครื่องมือสร้างอิทธิพลเหนือกิจการทั้งปวงของ [ROOT.GetCountry.GetFlavorRank]"
 conquest_mission_events.1.a: "สิ่งนี้จะช่วยสนับสนุนราชการสงคราม ที่กำลังดำเนินอยู่ได้เป็นอย่างมาก"
 conquest_mission_events.1.b: "ขอบใจในไมตรีของพวกเขาอย่างสุภาพ และปฏิเสธข้อเสนอนั้นเสีย"
 reject_the_advances_of_the_estate_tt: "#italic เราจะปฏิเสธการเข้าหาของ [target_estate.GetNameWithNoTooltip]#!"

 conquest_mission_events.2.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] ประท้วงเรื่องคลังสงคราม"
 conquest_mission_events.2.desc: "ขณะที่ [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective] มุ่งเน้นไปที่การสะสมคลังสงคราม จำนวนมหาศาลเพื่อเป็นทุนในการศึกในอนาคต ความไม่พอใจก็เริ่มก่อตัวขึ้นในหมู่ชนชั้นล่าง เหล่า [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] ที่ต้องตรากตรำภายใต้ภาระภาษีที่เพิ่มขึ้น และการบังคับส่งส่วย ได้ออกมาแสดงความเดือดเนื้อร้อนใจอย่างเปิดเผย\n\nพวกเขาย้งว่าภาระของสงคราม ไม่ควรตกหนักอยู่ที่บ่าของพวกเขาเพียงฝ่ายเดียว โดยเฉพาะเมื่อเหล่าฐานันดรที่มั่งคั่งกว่า ดูเหมือนจะไม่ได้รับผลกระทบ การประท้วงเหล่านี้หากมิได้รับการแก้ไข อาจลุกลามกลายเป็นความไม่สงบเต็มรูปแบบ และสั่นคลอนเสถียรภาพของ [ROOT.GetCountry.GetFlavorRank]"
 conquest_mission_events.2.a: "พวกเขาต้องเป็นผู้จ่ายเงินส่วนนี้"
 conquest_mission_events.2.b: "เราสามารถผ่อนปรนเรื่องเงินทองให้ได้บ้าง"
 conquest_mission_events.2.c: "มอบเอกสิทธิ์ให้แก่พวกเขาแทน"

 conquest_mission_events.3.title: "เงินกู้สงคราม"
 conquest_mission_events.3.desc: "ในระหว่างที่การเตรียมการสำหรับการศึกครั้งใหญ่ทวีความเข้มข้นขึ้น เหล่าฐานันดรเล็งเห็นโอกาสในการแสวงหากำไร จากความต้องการของ [ROOT.GetCountry.GetGovernment.GetAdjective] ในการจัดเตรียมคลังสงครามให้พร้อมพรั่ง เหล่านักการเงินชั้นนำภายใน [ROOT.GetCountry.GetFlavorRank] ของเราได้เข้าเฝ้า [ROOT.GetCountry.GetGovernment.GetCourtTitle] พร้อมข้อเสนออันน่าจูงใจ นั่นคือเงินกู้จำนวนมหาศาลด้วยอัตราที่แข่งขันได้ เพื่อมุ่งเน้นการสนับสนุนราชการสงครามที่กำลังดำเนินอยู่\n\nทว่า การตอบรับข้อเสนอของพวกเขาอาจเสริมสร้างอิทธิพลให้กล้าแกร่งขึ้น ซึ่งอาจทำให้ดุลอำนาจระหว่างฐานันดรต่าง ๆ เปลี่ยนแปลงไป"
 conquest_mission_events.3.b: "ตกลง ลงนามในสัญญากู้ยืมเสีย"
 conquest_mission_events.3.c: "เรามิอาจแบกรับภาระนี้ได้"
 conquest_mission_events.3.a: "จงไปตกลงเพื่อให้ได้ข้อเสนอที่ดีกว่านี้!"
 special_loan_with_lower_interest_tt: "[loan|e] นี้เสนอให้ในอัตรา [interest|e] ที่ต่ำกว่า"
 turn_away_the_loan_tt: "#italic ปฏิเสธข้อเสนอจาก [estates|e] ของเรา#!"
 extra_special_loan_with_lower_interest_tt: "[loan|e] จะมีจำนวน #G มากขึ้น#! และมีอัตรา [interest|e] #G ต่ำลงไปอีก#! ด้วยทักษะการเจรจาของ [target_character.GetName]"

 conquest_mission_events.4.title: "การปล้นสะดมใน [target_loot_location.GetNameWithNoTooltip]"
 conquest_mission_events.4.desc: "เปลวเพลิงสงครามได้ลุกลามอย่างมิอาจควบคุม ทิ้งไว้เพียงความพินาศย่อยยับในเส้นทางที่ผ่านไป จังหวัด [target_loot_province.GetName] ที่เคยรุ่งเรืองกลับต้องรับศึกหนักที่สุด ด้วยเหล่าทหารที่ออกอาละวาด และพวกหนีทัพที่สิ้นหวัง ต่างพากันปล้นสะดมแหล่งตั้งถิ่นฐาน เผาผลาญไร่นา และทิ้งให้ชนบทกลายเป็นซากปรักหักพัง\n\nรายงานเรื่องหมู่บ้านที่ถูกเผา ชาวชนบทที่อดอยาก และการล่มสลายของการค้าในท้องถิ่นได้ส่งถึง [ROOT.GetCountry.GetGovernment.GetCourtTitle] สะท้อนภาพอันโหดร้ายของต้นทุนความเป็นมนุษย์ในสงคราม หากมิเร่งดำเนินการโดยเร็ว ความเสียหายที่ต่อเนื่องจากการปล้นสะดม ของเราอาจทำลายความรุ่งเรืองของจังหวัดไปอีกหลายปี"
 conquest_mission_events.4.a: "ในสงครามทุกอย่างย่อมกระทำได้"
 conquest_mission_events.4.b: "พวกเขาก็แค่ปล้นสะดมเพียงเล็กน้อยเท่านั้น!"
 conquest_mission_events.4.c: "เรามิอาจปล่อยให้มีพฤติกรรมเช่นนี้ รอบ [target_loot_province.GetNameWithNoTooltip] ได้!"

 conquest_mission_events.5.title: "ความบอบช้ำจากสงคราม"
 conquest_mission_events.5.desc: "ความขัดแย้งที่ดำเนินอยู่นี้ได้ส่งผลกระทบต่อเราอย่างหนัก ยิ่งยืดเยื้อ รายงานเรื่องความยากลำบาก และความไม่พอใจ ก็ยิ่งแพร่กระจายไปราวกับไฟลามทุ่ง หมู่บ้านต่าง ๆ ร้างไร้ชายฉกรรจ์ ภาษีก็พุ่งสูงยิ่งกว่าครั้งใด และเสบียงก็ร่อยหรอลงไปทุกที\n\nเหล่าราษฎรสามัญเริ่มเหนื่อยหน่าย กับการนองเลือด และการเสียสละอันไร้จุดจบตามคำสั่งของ [target_character.GetName] ตั้งแต่ในนครที่พลุกพล่านไปจนถึงชนบทที่เงียบสงบ ขวัญกำลังใจของทวยราษฎรเริ่มถดถอย และเสียงกระซิบของความขัดแย้งก็ดังยิ่งขึ้น หากปล่อยไว้โดยมิแก้ไข ความเหนื่อยล้าจากสงครามที่เพิ่มพูนนี้ อาจคุกคามเสถียรภาพของ [ROOT.GetCountry.GetFlavorRank]"
 conquest_mission_events.5.a: "เป็นเพียงแค่เสียงนกเสียงกาเท่านั้น"
 conquest_mission_events.5.b: "จงตอบโต้พวกเขาด้วยการโฆษณาชวนเชื่อ!"

 conquest_mission_events.6.title: "นวัตกรรมสงคราม"
 conquest_mission_events.6.desc: "ในยามที่สงครามโหมกระหน่ำ ความจำเป็นได้กลายเป็นบ่อเกิดของนวัตกรรม ความขัดแย้งที่ยาวนานทำให้กองทัพของเรา ได้เผชิญหน้ากับทั้งศัตรู และพันธมิตรต่างแดน ซึ่งแต่ละฝ่ายต่างก็มีเทคนิค และเทคโนโลยีที่เป็นเอกลักษณ์ ตั้งแต่เครื่องล้อมเมืองของศัตรูที่ยึดมาได้ ไปจนถึงยุทธวิธีที่ได้รับการปรับปรุง จากการสังเกตในสมรภูมิ เหล่าทหาร และวิศวกรของเราได้เริ่มรับเอา และขัดเกลานวัตกรรมเหล่านี้\n\nการแลกเปลี่ยนความรู้นี้มิเพียงแต่พัฒนา ขีดความสามารถทางการทหารของเราเท่านั้น แต่ยังจุดประกายให้เกิดความก้าวหน้าทางเทคโนโลยี ขนานใหญ่ไปทั่วทั้ง [ROOT.GetCountry.GetFlavorRank]"
 conquest_mission_events.6.a: "เราจะศึกษาวิชาการสงคราม"
 conquest_mission_events.6.b: "มุ่งเน้นไปที่ความก้าวหน้าโดยทั่วไป"
 research_gained_scales_with_monthly_towards_innovative_tt: "[research_progress|e] ที่ได้รับจะแปรผันตามค่า [ShowModifierTypeName('monthly_towards_innovative')] ของเรา"

 conquest_mission_events.7.title: "ความก้าวหน้าในการรวมดินแดนใน [target_province.GetNameWithNoTooltip]"
 conquest_mission_events.7.desc: "ความพยายามในการรวมดินแดนใน [target_province.GetName] กำลังรุดหน้าไปอย่างมั่นคง ใน [target_location.GetName] นั้นเหล่าราษฎรเริ่มปรับตัวเข้าหา กฎหมาย และขนบธรรมเนียมของเราแล้ว\n\nตลาดรวงเริ่มกลับมาเปิดทำการ ภาษาของเราเริ่มได้ยินบ่อยครั้งขึ้นตามท้องถนน และการต่อต้านได้จางหายกลายเป็นการยอมรับอย่างเงียบเชียบ แม้ขนบประเพณีบางอย่างจะยังคงอยู่ แต่ภูมิภาคนี้กำลัง ค่อย ๆ ปรับตัวเข้าสู่ครรลองของ [ROOT.GetCountry.GetFlavorRank] ของเรา"
 conquest_mission_events.7.a: "เร่งรัดความพยายามในการรวมดินแดนให้เข้มข้นยิ่งขึ้น"
 conquest_mission_events.7.b: "ให้เราพยายามให้เกียรติเหล่าคนในท้องถิ่นเถิด"
 locals_in_target_province_gain_mild_satisfaction_tt: "เหล่า [pops|e] ของเราใน [target_province.GetName] จะได้รับ [pop_satisfaction|e] [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 locations_in_target_province_receive_very_weak_bonus_integration_tt: "[locations|e] ใน [province|e] ดังกล่าวที่เรากำลัง [integrating|e] จะได้รับความก้าวหน้าการ [integration|e] [ShowNamedValue('integration_progress_very_weak_bonus')|+=]"

 conquest_mission_events.8.title: "การต่อต้านการรวมดินแดนใน [target_province.GetNameWithNoTooltip]"
 conquest_mission_events.8.desc: "การต่อต้านใน [target_province.GetName] ยังคงแข็งขืน ใน [target_location.GetName] เหล่าขุนนางรายงานถึงความแข็งขืนที่เพิ่มขึ้น ต่ออำนาจปกครอง และนโยบายของเรา\n\nผู้นำท้องถิ่นคอยบ่อนทำลายร่างปฏิรูปของเรา และธงทิวของเราถูกเหยียดหยาม ประชากรยังคงยึดติดกับวิถีเก่า และความพยายามจะกลืนกลายพวกเขากลับพบเพียง ความเงียบงันหรือการดูหมิ่นอย่างเปิดเผย"
 conquest_mission_events.8.a: "ความพยายามของพวกเขานั้น หามีประโยชน์อันใดไม่!"
 conquest_mission_events.8.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 conquest_mission_events.8.c: "จงนำแส้ไปสั่งสอนพวกมันเสีย"
 locals_in_target_province_lose_mild_satisfaction_tt: "เหล่า [pops|e] ของเราใน [target_province.GetName] จะเสีย [pop_satisfaction|e] [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
 mission_ruler_or_regent_is_conqueror_tt: "การต่อต้านเพียงน้อยนิดที่พบใน [target_province.GetName] ย่อมมิอาจต้านทาน [target_character.GetName] ได้"

 conquest_mission_events.9.title: "การแพร่ขยายทางวัฒนธรรมใน [target_province.GetNameWithNoTooltip]"
 conquest_mission_events.9.desc: "ใน [target_province.GetName] นั้นรากฐานวัฒนธรรม [target_culture.GetName] ของเราเริ่มหยั่งรากลึก ใน [target_location.GetName] เริ่มปรากฏสัญญาณของการเปลี่ยนแปลงทางวัฒนธรรม\n\nบุตรหลานเริ่มเรียนรู้ภาษาของเรา เสื้อผ้ากับขนบธรรมเนียมจากเมืองหลวงเริ่มแพร่หลาย และแนวคิดในการเป็นส่วนหนึ่งของ [ROOT.GetCountry.GetFlavorRank] มิใช่เรื่องแปลกหน้าอีกต่อไป การเปลี่ยนแปลงนั้นแม้จะเบาบาง แต่ก็เกิดขึ้นจริง"
 conquest_mission_events.9.a: "ผู้ใดเล่าจะมิปรารถนาเป็น [target_culture.GetNameWithNoTooltip]?"
 conquest_mission_events.9.b: "ให้เราเผยแผ่ความพยายามเหล่านี้ให้กว้างไกลยิ่งขึ้นเถิด!"
 conquest_mission_events.9.c: "จงดำเนินตามรอยบาทของ [target_character.GetShortNameWithNoTooltip] ผู้ยิ่งใหญ่ของเรา!"
 conquest_mission_events.9.d: "ความหลากหลายคือขุมกำลัง!"

 conquest_mission_events.10.title: "การแพร่ขยายทางความเชื่อใน [target_province.GetNameWithNoTooltip]"
 conquest_mission_events.10.desc: "เหล่าราษฎรใน [target_province.GetName] เริ่มโอบรับความเชื่อ [target_religion.GetName] ของเราแล้ว\n\nใน [target_location.GetName] นั้นได้มีการรวมกลุ่มเล็ก ๆ รอบตัวผู้เผยแผ่ศาสนา และวิหารต่าง ๆ ได้เห็นการเปลี่ยนความเชื่อที่เพิ่มขึ้นอย่างเงียบ ๆ ศรัทธากำลังพิสูจน์ว่าเป็นเครื่องมือที่ทรงพลัง ในการรวมเป็นหนึ่งเดียว"
 conquest_mission_events.10.a: "พวกเขากำลังเห็นแสงสว่างแล้ว!"

 conquest_mission_events.11.title: "เหล่า [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] ในท้องถิ่นเรียกร้องการทำงานร่วมกันใน [target_province.GetNameWithNoTooltip]"
 conquest_mission_events.11.desc: "เหล่า [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] ของ [target_province.GetName] ได้เข้ามาเจรจากับเรา เพื่อขอมีบทบาทในระบบการปกครองแลกกับความจงรักภักดี\n\nใน [target_location.GetName] ตระกูลเหล่านี้ขอเสนออิทธิพล ทรัพยากร และอำนาจปกครองส่วนท้องถิ่น — แต่ต้องแลกกับการมอบที่ดินกับเอกสิทธิ์ การสนับสนุนของพวกเขาอาจช่วยให้การรวมดินแดนง่ายขึ้น ทว่าต้องแลกด้วยความเดือดร้อน ของชาวชนบทกับอำนาจปกครองของเรา"
 conquest_mission_events.11.a: "คบคนคุ้นหน้า ย่อมดีกว่าคบคนแปลกหน้า..."
 conquest_mission_events.11.b: "พวกเขาจะมาชี้นำนโยบายของเรามิได้"
