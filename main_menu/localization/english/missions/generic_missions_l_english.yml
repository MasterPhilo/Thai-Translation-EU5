 choose_province_for_next_conquest_tasks_tt: "เราจะเลือก [province|e] ที่กำหนดสำหรับ [mission_tasks|e] ต่อไปนี้"

 select_mission_for_next_mission_tasks: "เลือก [province|e] สำหรับ [mission task|e] ถัดไป"
 monthly_events_about_integration_tt: "[events|e] รายเดือนเกี่ยวกับการรวมดินแดน อาจเกิดขึ้นในขณะที่ [mission_task|e] นี้กำลังดำเนินอยู่"
 requirements_after_mission_conquer_province_tt: "เงื่อนไขของภารกิจย่อยนี้จะปรากฏขึ้น หลังจากที่เราทำ [mission_task|e] $mission_conquer_province$ สำเร็จ"

 mission_war_chest: "ระดมทุนทำศึก"
 mission_war_chest_desc: "สงครามคือความหิวกระหายอันเร่าร้อนที่กัดกินทองคำ เพื่อการระดมพลเหล่าทหาร สร้างขวัญกำลังใจแก่กองเกณฑ์ และจัดหาทุนสำหรับการศึก เราจำต้องมีทรัพย์สินจำนวนมาก"

 mission_obtain_casus_belli: "จัดหา [casus_belli|e]"
 mission_obtain_casus_belli_desc: "เป้าหมายของเรานั้นเที่ยงธรรม และเรามิอาจหยุดพักได้จนกว่าพรมแดนจะขยายออกไป และมั่นคงต่อภัยคุกคามที่อาจทำลายความอยู่รอดของเรา ด้วยเหตุนั้น เราจึงต้องแสวงหาเหตุผลที่สมควรและมีความชอบธรรม เพื่อผนวกดินแดนต่างชาติเข้าสู่ขอบขัณฑสีมาของเรา"
 mission_obtain_casus_belli_tip: "@arrow_bonus_tier_3! วิธีที่ดีที่สุดในการได้รับ เหตุแห่งสงคราม คือการร้องขอจาก [parliament_with_icon|e] ของเรา ท่านสามารถเปิดสมัยประชุมสภาได้จาก [Link('government', 'tabcontent = parliament', '@government_panel!แผงควบคุมการปกครอง > สภา')]\n\n@arrow_bonus_tier_2! การสร้าง [spy_network_with_icon|e] ใน [countries] ต่างแดน จะช่วยให้เราสามารถอ้างสิทธิ์เพื่อสร้าง เหตุแห่งสงคราม ต่อพวกเขาได้ หากเรามี [cores_with_icon|e] ในดินแดนของเขา หรือหากพวกเขาเป็น [rivals_with_icon|e] ของเรา\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_casus_belli', '@hint! คำแนะนำเกี่ยวกับเหตุแห่งสงคราม')]#!"

 mission_conquer_province: "พิชิตจังหวัด"
 mission_conquer_province_desc: "การขยายขอบขัณฑสีมาด้วยการเข้ายึดครองเพื่อนบ้านที่อ่อนแอกว่า เป็นเพียงกฎธรรมชาติที่ผู้แข็งแกร่งเท่านั้นที่จะอยู่รอด"
 mission_conquer_province_tip: "@arrow_bonus_tier_3! เมื่อท่านสะสม [war_score_with_icon|e] ได้มากพอแล้ว ให้ยื่นข้อเสนอ [peace_treaty_with_icon|e] แก่ศัตรูผ่าน [diplomatic_actions|e]\n\n@arrow_bonus_tier_2! ในแผง [peace_treaty] ให้เลือก [locations_with_icon|e] หรือ [provinces_with_icon|e] ที่ท่านต้องการเข้าพิชิต\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_war', '@hint! สงคราม')], [Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! การปิดล้อม')], และ [Link('hints', 'selected_hint = hint_battle', '@hint! ยุทธการ')]#!"
 top_owner_is_us_or_not_ownable_tt: "ทุก [location|e] ที่ถือครองได้ (นั่นคือ #R ไม่ใช่#! พื้นที่ผ่านไม่ได้ ทะเล หรือทะเลสาบ) ถูกครอบครองโดยเราหรือ [subjects|e] ของเรา"
 mission_peace_integrate_province: "รวมดินแดนที่พิชิตได้"
 mission_peace_integrate_province_desc: "เรามิควรนิ่งนอนใจเพียงเพราะผลพวงแห่งชัยชนะ การรวมดินแดนที่พิชิตมาได้เข้าเป็นส่วนหนึ่งอย่างเหมาะสม ควรเป็นเป้าหมายหลักอันดับแรกของเรา"
 mission_peace_integrate_province_tip: "@arrow_bonus_tier_2! ไปที่ [Link('government', 'tabcontent = cabinet', '@government_panel! แผงควบคุมการปกครอง > คณะที่ปรึกษา')] เพื่อดู [cabinet_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_1! มอบหมาย [cabinet_member_with_icon|e] ให้ไปปฏิบัติ [cabinet_action|e] [ShowCabinetActionName('integrate_province')]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_has_conquered_provinces', '@hint! $hint_has_conquered_provinces$')]#!"
 mission_fortifications: "เสริมแกร่งชายแดน"
 mission_fortifications_desc: "ในขณะที่การบุกโจมตีครั้งใหญ่กำลังดำเนินอยู่ เราต้องไม่ละเลยแผนการป้องกัน โดยการสร้างความปลอดภัยให้แก่พรมแดนใหม่ เมื่อการรณรงค์พิชิตดินแดนของเราสิ้นสุดลง"
 mission_fortifications_tip: "@arrow_bonus_tier_3! ไปที่ [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] และค้นหา [building|e] ประเภท [ShowBuildingTypeName('castle')]\n\n@arrow_bonus_tier_2! คลิกที่สิ่งปลูกสร้างเพื่อสร้างลงใน [locations_with_icon|e] ใดก็ได้ของท่าน\n\n@arrow_bonus_tier_1! ป้อมปราการจะขัดขวางการเคลื่อนที่ของ [armies_with_icon|e] ศัตรู ดังนั้นจึงเป็นการดีที่สุดที่จะเสริมสร้างแนวป้องกันตามชายแดน โดยเฉพาะตามจุดยุทธศาสตร์ทางธรรมชาติระหว่างภูมิประเทศที่ผ่านไม่ได้"
 mission_fortifications_reward_tt: "[location|e] ที่ตกเป็นเป้าหมายจะได้รับ [ShowModifier('mission_defensive_fortification_modifier')]"
 no_eligible_border_location_tt: "@trigger_no! ไม่มี [location|e] ชายแดนที่ตรงตามเงื่อนไข"

 mission_army: "ระดมพลกองทัพ"
 mission_army_desc: "ไม่ว่าจะคัดเลือกจากบริวารผู้จงรักภักดีหรือระดมพลจากชาวประชา กองทัพของเราต้องพร้อมสรรพ กองทหารประจำการจะมอบระเบียบวินัยและความอดทน ในขณะที่กองเกณฑ์จะช่วยเพิ่มกำลังพลยามมีภัย สงคราม เมื่อรวมกัน พวกเขาจักเป็นขุมกำลังที่คู่ควรแก่การปกป้องแผ่นดิน และแผ่แสนยานุภาพของเราให้ขจรขจายไปทั่วทิศ"
 mission_army_tip: "@arrow_bonus_tier_3! ในช่วงต้นของเกม [levies_with_icon|e] ของท่านจะเป็นกำลังหลักในการรบ ท่านสามารถเพิ่มขนาดของ [levies] ได้โดยการมอบ [privileges_with_icon|e] บางประการ หรือยอมรับ [cultures_with_icon|e] เพิ่มเติมจาก [Link('country_culture', 'subtab = breakdown', '@society_panel! แผงสังคม > วัฒนธรรม')]\n\n@arrow_bonus_tier_2! ท่านยังสามารถสร้าง [regulars_with_icon|e] หรือจ้าง [mercenaries_with_icon|e] ได้จาก [Link('unit_overview', '', '@military_panel! $lateralview_unit_overview_entry_name$')]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_has_unraised_levies_in_war', '@hint! คำแนะนำเกี่ยวกับกองเกณฑ์')]#!"

 mission_army_infantry: "เรียกระดมทหารราบ"
 mission_army_infantry_desc: "หัวใจสำคัญของทัพบกที่ประสบชัยชนะ จักเป็นอื่นไปมิได้นอกจากทหารราบ กองกำลังชายฉกรรจ์ที่ฝึกปรือมาอย่างดี พร้อมจักปกป้องราษฎร และกวาดล้างอริราชศัตรูให้สิ้นซาก!"
 mission_army_cavalry: "เรียกระดมทหารม้า"
 mission_army_cavalry_desc: "ด้วยการรุกไล่ที่รวดเร็วและระลอกคลื่นแห่งความตาย ทหารม้าของเราจักบันดาลความหวาดหวั่นพรั่นพรึง ขวัญหนีดีฝ่อแก่ปัจจามิตร เราจักระดมกองกำลังอันไร้เทียมทาน เพื่อบดขยี้ผู้ใดก็ตามที่กล้าขวางทางเรา!"
 mission_army_levies: "เกณฑ์ไพร่พล"
 mission_army_levies_desc: "เป็นหน้าที่ของชายฉกรรจ์ทุกคนที่จักต้องจับอาวุธ เพื่อปกป้องไพร่ฟ้าหน้าใสและผลประโยชน์ของแผ่นดินเรา"
 mission_army_mercenaries: "กองทัพทหารรับจ้าง"
 mission_army_mercenaries_desc: "เหล่านักรบต่างชาติผู้เจนจบในยุทธศิลป์ จักเป็นแกนหลักอันเข้มแข็ง ให้แก่การศึกครั้งหน้าของเรา"
 mission_obtain_casus_belli_parliament: "ความชอบธรรมโดยสภา"
 mission_obtain_casus_belli_parliament_desc: "แผนการแผ่ขยายดินแดนของเรานั้น ขึ้นอยู่กับการสร้างความชอบธรรม ในการทำสงครามต่อศัตรูผ่านทางสภา"
 mission_obtain_casus_belli_spy_network: "ความพยายามในการจารกรรม"
 mission_obtain_casus_belli_spy_network_desc: "เหล่าสายลับของเราคือเพชฌฆาตผู้ปรีชา ที่พร้อมจักแทรกซึมเข้าสู่สภาบริหารของอริราชศัตรู ด้วยความช่วยเหลือของพวกเขา เราจักหยั่งรู้ถึงกิจการภายในของศัตรู และแม้กระทั่งกำหนดเป้าหมายสำหรับการศึกที่กำลังจักมาถึง!"
 designate_rival_as_main_threat_tt: "เราจักกำหนดให้หนึ่งใน [rival|e] ที่เราได้หยามเกียรติไปนั้น เป็นปรปักษ์หลักของ [mission_tasks|e] เหล่านี้"
 mission_declare_war: "สู่สงคราม!"
 mission_declare_war_desc: "แผนการและการเตรียมการของเราจักเสร็จสิ้นในมิช้า ถึงเวลาที่เราจักประกาศสงครามและชิงลงมือในยามที่โอกาสเปิดกว้าง"
 mission_declare_war_tip: "@arrow_bonus_tier_3! ไปที่ #high แผงควบคุมประเทศต่างแดน#! ของ [country_with_icon|e] ที่ท่านต้องการโจมตี และคลิกที่ [war_icon] #V ประกาศสงคราม#! [diplomatic_action|e].\n\n@arrow_bonus_tier_2! เลือก [casus_belli_with_icon|e] ของท่านที่ด้านล่างของแผงควบคุม\n\n@arrow_bonus_tier_1! พึงระวัง [allies_with_icon|e] ที่ศัตรูของท่านอาจเรียกเข้าร่วมใน [war].\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_war', '@hint! สงคราม')], [Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! การปิดล้อม')], และ [Link('hints', 'selected_hint = hint_battle', '@hint! ยุทธการ')]#!"
 
 justify_religious_war: "สร้างความชอบธรรมแก่สงครามทางความเชื่อ"
 justify_religious_war_desc: "พวกนอกรีตและผู้ไร้ศรัทธาที่อยู่รายล้อมพรมแดนของเรา จักได้ประจักษ์ถึงแสนยานุภาพแห่งทัพบกของเราในเร็ววัน เพื่อสร้างความชอบธรรมให้แก่การเคลื่อนพลทำศึก เราจำต้องยื่นฎีกาต่ออำนาจสูงสุดภายในศาสนจักร [ShowReligionAdjective('catholic')]"
 mobilize_the_clergy: "ระดมสรรพกำลังเหล่า [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]"
 mobilize_the_clergy_desc: "รากเหง้าของประชากรและหัวใจสำคัญ ของสังคมอันยิ่งใหญ่ของเราคือศรัทธา ด้วยการร้อยเรียงโดยเหล่าสมณะผู้ทรงธรรม เราจำต้องพึ่งพาเหล่า [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] เพื่อปลุกระดมไพร่ฟ้าหน้าใสสู่ความขัดแย้งที่กำลังจักมาถึง!"

 raise_a_navy: "จัดตั้งทัพเรือ"
 raise_a_navy_desc: "ความเป็นจ้าวเหนือชายฝั่งของเราจักมิอาจมีผู้ใดกังขาได้ ในยามที่เราเตรียมทำศึก การจัดตั้งทัพเรืออันเกรียงไกรจักช่วยในความพยายามปิดอ่าว และเร่งการศึกของเราให้รวดเร็วยิ่งขึ้น"
 raise_a_navy_tip: "@arrow_bonus_tier_3! ในช่วงต้นของเกม [navy_levies_with_icon|e] ของท่านจะเป็นกำลังหลักในการรบ ท่านสามารถเพิ่มขนาดของ [navy_levies] ได้โดยการมอบ [privileges_with_icon|e] หรือยอมรับ [cultures_with_icon|e] เพิ่มเติมจาก [Link('country_culture', 'subtab = breakdown', '@society_panel! แผงสังคม > วัฒนธรรม')].\n\n@arrow_bonus_tier_2! ท่านยังสามารถสร้าง [regular_ship_with_icon|e] หรือจ้าง [mercenaries_with_icon|e] ได้จาก [Link('unit_overview', '', '@military_panel! $lateralview_unit_overview_entry_name$')]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_has_unraised_levies_in_war', '@hint! คำแนะนำเกี่ยวกับกองเกณฑ์')]#!"
 mission_surpass_enemy: "อยู่เหนือศัตรู"
 mission_surpass_enemy_desc: "การศึกที่กำลังดำเนินอยู่นี้ได้ชี้ให้เห็นถึงความจำเป็น ที่ทัพเรือของเราต้องเหนือกว่าเหล่าอริ หากเราต้องการรักษาความเป็นจ้าวทางทะเลไว้ เราต้องออกค้นหาและทำลายล้างเสีย"

 mission_armory: "สร้างคลังสรรพาวุธ"
 mission_armory_desc: "การแผ่อิทธิพลที่เพิ่มขึ้น ในกิจการระดับภูมิภาครอบขอบขัณฑสีมา [ROOT.GetCountry.GetFlavorRank] ของเรานั้น ทำให้จำเป็นต้องมีการผลักดัน เพื่อรองรับกองทหารประจำการที่เพิ่มขึ้น ผ่านการสร้างศูนย์รับสมัครพล ดินแดนที่เติบโตจนถือเป็นเมืองหรือนครแล้ว สามารถและควรผลักดันให้มีการจัดตั้ง [ShowBuildingTypeName('armory')] ในท้องถิ่น"
 mission_manpower: "จัดหากำลังพล"
 mission_manpower_desc: "เพื่อเสริมกำลังและรับรองการจัดหาบุรุษมารับใช้ชาติ เราจำต้องรักษาระบบกองหนุนอันเข้มแข็งที่เต็มไปด้วยทหารเกณฑ์หน้าใหม่!"

 mission_reduce_antagonism: "ลด $antagonism$"
 mission_reduce_antagonism_desc: "การพิชิตดินแดนโพ้นทะเลของเรา จักต้องเป็นที่จับตามองของเพื่อนบ้านอย่างแน่นอน เพื่อหลีกเลี่ยงมิให้พวกเขารวมตัวกันต่อต้านเรา เราจำต้องหาทางปรับปรุงภาพลักษณ์ของตนในสายตาของพวกเขา"
 mission_restore_province: "กู้คืนความมั่งคั่ง"
 mission_restore_province_desc: "ความพินาศจากสงครามมิได้ปรานี ต่อผู้ที่เพิ่งเข้ามาเป็นส่วนหนึ่งในขอบขัณฑสีมาของเรา การฟื้นฟูความมั่งคั่งคือหนทางอันประเสริฐ ในการปรับปรุงทัศนคติของคนท้องถิ่นในจังหวัดที่พิชิตได้ใหม่"
 mission_restore_province_tip: "@arrow_bonus_tier_3! [war_with_icon|e] มักจะทำลาย [prosperity_with_icon|e] ใน [locations_with_icon|e] ของท่าน ซึ่งจะฟื้นฟูตามกาลเวลา แต่ท่านสามารถเร่งการฟื้นฟูได้ด้วย [cabinet_action_with_icon|e]\n\n@arrow_bonus_tier_2! ไปที่ [Link('government', 'tabcontent = cabinet', '@government_panel! แผงควบคุมการปกครอง > คณะที่ปรึกษา')] เพื่อดู [cabinet_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_1! มอบหมาย [cabinet_member_with_icon|e] ให้ปฏิบัติ [cabinet_action|e] [ShowCabinetActionName('recovery_effort')]"
 non_scope_every_pop_conquest_location_var_province_10_sat_tt: "[pops|e] ของเราใน [province|e] ที่กำหนดจะได้รับ [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]"
 every_pop_conquest_location_var_province_10_sat_tt: "[pops|e] ของเราใน [conquest_province.GetName] จะได้รับ [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]"

#generic_vassal_ties
 generic_vassal_ties: "ความสัมพันธ์กับ $vassal$"
 generic_vassal_ties_DESCRIPTION: "เราต้องให้แน่ใจว่าความสัมพันธ์กับ $vassal$ ของเรานั้นมั่นคง!"
 generic_vassal_ties_CRITERIA_DESCRIPTION: "ความสัมพันธ์ของเรากับ $vassal$ แข็งแกร่งยิ่งกว่าครั้งใด"
 generic_vassal_ties_BUTTON_TOOLTIP: "การร่วมมือกับเมืองขึ้นที่ไว้ใจได้นั้นสำคัญยิ่ง ต่อการก้าวผ่านความท้าทายทั้งภายนอกและภายในในยามที่สถานการณ์ไม่แน่นอน"
 generic_vassal_ties_BUTTON_DETAILS: "ในยามที่บ้านเมืองวุ่นวายและไม่แน่นอน เราจำต้องหันหา $vassal$ ที่ไว้ใจได้ เพื่ออดทนต่ออุปสรรคและศัตรูใดก็ตามที่ปรากฏขึ้นขวางทาง มีเพียงความร่วมมือและไมตรีจิตต่อกันเท่านั้นที่จักช่วยให้เราผ่านพ้นไปได้!"
 monthly_events_about_annexation_tt: "[events|e] รายเดือนเกี่ยวกับการผนวกดินแดนที่กำลังดำเนินอยู่ อาจเกิดขึ้นในขณะที่ [mission|e] นี้กำลังทำงาน"
 mission_commence_annexation: "เริ่มการผนวกดินแดน"
 mission_commence_annexation_desc: "แม้เราจักมีไมตรีจิตต่อกัน แต่ดูเหมือนว่าอำนาจปกครองตนเอง ของเมืองขึ้นของเราได้มาถึงจุดสิ้นสุดแล้ว ดังนั้นเราจึงต้องเริ่มกระบวนการรวมพวกเขา เข้าสู่ขอบขัณฑสีมาของเราอย่างเป็นทางการ"
 mission_commence_annexation_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ #V จัดการบริวารใต้อาณัติ#! เพื่อดู [subjects_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! คลิกที่ชื่อของ [subject] เพื่อเปิด [diplomatic_actions|e]\n\n@arrow_bonus_tier_1! เลือก #V $ANNEXTITLE$#!."

 mission_complete_annexation: "เสร็จสิ้นการผนวกดินแดน"
 mission_complete_annexation_desc: "ความพยายามในการรวมดินแดนเมืองขึ้นของเราดำเนินไปด้วยดี แม้การนี้จักต้องใช้เวลา ทว่าเรายังคงรุดหน้าโดยมุ่งหมายจักรวมเป็นหนึ่งเดียว"
 mission_select_vassal: "เลือก [ShowSubjectTypeName('vassal')] สำหรับ [mission|e] นี้"
 mission_no_valid_vassals: "@trigger_no! ไม่มี [ShowSubjectTypeName('vassal')] ที่พร้อมใช้งาน"

 mission_connect_the_capitals: "เชื่อมโยงเมืองหลวง"
 mission_connect_the_capitals_desc: "การสื่อสารที่เหมาะสมและเส้นทางโครงสร้างพื้นฐานที่เชื่อมต่อโดยตรง ระหว่างทำเลต่าง ๆ ใน [ShowSubjectTypeName('vassal')] จักช่วยรับรองเส้นทางที่จะเพิ่มความจงรักภักดีของพวกเขา"
 mission_connect_the_capitals_tip: "@arrow_bonus_tier_2! ไปที่ [capital_with_icon|e] ของท่าน [Player.GetCapital.GetName] และคลิกที่ปุ่ม #V สร้างถนน#! \n\n@arrow_bonus_tier_1! สร้าง [road_with_icon|e] ไปยัง [location|e] เพื่อนบ้าน เพื่อนำ [capital|e] ของบริวารมาให้ใกล้ชิดกับเรายิ่งขึ้น"

 mission_monetary_assistance: "การเกื้อกูลทางการเงิน"
 mission_monetary_assistance_desc: "เป็นหน้าที่ของเราที่จะต้องเกื้อกูลเมืองขึ้นผู้ยากไร้ ด้วยการช่วยเหลือทางการเงินอย่างพอเพียง การนี้จักช่วยกระชับความสัมพันธ์ และอำนวยให้การทูตราบรื่นยิ่งขึ้น ของกำนัลสู่เงินคลังจักช่วยส่งเสริมความมั่งคั่งของพวกเขา!"
 mission_monetary_assistance_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ #V จัดการบริวารใต้อาณัติ#! เพื่อดู [subjects_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! คลิกที่ชื่อของ [subject] เพื่อเปิด [diplomatic_actions|e]\n\n@arrow_bonus_tier_1! นำตัวกรองคำสั่งบริวารออกเพื่อดูคำสั่งทั้งหมด และมองหา #V $send_gift$#!"
 mission_base_of_power: "รากฐานแห่งอำนาจ"
 mission_base_of_power_desc: "เราต้องรับรองว่าเมืองขึ้นของเรา มีที่มั่นอันเข้มแข็งเพื่อใช้เป็นที่ใช้อำนาจบัญชา เมืองหลวงอันทรงพลานุภาพที่สมกับสถานะอันมั่งคั่ง ภายใต้ธงชัยของเรา"
 mission_base_of_power_tip: "@arrow_bonus_tier_3! ไปที่เมืองหลวงของบริวารท่าน\n\n@arrow_bonus_tier_2! คลิกที่ปุ่ม @build_icon! #V สร้าง#! เพื่อดูรายการ [buildings_with_icon|e] ที่ท่านสามารถสร้างได้ใน [location_with_icon|e]\n\n@arrow_bonus_tier_2! เรียงลำดับตามผลกำไรและเริ่มสร้างสิ่งปลูกสร้างที่ท่านเห็นว่าเหมาะสมที่สุด"

 mission_improve_relations_with_vassal: "ปรับปรุงความสัมพันธ์กับ [ROOT.GetCountry.MakeScope.GetVariable('mission_chosen_vassal_variable').GetCountry.GetNameWithNoTooltip]"
 mission_improve_relations_with_vassal_desc: "เพื่อส่งเสริมความร่วมมือระหว่างประเทศของเรา เราต้องติดต่อเมืองขึ้นของเรา และสถาปนาสายสัมพันธ์ทางการทูตที่เข้มแข็ง" 
 mission_improve_relations_with_vassal_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ #V จัดการบริวารใต้อาณัติ#! เพื่อดู [subjects_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! คลิกที่ชื่อของ [subject] เพื่อเปิด [diplomatic_actions|e]\n\n@arrow_bonus_tier_1! เลือก [opinion_icon] #V $IMPROVE_RELATIONTITLE$#! ในบัตรประเทศด้านบน และรอให้ทัศนคติเพิ่มขึ้น พึงระลึกว่าการออกคำสั่งนี้จะเสีย [diplomat_with_icon|e] #V 1#! ท่าน"

 mission_joint_military_development: "การพัฒนาทางการทหารร่วมกัน"
 mission_joint_military_development_desc: "เพื่อปกป้องขอบขัณฑสีมาของเรา ความร่วมมือทางการทหารระหว่างเรา และเมืองขึ้นจึงเป็นสิ่งสำคัญยิ่ง"
 mission_joint_military_development_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ #V จัดการบริวารใต้อาณัติ#! เพื่อดู [subjects_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! คลิกที่ชื่อของ [subject] เพื่อเปิด [diplomatic_actions|e]\n\n@arrow_bonus_tier_1! เลือก #V $offer_support_military$#!"
 mission_target_subject_will_lose_lib_desire_gain_center_of_urbanization_modifier_capital_tt: "[subject|e] ที่กำหนดจะลด [liberty_desire|e] ลง และ [capital|e] จะได้รับ [modifier|e] [ShowModifier('center_of_urbanization_modifier')]"

#generic_humiliate_rival
 generic_humiliate_rival: "หยามเกียรติคู่อริ"
 generic_humiliate_rival_DESCRIPTION: "ผู้ใดที่บังอาจจักประลองกำลังกับเรา จักต้องสำนึกถึงความต่ำต้อยของตน!"
 generic_humiliate_rival_CRITERIA_DESCRIPTION: "เราได้ก้าวข้ามคู่อริได้สำเร็จแล้ว"
 generic_humiliate_rival_BUTTON_TOOLTIP: "อาณาจักรจำต้องสำแดงความเป็นจ้าวเหนือคู่อริที่ริษยา ด้วยการก้าวข้ามความทะเยอทะยานของพวกมัน และช่วงชิงความเป็นจ้าวมาครอบครอง"
 generic_humiliate_rival_BUTTON_DETAILS: "เหล่าคู่อริและศัตรูของเราเฝ้ามองดูเราด้วยความริษยา ในยามที่เรามีชัยในความมั่งคั่งและยกระดับราษฎรสู่จุดสูงสุดใหม่ ถึงเวลาที่เราจักสถาปนาความเป็นจ้าวเหนือผู้ที่คิดจะเทียมเรา และก้าวข้ามพวกมันไปตลอดกาล"

 mission_insult_rival: "กลอุบายทางการทูต"
 mission_insult_rival_desc: "การกล่าวคำลบหลู่อย่างแยบยลต่อคู่อริของเรา เป็นหนทางอันประเสริฐในการเปิดโปงข้อบกพร่อง และสถาปนาความเป็นจ้าวเหนือพวกมันในระหว่างการเจรจาทางการทูต"
 mission_insult_rival_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่แถว #V ปุ่ม [rivals_icon|e] คู่อริ #! \n\n@arrow_bonus_tier_2! ท่านยังสามารถคลิกที่ [rivals_icon] #W การแจ้งเตือนคู่อริที่เป็นไปได้#! \n\n@arrow_bonus_tier_1! ท่านสามารถรอจนกว่า [countries] อื่น ๆ จะประกาศ [rivals] ก่อนจะเริ่มเคลื่อนไหว เพื่อมิให้เป็นการขัดใจต่อ [countries] ที่ไม่เกี่ยวข้อง \n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_lacks_of_rivals', '$hint_lacks_of_rivals$ คำแนะนำ')]#!"

 mission_impose_embargo: "ใช้มาตรการคว่ำบาตร"
 mission_impose_embargo_desc: "เรามิอาจปล่อยให้สายลับต่างชาติและอริศัตรูเข้ามายังตลาดของเรา และแสวงกำไรจากการค้าภายในพรมแดนของเราได้!"
 mission_impose_embargo_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ธงของ #V [rivals_icon|e] คู่อริ#! ที่ต้องการ \n\n@arrow_bonus_tier_2! ท่านสามารถคลิกใน [diplomacy_icon] #W คำสั่งทางการทูต#! ภายใต้ #W คำสั่งทางเศรษฐกิจ#! \n\n@arrow_bonus_tier_1! มองหาและคลิกที่ #W คว่ำบาตรประเทศ#! เพื่อคว่ำบาตรพวกมัน"

 market_dominance_key: "ความเป็นจ้าวแห่งตลาด"
 mission_humiliate_rival: "หยามเกียรติคู่อริ"
 mission_humiliate_rival_desc: "ด้วยการกดดันคู่อริของเราที่โต๊ะเจรจาทางการทูต และสำแดงความเป็นจ้าวที่เหนือกว่าต่อพวกมัน เราจะยิ่งเสริมสร้างความแข็งแกร่งทั้งภายในและต่างแดน"
 mission_humiliate_rival_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ธงของ #V [rivals_icon|e] คู่อริ#! ที่ต้องการ \n\n@arrow_bonus_tier_2! ท่านสามารถคลิกที่ [war_icon] #W ปุ่มประกาศสงคราม#! ในบัตรประเทศ หรือใน [diplomacy_icon] #W คำสั่งทางการทูต#! ภายใต้ [hostile_icon] #W พฤติกรรมอันเป็นศัตรู#! \n\n@arrow_bonus_tier_1! พิจารณาจัดหา [casus_belli_with_icon|e] ก่อนประกาศ [war] เราสามารถร้องขอได้ในระหว่าง [parliament|e] หรือสร้างขึ้นมาต่อ [rivals|e] \n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_war', '$hint_war$ คำแนะนำ')] และ [Link('hints', 'selected_hint = hint_call_for_peace', '$hint_call_for_peace$ คำแนะนำ')]#!"

 mission_surpass_rival: "ก้าวข้ามอริศัตรู"
 mission_surpass_rival_desc: "ผู้ใดที่มุ่งจะแย่งชิงฐานะอันรุ่งโรจน์ของเรา จักต้องได้ประจักษ์ว่าพวกมันเป็นเพียงเศษผงที่ไร้ค่า แสนยานุภาพของเราจักต้องบดบังรัศมีกองทัพบกอันจ้อยร่อยของพวกมัน!"
 mission_surpass_rival_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ธงของ #V [rivals_icon|e] คู่อริ#! ที่ต้องการ \n\n@arrow_bonus_tier_2! คอยตรวจสอบใน [country_icon|e] #W แผงควบคุมประเทศ#! ของพวกมันเพื่อเปรียบเทียบกำลังกับเรา \n\n@arrow_bonus_tier_1! พิจารณาประกาศ [war_with_icon|e] เพื่อบั่นทอนกำลังพวกมันอย่างต่อเนื่อง \n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_war', '$hint_war$ คำแนะนำ')] และ [Link('hints', 'selected_hint = hint_call_for_peace', '$hint_call_for_peace$ คำแนะนำ')]#!"
 should_complete_stronger_than_rival_tt: "การทำ [task|e] นี้ให้สำเร็จด้วย [military_strength|e] ที่สูงกว่าเมื่อเทียบกับ [target_rival.GetName] จะได้รับ [prestige|e] #G 20#!"

 mission_establish_spy_networks: "จัดตั้งเครือข่ายจารกรรม"
 mission_establish_spy_networks_desc: "เพื่อกุมบังเหียนกิจการของเหล่าคู่อริให้มั่น เราพึงสร้างความมั่นใจว่าได้ส่งสายลับแทรกซึมเข้าสู่กลุ่มของพวกเขาแล้ว"
 mission_establish_spy_networks_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ธงของ #V [rivals_icon|e] คู่อริ#! ที่ต้องการตกเป็นเป้าหมาย\n\n@arrow_bonus_tier_2! ท่านสามารถเลือกคลิกที่บัตรข้อมูลประเทศ [spy_network_icon] #W ปุ่มเครือข่ายจารกรรม#! หรือใน [diplomacy_icon] #W คำสั่งทางการทูต#! ภายใต้ [hostile_icon] #W พฤติกรรมอันเป็นศัตรู#!\n\n@arrow_bonus_tier_1! สร้าง [spy_network_with_icon|e] ใน [rivals] ของเราเพื่ออ้างสร้าง [casus_belli|e] ต่อพวกเขา \n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_lacks_of_rivals', '$hint_lacks_of_rivals$ คำแนะนำ')]"

 mission_destabilize_rival: "ยุแยงให้แตกแยกในหมู่คู่อริ"
 mission_destabilize_rival_desc: "หากเราจักเปลี่ยนคู่อริให้กลายเป็นเหยื่อที่เคี้ยวง่าย เราต้องทำให้พวกเขาขาดเสถียรภาพภายในและอ่อนแอต่อการรุกรานจากภายนอก"
 mission_destabilize_rival_tip: "@arrow_bonus_tier_3! ไปที่ [Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! การทูต > ความสัมพันธ์ปัจจุบัน')] และคลิกที่ธงของ #V [rivals_icon|e] คู่อริ#! ที่ต้องการตกเป็นเป้าหมาย\n\n@arrow_bonus_tier_2! ท่านสามารถเลือกคลิกที่บัตรข้อมูลประเทศ [spy_network_icon] #W ปุ่มเครือข่ายจารกรรม#! หรือใน [diplomacy_icon] #W คำสั่งทางการทูต#! ภายใต้ [hostile_icon] #W พฤติกรรมอันเป็นศัตรู#!\n\n@arrow_bonus_tier_1! สร้าง [spy_network_with_icon|e] ใน [rivals] ของเราเพื่อให้มี [spy_network_with_icon|e] มากพอสำหรับใช้ #W คำสั่งทางการทูตยุแยงให้แตกแยก#! ต่อพวกเขา ซึ่งสามารถพบได้ใน [diplomacy_icon] #W คำสั่งทางการทูต#! > [spy_network_icon] #W ปฏิบัติการลับ#! \n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_lacks_of_rivals', '$hint_lacks_of_rivals$ คำแนะนำ')]"

 mission_task_select_rival: "เลือก [rival|e] สำหรับ [mission_tasks|e] ที่กำลังจะมาถึง"
 mission_task_no_rival: "@trigger_no! ไม่มี [rival|e] ที่สามารถเลือกได้"
 impacted_by_foreign_destabilization_efforts_modifier_tt: "พวกเขาจะได้รับผลกระทบจาก [ShowModifier('foreign_destabilization_efforts_modifier')] [modifier|e] ผ่านทาง [event|e]"

#generic_trade
 generic_trade: "การพัฒนาการค้า"
 generic_trade_DESCRIPTION: "หากเราปรารถนาจักเพิ่มพูนความมั่งคั่ง เราต้องมองหาหนทางในการส่งเสริมกิจการพาณิชย์ของเรา!"
 generic_trade_CRITERIA_DESCRIPTION: "เราได้กำหนดนโยบายการค้าและปรับปรุงโครงสร้างพื้นฐานที่เกี่ยวข้องแล้ว"
 generic_trade_BUTTON_TOOLTIP: "โลกแห่งการค้าที่เต็มไปด้วยการแข่งขัน มอบโอกาสอันมั่งคั่งผ่านการแลกเปลี่ยนสินค้าและเส้นทางการค้าอันห่างไกล"
 generic_trade_BUTTON_DETAILS: "โลกของธุรกิจเต็มไปด้วยเหล่าพ่อค้าที่จ้องจะตัดราคา และการแข่งขันที่ดุเดือด ทว่ายังมีเหรียญทองอีกมากที่หาได้จากการแลกเปลี่ยนสินค้า และการจัดตั้งเส้นทางการค้าโพ้นทะเล!"

 mission_increase_maritime_presence: "อิทธิพลทางทะเล"
 mission_increase_maritime_presence_desc: "การพัฒนาเส้นทางเดินเรือเพื่อเชื่อมต่อท่าเรือของเรา มีบทบาทสำคัญต่อความมั่งคั่งที่สั่งสมมา ดังนั้นเราจึงต้องมุ่งขยายอิทธิพลทางทะเลที่มีอยู่เดิม เพื่อรักษาความเป็นจ้าวทางการค้าของเราไว้!"
 mission_increase_maritime_presence_tip: "$mission_expand_merchant_power_tip$"

 mission_protect_our_coasts: "ปกป้องแนวชายฝั่งของเรา"
 mission_protect_our_coasts_desc: "โจรสลัดที่ออกปล้นสะดม พ่อค้าต่างชาติที่ละโมบ และผู้แสวงหาความมั่งคั่งโดยมิชอบ ต่างจ้องมองชายฝั่งและทรัพย์สมบัติของเราตาเป็นมัน การก่อสร้างโครงสร้างพื้นฐานเพื่อการป้องกันตลอดแนวชายฝั่ง จะทำให้เราสามารถขับไล่ศัตรูและรักษาความมั่งคั่งเอาไว้ได้"
 mission_protect_our_coasts_tip: "@arrow_bonus_tier_3! ไปที่ [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองตาม @soldiers![ShowPopTypeName('soldiers')] [buildings] และคลิกที่ [ShowBuildingTypeName('coastal_fort')] [building]\n\n@arrow_bonus_tier_1! สร้างสิ่งปลูกสร้างนั้นในหนึ่งใน [urban_locations|e] ริมชายฝั่งของท่าน"

 mission_establish_wharfs: "จัดตั้งท่าเทียบเรือ"
 mission_establish_wharfs_desc: "แก่นแท้แห่งความมั่งคั่งของเราอยู่ที่ศักยภาพของชายฝั่งที่ยังมิได้นำมาใช้ เพื่อแผ่ขยายความมั่งคั่ง เราต้องเพิ่มพูนโครงสร้างพื้นฐานทางทะเล!"
 mission_establish_wharfs_tip: "@arrow_bonus_tier_3! ไปที่ [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองตาม @burghers![ShowPopTypeName('burghers')] [buildings] และคลิกที่ [ShowBuildingTypeName('wharf')] [building]\n\n@arrow_bonus_tier_1! สร้างสิ่งปลูกสร้างนั้นใน [urban_locations|e] ของท่าน"
 mission_establish_docks: "การขยายเขตชายฝั่ง"
 mission_establish_docks_desc: "แม้ว่า [ShowBuildingTypeName('wharf')] จะรับใช้เรามาอย่างซื่อสัตย์ แต่เราต้องเป็นผู้นำด้านนวัตกรรมทางทะเลเสมอ ด้วยเหตุนี้ การก่อสร้างอู่เรือที่กว้างขวางตลอดแนวชายฝั่งจึงถือเป็นความจำเป็น"
 mission_establish_docks_tip: "@arrow_bonus_tier_3! ไปที่ [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองตาม @soldiers![ShowPopTypeName('soldiers')] [buildings] และคลิกที่ [ShowBuildingTypeName('dock')] [building]\n\n@arrow_bonus_tier_1! สร้างสิ่งปลูกสร้างนั้นใน [urban_locations|e] ของท่าน"

 mission_merchant_fleet: "กองเรือพาณิชย์"
 mission_merchant_fleet_desc: "กระดูกสันหลังของกิจการพาณิชย์ของเรา คือเหล่ากองเรือต่างชาติที่ขนส่งสินค้าไปมายังท่าเรือของเรา ถึงเวลาแล้วที่เราจะจัดตั้งกองเรือพาณิชย์ของเราเอง"
 mission_merchant_fleet_tip: "@arrow_bonus_tier_2! ไปที่ [Link('unit_overview', '', '@military_panel! การทหาร > ทัพเรือ')] และคลิกที่ปุ่ม [regular_ship_icon]#V $RECRUIT_S_BUTTON$#! เพื่อสร้าง [regular_ships|e]\n\n@arrow_bonus_tier_1! ท่านจำเป็นต้องครอบครอง [buildings|e] ที่สามารถเกณฑ์ [regular_ships] ได้ เช่น [ShowBuildingTypeName('wharf')] หรือ [ShowBuildingTypeName('dock')]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่คำแนะนำเรื่อง [Link('hints', 'selected_hint = hint_low_sailors', '@hint! กะลาสี')] และ [Link('hints', 'selected_hint = hint_has_unraised_levies_in_war', '@hint! กองเกณฑ์')]"

 mission_establish_market_center: "จัดตั้งศูนย์กลางตลาด"
 mission_establish_market_center_desc: "แม้เราจะดำเนินธุรกิจในหลายตลาด แต่เหล่าที่ปรึกษาเห็นพ้องว่าจำเป็นที่เราจะต้องได้หัวใจสำคัญของตลาดมาครอง ไม่ว่าจะด้วยวิธีการใดก็ตาม"
 mission_establish_market_center_tip: "@arrow_bonus_tier_3! ไปที่ [Link('trade', 'subtab = markets', '@economy_panel! เศรษฐกิจ > ตลาด')] และคลิกที่ปุ่ม [market_icon]#V $create_market$#!\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_markets', '@hint! คำแนะนำเรื่องตลาด')]"

 mission_burgher_relations: "ความสัมพันธ์กับ [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]"
 mission_burgher_relations_desc: "ความสัมพันธ์อันดีกับเหล่าพ่อค้าจะส่งผลดีต่องบดุลของเรา เนื่องจากพวกเขาจะมีแรงจูงใจในการเพิ่มปริมาณธุรกิจภายในขอบเขตแดนของเรา!"
 mission_burgher_relations_tip: "@arrow_bonus_tier_3! ไปที่ [Link('government', 'tabcontent = estates', '@government_panel!แผงการปกครอง > ฐานันดร')] เพื่อดู [estates_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! $increase_estate_satisfaction_tip$"

 mission_winds_of_trade: "สายลมแห่งการค้า"
 mission_winds_of_trade_desc: "ไม่ว่าจะเลือกสนับสนุนแนวทางพาณิชยนิยมและการปกป้องตลาด หรือจะเปิดท่าเรือทั้งหมดให้แก่พ่อค้าต่างชาติ ล้วนเป็นผู้ตัดสินใจที่จะกำหนดชะตากรรมของชาติเรา"

 mission_solid_approach: "แนวทางที่มั่นคง"
 mission_solid_approach_desc: "ไม่ว่าเราจักเลือกสนับสนุนแนวทางพาณิชยนิยม หรือแนวทางแบบเปิด เหล่าที่ปรึกษาต่างเห็นพ้องในการมุ่งไปสู่ทิศทางที่เลือกอย่างเต็มกำลัง"

 mission_burgher_privileges: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] อันทรงอำนาจ"
 mission_burgher_privileges_desc: "ชนชั้นพ่อค้าที่เข้มแข็งคือรากฐานสำคัญสู่ความสำเร็จทางการพาณิชย์ และความมั่งคั่ง การมอบเอกสิทธิ์พิเศษแก่เหล่าพ่อค้าจักช่วยลดอุปสรรค และเป็นประโยชน์ต่อเงินคลังของเรา"
 mission_burgher_privileges_tip: "@arrow_bonus_tier_2! ไปที่ [Link('government', 'tabcontent = estates', '@government_panel! แผงการปกครอง > ฐานันดร')] เพื่อดู [estates_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_1! มอบ [privilege_with_icon|e] ใหม่ให้แก่ [GetEstateName('burghers_estate')]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_estates', '@hint! คำแนะนำเรื่องฐานันดร')]"
 triggers_revealed_after_previous_task_complete_tt: "เงื่อนไขของ [mission_task|e] นี้จักปรากฏแจ้ง เมื่อเราเสร็จสิ้น [mission_task|e] ก่อนหน้าแล้ว"
