 mission_enact_government_reforms: "ประกาศใช้การปฏิรูปการปกครอง"
 mission_enact_government_reforms_desc: "ความจำเป็นในการกำหนดขอบเขตการปกครอง ของเราให้ชัดเจนยิ่งขึ้นนั้นปรากฏให้เห็นแจ้งแล้ว หากเราปรารถนาจักสร้างเสถียรภาพและเพิ่มอำนาจบัญชาส่วนกลาง เราต้องใส่ใจต่อการตรากฎปฏิรูปที่จำเป็น"
 mission_enact_government_reforms_tip: "@arrow_bonus_tier_3! ไปที่ [Link('government', 'tabcontent = estates', '@government_panel! การปกครอง > ฐานันดร')]\n\n@arrow_bonus_tier_2! คลิก #V ปุ่มบวก #!ที่ด้านขวาล่างของการ์ด [ShowEstateTypeName('crown_estate')] เพื่อเลือกหนึ่งในการ [reforms_with_icon|e] ที่มีอยู่\n\n@arrow_bonus_tier_1! [government_reforms] ต้องใช้ [stability_with_icon|e] ในการยกเลิก และใช้เวลานานในการบังคับใช้ จงเลือกสรรด้วยความระมัดระวัง\n\n #italic เพื่อเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_has_possible_reform', '$hint_has_possible_reform$ คำแนะนำ')] และ [Link('hints', 'selected_hint = hint_crown_power', '$hint_crown_power$ คำแนะนำ')]#!"

