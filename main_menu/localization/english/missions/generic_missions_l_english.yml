 generic_conquer_province_CRITERIA_DESCRIPTION: "[ROOT.GetCountry.GetFlavorRank] ของเราได้แผ่ขยายดินแดนออกไปแล้ว"
 generic_conquer_province_BUTTON_TOOLTIP: "การรุกคืบเชิงรุกนั้นจำเป็นยิ่ง เพื่อต่อต้านภัยคุกคามจากการขยายดินแดน ของเหล่าอริราชศัตรูที่อยู่รายล้อม"
 generic_conquer_province_BUTTON_DETAILS: "พรมแดนรอบขอบขัณฑสีมาของเรานั้น เต็มไปด้วยศัตรูและผู้ที่จ้องจะทำลายการปกครองของเรา เราต้องเป็นฝ่ายชิงลงมือก่อนและเริ่มเปิดการศึก มิฉะนั้นเราอาจตกเป็นเหยื่อของพวกพญาแร้งเพื่อนบ้าน ที่จ้องจะแผ่ขยายอำนาจมายังดินแดนของเรา"
