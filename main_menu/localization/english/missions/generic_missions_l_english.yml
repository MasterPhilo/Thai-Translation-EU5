 mission_fund_construction_projects: "สนับสนุนทุนโครงการก่อสร้าง"
 mission_fund_construction_projects_desc: "เพื่อแสดงความจำนงในการร่วมมือกับ[estate|e] พวกเราจะสนับสนุนเหล่านายช่างให้สร้างโครงการก่อสร้างต่างๆ เพื่อกระตุ้นความเจริญและพัฒนาสิ่งอำนวยความสะดวกของฐานันดร"
 mission_fund_construction_projects_tip: "@arrow_bonus_tier_3! ไปยัง [capital_with_icon|e] ของท่าน @location![Player.GetCapital.GetName]\n\n@arrow_bonus_tier_2! คลิกที่ปุ่ม [pop_type_with_icon|e] ที่เหมาะสมทางด้านซ้ายของแผงควบคุม เพื่อดู[buildings_with_icon|e] ที่ท่านสามารถสร้างสำหรับ [pop_type|e] นั้นได้\n\n@arrow_bonus_tier_1! เริ่มต้นการ[construction_with_icon|e] สิ่งปลูกสร้างที่ถูกร้องขอ"
 mission_estate_satisfaction: "ได้รับบุญคุณจาก [mission_target_estate.GetName]"
 mission_estate_satisfaction_desc: "เป็นผลประโยชน์อันสำคัญยิ่งต่อกิจการภายในของพวกเรา ในการดำเนินการเพื่อให้ได้รับบุญคุณจาก[estate|e] ที่ทรงอิทธิพลสำหรับความพยายามในภายภาคหน้า"
 mission_estate_satisfaction_tip: "@arrow_bonus_tier_3! ไปยัง [Link('government', 'tabcontent = estates', '@government_panel! แผงการปกครอง > ฐานันดร')] เพื่อดู[estates_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! $increase_estate_satisfaction_tip$"

 mission_shared_enrichment: "ความมั่งคั่งร่วมกัน"
 mission_shared_enrichment_desc: "การจัดเก็บภาษีที่เหมาะสม หน้ารวมสถิติ และการรับรองความมั่งคั่งของ[estate|e] จะเป็นการวางรากฐานมาตรฐานที่ดีสำหรับการจัดเก็บภาษีทั่วทั้งดินแดนของพวกเรา"
 mission_shared_enrichment_tip: "@arrow_bonus_tier_3! ไปยัง [Link('government', 'tabcontent = estates', '@government_panel! แผงการปกครอง > ฐานันดร')] เพื่อดู[estates_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! [ShowGenericActionName('bribe_estate')] โดยการคลิกที่ #V ปุ่มซื้อตัว#!\n\n@arrow_bonus_tier_1! ท่านยังสามารถลดระดับ[taxes_with_icon|e] ที่เก็บจาก[estate] ได้ที่ [Link('economy', '', '@economy_panel!$lateralview_economy_entry_name$ > งบประมาณ')] และรอให้พวกเขาสะสมความมั่งคั่ง\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_estates', '@hint! คำแนะนำฐานันดร')]"
 mission_shape_society: "หล่อหลอมสังคม"
 mission_shape_society_desc: "กระแสแห่งความเปลี่ยนแปลงกำลังพัดผ่านห้องโถงแห่งอำนาจ ภายในอาณาเขตของพวกเรา หากพวกเราจะยกระดับและปลูกฝัง สายสัมพันธ์อันแน่นแฟ้นระหว่างราชสำนักและ[estate|e] พวกเราก็จักต้องหล่อหลอมสังคมของพวกเราให้สอดคล้องกัน"
 mission_shape_society_tip: "@arrow_bonus_tier_3! ไปยัง [Link('societal_values', '', '@government_panel! แผงการปกครอง > ค่านิยม')] เพื่อตรวจสอบ[societal_values_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! ไปยัง [Link('government', 'tabcontent = cabinet', '@government_panel! แผงการปกครอง > คณะที่ปรึกษา')] เพื่อดู[cabinet_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_1! มอบหมายสมาชิก[cabinet_member_with_icon|e] ให้ปฏิบัติ[cabinet_action|e] [ShowCabinetActionName('change_societal_values')]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! $hint_has_possible_cabinet_action$')] และ [Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! $hint_lack_cabinet_for_cabinet_action$')] คำแนะนำ"

 target_mission_pop_gets_20_satisfaction_tt: "[pops|e] ที่สังกัดอยู่ใน [mission_target_estate.GetNameWithNoTooltip] ใน[capital|e] ของพวกเราจะได้รับ [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [pop_satisfaction|e]"
 every_pop_of_estate_10_satisfaction_tt: "[pops|e] ใน [mission_target_estate.GetNameWithNoTooltip] ที่สังกัดอยู่ใน[culture|e] และ[religion|e] ของพวกเรา #italic ทั่วทั้งประเทศ#! จะได้รับ [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] [pop_satisfaction|e]"
 every_pop_of_no_estate_10_satisfaction_tt: "[pops|e] ใน [estate|e] ที่เลือก ที่สังกัดอยู่ใน[culture|e] และ[religion|e] ของพวกเรา #italic ทั่วทั้งประเทศ#! จะได้รับ [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] [pop_satisfaction|e]"

#traditional economy

 generic_traditional_economy: "เศรษฐกิจตามขนบดั้งเดิม"
 generic_traditional_economy_DESCRIPTION: "ความเข้มแข็งแห่งแว่นแคว้นเรานั้นไซร้ ตั้งมั่นอยู่บนวิถีแห่งการอภิบาลเศรษฐกิจ ที่ผ่านกาลพิสูจน์และสืบทอดแก่ราษฎรมาหลายชั่วอายุคน"
 generic_traditional_economy_CRITERIA_DESCRIPTION: "พวกเราได้น้อมรับเอาค่านิยมและระบบแห่งเศรษฐกิจ ที่มีความมั่นคงตามขนบดั้งเดิมมาใช้"
 generic_traditional_economy_BUTTON_TOOLTIP: "ด้วยการเสริมสร้างเศรษฐกิจตามขนบให้แข็งแกร่ง เราย่อมวางรากฐาน เพื่อความมั่งคั่งอันยืนยงและความบรรสานในสังคม"
 generic_traditional_economy_BUTTON_DETAILS: "$generic_traditional_economy_BUTTON_TOOLTIP$"

 mission_increase_workforce: "ขยายกำลังแรงงาน"
 mission_increase_workforce_desc: "เพื่อธำรงไว้ซึ่งเศรษฐกิจที่เติบโตและปณิธานที่รุ่งโรจน์ เราต้องมั่นใจว่ากำลังแรงงานของพวกเรานั้นทั้งไพศาลและมีปรีชาสามารถ การขยายกำลังแรงงานจะช่วยให้เราแสวงหาการพัฒนาที่กว้างไกลทั่วดินแดน"

 mission_connect_location_to_capital: "ถนนสู่ [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 mission_connect_location_to_capital_desc: "ดวงใจแห่งอาณาจักรเรานั้นจำต้องเชื่อมถึงกิ่งก้านสาขา การเน้นย้ำความพยายามในกาลปัจจุบันให้เชื่อมโยงถึงเมืองหลวง จะช่วยเสริมสร้างเอกภาพและความเข้มแข็งแก่คณะฝ่ายบริหารในท้องถิ่น ตลอดจนการจัดหาภาษีและวัตถุดิบ"
 mission_connect_location_to_capital_tip: "@arrow_bonus_tier_2! ไปยัง [capital_with_icon|e] ของท่าน [Player.GetCapital.GetName] แล้วคลิกที่ปุ่ม [road_icon] #V สร้างถนน#! \n\n@arrow_bonus_tier_1! คลิกที่ [location_with_icon|e] ที่ท่านปรารถนาจะสร้าง [road_with_icon|e]\n\n #italic หากต้องการเรียนรู้เพิ่มเติม ท่านสามารถตรวจสอบได้ที่ [Link('hints', 'selected_hint = hint_control', '@hint! $hint_control$ คำแนะนำ')]#!"
 designated_location_capital_connection_modifier_tt: "ทุก [location|e] ใน [province|e] ที่กำหนดจะได้รับผลจาก [modifier|e] [ShowModifier('capital_connection_modifier')] ซึ่งจะผันแปรตาม [proximity|e]"
 
 mission_increase_rgo_level: "ขยายการผลิตทรัพยากร"
 mission_increase_rgo_level_desc: "รากฐานแห่งสังคมที่เจริญรุ่งเรืองย่อมอยู่ที่การเข้าถึงทรัพยากรธรรมชาติ เราต้องพัฒนาโครงสร้างพื้นฐานในชนบท และยกระดับการผลิตเพื่อตอบสนองความต้องการของประชากรและเศรษฐกิจที่เติบโต"
 mission_increase_rgo_level_tip: "@arrow_bonus_tier_2! ไปยัง [location_with_icon|e] ที่ท่านเลือกไว้สำหรับภารกิจ\n\n@arrow_bonus_tier_1! คลิกที่ปุ่ม [rgo_icon] #V $game_concept_rgo$#! เพื่อขยาย [resource_gathering_operations]"

 mission_peasants_estate_satisfaction: "ความพึงพอใจของชาวชนบท"
 mission_peasants_estate_satisfaction_desc: "เหล่าชาวชนบทคือรากฐานสำคัญแห่งอาณาจักร การทำให้มั่นใจว่าพวกเขามีความพึงพอใจ ผ่านหลักอภิบาลอันชาญฉลาดจะมอบเสถียรภาพและอำนาจบัญชาที่จำเป็นต่อการพัฒนาอันยิ่งใหญ่"
 mission_peasants_estate_satisfaction_tip: "@arrow_bonus_tier_3! ไปยัง [Link('government', 'tabcontent = estates', '@government_panel! แผงการปกครอง > ฐานันดร')] เพื่อดู [estates_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! $increase_estate_satisfaction_tip$"

 mission_market_villages: "ตลาดประจำหมู่บ้าน"
 mission_market_villages_desc: "การจัดตั้งตลาดท้องถิ่นในชุมชนชนบทจะนำมาซึ่งการค้า โอกาส และการเติบโตสู่บ้านป่าเมืองดอน เพื่อหล่อหลอมแผ่นดินให้มั่งคั่งและเชื่อมถึงกันยิ่งขึ้น"
 mission_market_villages_tip: "@arrow_bonus_tier_3! ไปยัง [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองโดย @peasants![ShowPopTypeName('peasants')] [buildings] แล้วคลิกที่สิ่งปลูกสร้าง [ShowBuildingTypeName('market_village')]\n\n@arrow_bonus_tier_1! สร้างสิ่งนี้ใน [location_with_icon|e] โดยการคลิกเลือกจากรายการหรือบนแผนที่"

 mission_embrace_trad_economy: "น้อมรับเศรษฐกิจตามขนบดั้งเดิม"
 mission_embrace_trad_economy_desc: "เส้นทางเศรษฐกิจของเรามิใช่การแสวงหานวัตกรรมอันบุ่มบ่าม แต่เป็นการต่อยอดบนวิถีที่ผ่านการพิสูจน์มาแล้ว เราจักส่งเสริมเศรษฐกิจตามขนบเพื่อความมั่งคั่งที่ยั่งยืน ผ่านการสนับสนุนชุมชนชนบทและส่งเสริมการกลับคืนสู่มาตุภูมิ"
 mission_embrace_trad_economy_tip: "$change_societal_value_tip$"

 mission_prosperous_production: "การผลิตอันรุ่งเรือง"
 mission_prosperous_production_desc: "ความมั่งคั่งของแหล่งที่ตั้งถิ่นฐานในชนบทคือความสำคัญสูงสุด ในราชสำนักของเรา เพื่อให้มั่นใจในการผลิตวัตถุดิบที่สม่ำเสมอ และการตอบสนองความต้องการของราษฎรอย่างต่อเนื่อง เราจะมุ่งเพิ่มความมั่งคั่งของชุมชนที่สนับสนุนเศรษฐกิจของอาณาจักรอย่างกล้าหาญ"

 mission_fishing_villages: "สนับสนุนหมู่บ้านประมง"
 mission_fishing_villages_desc: "ท้องทะเลและสายน้ำล้วนเปี่ยมด้วยทรัพย์สินหาค่ามิได้ การมอบอำนาจแก่ชุมชนประมง จะช่วยเสริมสร้างความมั่นคงทางอาหารและเปิดเส้นทางใหม่สู่ความมั่งคั่งในชนบท"
 mission_fishing_villages_tip: "@arrow_bonus_tier_3! ไปยัง [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองโดย @peasants![ShowPopTypeName('peasants')] [buildings] แล้วคลิกที่สิ่งปลูกสร้าง [ShowBuildingTypeName('fishing_village')]\n\n@arrow_bonus_tier_1! สร้างสิ่งนี้ใน [location_with_icon|e] โดยการคลิกเลือกจากรายการหรือบนแผนที่"


 mission_cloth_makers: "สนับสนุนสิ่งทอชนบท"
 mission_cloth_makers_desc: "การผลิตสิ่งทอถือเป็นเสาหลักแห่งอุตสาหกรรมชนบท การเกื้อกูลหัตถศิลป์นี้จะทำให้ราษฎรของเรามั่งคั่งขึ้น และเสริมสร้างความแข็งแกร่งของเราทั้งในตลาดภายในและต่างประเทศ"
 mission_cloth_makers_tip: "@arrow_bonus_tier_3! ไปยัง [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองโดย @laborers![ShowPopTypeName('laborers')] [buildings] แล้วคลิกที่ [building|e] [ShowBuildingTypeName('rural_clothmaker')]\n\n@arrow_bonus_tier_1! สร้างสิ่งนี้ใน [location_with_icon|e] โดยการคลิกเลือกจากรายการหรือบนแผนที่"

 mission_irrigation: "ขยายระบบชลประทาน"
 mission_irrigation_desc: "ด้วยผืนดินที่อุดมสมบูรณ์และสายน้ำที่เชื่อใจได้ เราจักเปลี่ยนแม้พสุธาที่แห้งแล้งที่สุด ให้กลายเป็นทุ่งนาอันสมบูรณ์ การขยายระบบชลประทานจะช่วยเพิ่มผลิตผลทางการเกษตรของพวกเราอย่างมหาศาล"
 mission_irrigation_tip: "@arrow_bonus_tier_3! ไปยัง [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองโดย @peasants![ShowPopTypeName('peasants')] [buildings] แล้วคลิกที่ [building|e] [ShowBuildingTypeName('irrigation_systems')]\n\n@arrow_bonus_tier_1! สร้างสิ่งนี้ใน [location_with_icon|e] โดยการคลิกเลือกจากรายการหรือบนแผนที่"

 mission_masons: "จัดหาช่างศิลา"
 mission_masons_desc: "ศิลปะแห่งงานศิลานั้นสำคัญยิ่ง ต่อการก่อร่างสร้างนิคมและสถาบันอันยั่งยืน การจัดหาเหล่าช่างศิลาผู้ชำนาญการ ทั่วทั้งแผ่นดินจะเป็นการวางรากฐาน และจัดเตรียมวัสดุเพื่อใช้ในการสร้างประวัติศาสตร์สืบไป"
 mission_masons_tip: "@arrow_bonus_tier_3! ไปที่ [Link('production', '', '@production_panel! แผงการผลิต > สิ่งปลูกสร้าง')] เพื่อดูรายการ [buildings_with_icon|e] ของท่าน\n\n@arrow_bonus_tier_2! กรองตาม @laborers![ShowPopTypeName('laborers')] [buildings] และคลิกที่ [building|e] [ShowBuildingTypeName('mason')]\n\n@arrow_bonus_tier_1! สร้างมันใน [location_with_icon|e] โดยการคลิกจากรายการหรือบนแผนที่"

 selected_rural_proximity_and_less_90_percent_pop_tt: "[rural_location|e] ที่เลือกจะอยู่ภายในระยะ [proximity|e] จาก [capital|e] ของเรา และมี [population_capacity|e] ต่ำกว่า #Y 90%#!"
 mission_task_select_rural_settlement: "เลือก [rural_location|e] สำหรับ [mission_tasks|e] ในลำดับถัดไป"
 mission_task_no_rural_settlement: "@trigger_no! ไม่มี [rural_location|e] ที่พร้อมใช้งาน"
