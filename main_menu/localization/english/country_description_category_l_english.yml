 difficulty_level_name_1: "#G ง่ายมาก #!"
 difficulty_level_desc_1: "#T ง่ายมาก #! [country|e] แห่งนี้มีตำแหน่งเริ่มต้นที่ #G ง่ายมาก#! และขอแนะนำสำหรับ #G ผู้เริ่มเล่น#! \n\n#G ง่ายมาก#! [countries] มักจะมีขนาดที่บริหารจัดการได้ง่าย ตั้งอยู่ใน [market|e] เดียว มีเพื่อนบ้านที่อ่อนแอหรือเป็นมิตร และไม่ถูกจำกัดด้วยระบบกลไกพิเศษใด ๆ"
 difficulty_level_name_2: "#G ง่าย #!"
 difficulty_level_desc_2: "#T ง่าย #! [country|e] แห่งนี้มีตำแหน่งเริ่มต้นที่ #G ง่าย#! และขอแนะนำสำหรับ #G ผู้เริ่มเล่น#! \n\n#G ง่าย#! [countries] มักจะมีขนาดที่บริหารจัดการได้ง่าย ตั้งอยู่ใน [market|e] เดียว และมีเพื่อนบ้านที่อ่อนแอหรือเป็นมิตร"
 difficulty_level_name_3: "#l ปานกลาง #!"
 difficulty_level_desc_3: "#T ปานกลาง #! [country|e] แห่งนี้มีความยากระดับปานกลาง และขอแนะนำหากท่านคุ้นเคยกับพื้นฐานของเกมแล้ว \n\n#W ปานกลาง#! [countries] มักจะมีขนาดที่ใหญ่ขึ้น ครอบคลุมหลาย [markets|e] และเพื่อนบ้านอาจเป็น [threat|e] ที่สำคัญ จนส่งผลต่อความอยู่รอดได้ \n\n#W ปานกลาง#! [countries] อาจเข้าไปเกี่ยวข้องกับเนื้อหาพิเศษตั้งแต่ช่วงต้น เช่น [situations|e] [disasters|e] หรือ [international_organizations|e] ซึ่งอาจทำให้รูปแบบการเล่นต่างไปจากปกติ"
 difficulty_level_name_4: "#R ยาก #!"
 difficulty_level_desc_4: "#T ยาก #! [country|e] แห่งนี้เล่นได้ #R ยาก#! และควรหลีกเลี่ยงจนกว่าท่านจะเชี่ยวชาญพื้นฐานของ #italic ยูโรปา ยูนิเวอร์ซาลิส 5#! แล้ว \n\n#R ยาก#! [countries] อาจมีการจัดการภายในที่ยากลำบาก เนื่องจากมีขนาดใหญ่โต และมีความซับซ้อนในการ [administrative|e] หรือมีความล่อแหลมต่อเพื่อนบ้าน ที่แข็งแกร่งกว่าตั้งแต่ช่วงเริ่มต้น"
 difficulty_level_name_5: "#R ยากมาก #!"
 difficulty_level_desc_5: "#T ยากมาก #! [country|e] แห่งนี้เล่นได้ #R ยากมาก#! และควรหลีกเลี่ยงจนกว่าท่านจะเป็นผู้เชี่ยวชาญใน #italic ยูโรปา ยูนิเวอร์ซาลิส 5#! \n\n#R ยากมาก#! [countries] อาจมีการจัดการภายในที่ยากลำบากยิ่ง เนื่องจากมีขนาดใหญ่โต และมีความซับซ้อนในการบริหาร หรือมีความล่อแหลมอย่างยิ่งต่อเพื่อนบ้าน ที่แข็งแกร่งกว่าตั้งแต่ช่วงเริ่มต้น"