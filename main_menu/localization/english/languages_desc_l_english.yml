l_english:
 scandinavian_language_desc: "ในยุคสมัยแห่งไวกิ้ง ภาษาเนาส์โบราณได้แผ่ขยายไปทั่วสแกนดิเนเวีย และเข้าสู่พื้นที่อื่น ๆ เช่น ไอซ์แลนด์ หมู่เกาะแฟโร และบางส่วนของหมู่เกาะบริติช เมื่อเวลาผ่านไป ภาษานี้ได้วิวัฒนาการไปเป็นภาษาที่แตกต่างกัน แต่ยังคงมีความเกี่ยวข้องกันดังที่เราเห็นในปัจจุบัน ซึ่งแต่ละภาษามีเอกลักษณ์เฉพาะตัว ในขณะที่ยังคงรักษาขนบประเพณี ร่วมกันของชาวสแกนดิเนเวียเอาไว้"
 english_language_desc: "มีต้นกำเนิดมาจากภาษาถิ่นแองโกล-แซกซอน ซึ่งเหล่านักรบชาวเยอรมันผู้อพยพมา ตั้งรกรากนำเข้าสู่บริเตน ต่อมาภาษาอังกฤษได้รับอิทธิพล จากการติดต่อกับภาษานอร์ส เนื่องจากการรุกรานของไวกิ้ง นำไปสู่การเปลี่ยนแปลงครั้งใหญ่ ในด้านคำศัพท์และไวยากรณ์ ภายหลังการพิชิตโดยชาวนอร์มัน และการปกครองนานหลายศตวรรษ โดยเหล่าเจ้าศักดินาจากภาคพื้นทวีป ภาษานี้จึงได้รับอิทธิพล จากภาษาฝรั่งเศสเพิ่มเติม"
 brythonic_language_desc: "ภาษา $brythonic_language$ มีต้นกำเนิดท่ามกลางหมู่ชนเผ่าเคลต์โบราณแห่งบริเตน ก่อนที่จะแผ่ขยายข้าม $english_channel_area$ ไปพร้อมกับเหล่าผู้ลี้ภัยที่หลบหนี จากการรุกรานของแองโกล-แซกซอน"
 gaelic_language_desc: "$gaelic_language$ (หรือกอยเดลิก) เป็นตระกูลภาษาเคลต์ที่มีต้นกำเนิดในไอร์แลนด์ และได้แผ่ขยายไปยังหมู่เกาะข้างเคียงในช่วงยุคกลาง"
 south_italian_language_desc: "นี่คือชื่อเรียกกลุ่มภาษาที่ครอบคลุมพื้นที่ส่วนกลาง และส่วนใต้ของคาบสมุทรอิตาลี"
 north_italian_language_desc: "ผู้คนในพื้นที่ส่วนเหนือของคาบสมุทรอิตาลี ต่างพูดจาปราศรัยด้วยกลุ่มภาษานี้"
 occitan_language_desc: "กลุ่มภาษาอ็อกซิตาโน-โรมานซ์ มีต้นกำเนิดในตอนใต้ของฝรั่งเศส ก่อนจะกลายเป็นภาษากลางของเหล่าเมืองท่าพาณิชย์ ในแถบทะเลเมดิเตอร์เรเนียนตะวันตก"
 french_language_desc: "#italic ลองก์ดอยล์#! หรือภาษา $french_language$ เป็นกลุ่มภาษาถิ่นโรมานซ์ที่กระจัดกระจาย มีต้นกำเนิดในตอนเหนือของฝรั่งเศส"
 wendat_language_desc: "หนึ่งในสาขาหลักของกลุ่มภาษาอิโรควอย ซึ่งพูดกันตามแนวแม่น้ำเซนต์ลอว์เรนซ์ และทางตอนเหนือของทะเลสาบเกรตเลกส์"
 abenakian_language_desc: "สาขาหนึ่งของกลุ่มภาษาอัลกอนเควียนตะวันออก ซึ่งพูดกันในพื้นที่ส่วนใหญ่ของนิวอิงแลนด์ตอนเหนือ และภูมิภาคแมริไทม์ของแคนาดา"
 cree_language_desc: "การรวมกลุ่มภาษาถิ่นอัลกอนเควียนกลางอันกว้างขวาง ซึ่งพูดกันตั้งแต่เกาะนิวฟันด์แลนด์ไปจนถึงรัฐอัลเบอร์ตา"
 anishinabe_language_desc: "การรวมกลุ่มภาษาถิ่นอัลกอนเควียนกลาง ที่ใช้พูดกันทั่วทั้งภูมิภาคเกรตเลกส์และลุ่มแม่น้ำออตตาวา"
 latin_language_desc: "หนึ่งในภาษาที่มีอิทธิพลมากที่สุดในประวัติศาสตร์ของมนุษยชาติ ภาษาละตินเคยเป็นภาษาของซีซาร์ เวอร์จิล และซิเซโร แต่ก็ยังเป็นภาษาของลูเธอร์ เดส์การ์ตส์ และนิวตันด้วยเช่นกัน ภายหลังการล่มสลายของจักรวรรดิโรมันตะวันตก และการอพยพของชาวเยอรมัน ภาษาละตินได้วิวัฒนาการไปเป็นตระกูลภาษา [ShowLanguageFamilyName('romance_language_family')] อย่างไรก็ตาม #italic Roma capta ferum victorem cepit#! — โรมผู้พ่ายกลับมีชัยเหนือผู้พิชิตผู้ดุร้าย — และภาษาละตินจะยังคงดำรงอยู่ ต่อไปในฐานะภาษาประกอบศาสนพิธี วัฒนธรรม และการทูต ไปอีกหลายสหัสวรรษเบื้องหน้า"