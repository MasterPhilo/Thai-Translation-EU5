l_english:
 END_GAME_VIEW_LOSING_TITLE: "จบการเล่น"
 END_GAME_VIEW_LOSING_TEXT: "ชาติของเรามิอาจดำรงอยู่ผ่านพ้นวัฏจักรของเหตุการณ์ไปได้ ขาดซึ่งอำนาจ และความมุ่งมั่นอันแรงกล้ามากพอ เมื่อเทียบเคียงกับเหล่าเพื่อนบ้าน ในภายภาคหน้า ประชาชน [COUNTRY.GetAdjective] จักถูกจดจำไว้เพียงในพิพิธภัณฑ์ ที่ซึ่งเหล่าบัณฑิตจักทำการศึกษาความพ่ายแพ้ของเรา"
  
 END_GAME_VIEW_SURVIVING_TITLE: "ภาคผนวกเล็กน้อยในหน้าประวัติศาสตร์"
 END_GAME_VIEW_SURVIVING_TEXT: "ชาติอันน่าภาคภูมิของเรายืนหยัดผ่านศตวรรษอันดิ้นรน การทำศึก และความทุกข์ยากมาได้ ทว่าถึงกระนั้น ประชาชน [COUNTRY.GetAdjective] กลับมิอาจสร้างเกียรติยศอันเป็นที่ประจักษ์ได้มากนัก ในโลกที่เต็มไปด้วยยักษ์ใหญ่แห่งอารยธรรม และยุทธการหลาย ๆ จุดทำให้เราเป็นเพียงบทบันทึกข้างเคียงเท่านั้น"
  
 END_GAME_VIEW_GREAT_POWER_TITLE: "มหาอำนาจ"
 END_GAME_VIEW_GREAT_TEXT: "ชาติอันรุ่งโรจน์ของเราได้รับเกียรติให้เป็นหนึ่งในมหาอำนาจของโลก ขอแสดงความยินดี ประชาชน [COUNTRY.GetAdjective] เป็นหนึ่งในกลุ่มผู้มีความมั่งคั่ง และมีเกียรติภูมิที่สุดในยุคสมัยนี้ และการปกครองของเราได้รับผลตอบแทน เป็นความสำเร็จอันโดดเด่นยิ่ง"
  
 
 CONTINUE_PAST_END_DATE: "เล่นต่อไป"
 CONTINUE_PAST_END_DATE_TOOLTIP: "เล่นต่อไป\nระบบรางวัลความสำเร็จจะถูกปิดใช้งานหลังจากนี้"
 END_GAME_VIEW_QUIT_TOOLTIP: "จบการเล่น และกลับสู่เมนูหลัก"
 END_GAME_VIEW_OBSERVE: "เฝ้าสังเกตการณ์"
 END_GAME_VIEW_OBSERVE_TOOLTIP: "เล่นต่อไปในโหมดผู้สังเกตการณ์"
