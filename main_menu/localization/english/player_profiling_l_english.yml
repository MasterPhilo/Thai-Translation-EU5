 #FLAVOUR TEXTS

 #Scenario Descriptions

 #Economy
 HUN_scenario_desc: "ด้วยเหล่าขุนนางผู้ไม่ลงรอยถูกกำราบด้วยหัตถ์เหล็ก โดยพระเจ้าชาร์ลส์แห่งอ็องฌู #W ฮังการี#! จึงกลับกลายเป็นราชอาณาจักร ที่ประชากรอันหลากหลายสามารถทำนุบำรุงที่ดิน และใช้ประโยชน์จากแร่ธาตุอันมั่งคั่งได้อีกครั้ง ฐานภาษีอันมหาศาลนี้เอื้อต่อการขยายตัวอย่างรวดเร็ว ของอุตสาหกรรม และงานฝีมือ ในขณะที่ปราการธรรมชาติ อย่างเทือกเขาคาร์เพเทียน และสถานะทางการทูตอันเป็นมิตร กับเพื่อนบ้านส่วนใหญ่ ช่วยส่งเสริมสันติภาพ และความมั่งคั่ง"
 HOL_scenario_desc: "เคาน์ตีแห่ง #W ฮอลแลนด์#! ปกครองโดยเคานต์วิลเลียมแห่งอาแวนส์ ผู้ซึ่งปกครองเคาน์ตีเซลันด์ และแอโนด้วย แม้จะมีเขตแดนอันหลากหลาย แต่ทำเลของฮอลแลนด์บนชายฝั่งทะเลเหนือ ซึ่งอยู่กึ่งกลางระหว่างช่องแคบอังกฤษ และทะเลบอลติก ทำให้ที่นี่เป็นพื้นที่สำคัญสำหรับการแลกเปลี่ยนทางเศรษฐกิจ และการพัฒนาอุตสาหกรรมที่แข็งแกร่ง หากใช้ประโยชน์จากโอกาสเหล่านี้ ฮอลแลนด์อาจกลายเป็นมหาอำนาจทางเศรษฐกิจในอนาคตอันใกล้"

 #Politics
 NOR_scenario_desc: "ด้วยการเป็นรัฐร่วมประมุขกับสวีเดน ราชอาณาจักร #W นอร์เวย์#! กำลังเผชิญกับช่วงเวลาใหม่ที่ท้าทาย ตามแนวฟยอร์ดและหุบเขา ทรัพยากรระดับชาติอันมหาศาล โดยเฉพาะไม้ซุงและการประมง อาจช่วยให้ประชากรสร้างความมั่งคั่งแก่ตนเองได้ และด้วยสถานะที่รุ่งเรืองและพึงพอใจ การทูตที่เข้มข้นยิ่งขึ้นกับเพื่อนบ้านในสแกนดิเนเวีย และทะเลเหนืออาจได้รับการส่งเสริม ซึ่งจะช่วยให้นอร์เวย์กลับมารุ่งเรืองอีกครั้ง"
 NAP_scenario_desc: "ถือกำเนิดจากความทะเยอทะยานของราชวงศ์อันทรงอำนาจ ที่มุ่งหมายจะครอบครองดินแดนทางตอนใต้ของอิตาลี บัดนี้ #W เนเปิลส์#! ปกครองโดยพระเจ้าโรเบิร์ตแห่งอ็องฌู เจ้าแผ่นดินผู้ทรงธรรมและปรีชาญาณ ทรงเป็นที่รู้จักในด้านพระสติปัญญา และการตัดสินพระทัยอันเฉียบแหลม ประชากรที่จำนวนมาก และกำลังเติบโต เป็นรากฐานอันมั่นคงสำหรับการขยายตัวภายในอย่างรวดเร็ว โดยอาศัยความมั่งคั่งทางเกษตรกรรม ซึ่งอาจสนับสนุนความพยายามของพระเจ้าโรเบิร์ต ในการทำให้เนเปิลส์เป็นมุขยอธิราชแห่งอิตาลี"

 #Military
 TUR_scenario_desc: "#W ออตโตมัน#! กำลังเสริมสร้างสถานะของตนในฐานะหนึ่งใน #italic เบย์ลิก#! หรือผู้นำทัพชาวเติร์กที่ทรงอำนาจที่สุด ซึ่งกำลังรุ่งโรจน์ และปรารถนาจะยึดครองดินแดนสำคัญ ตามชายฝั่งบอสฟอรัส และพื้นที่สูงในอานาโตเลีย เมื่อเร็ว ๆ นี้มีการพิชิตดินแดนตามแนวชายแดนติดกับไบแซนติอุม ซึ่งถือเป็นศัตรูหลักที่ฝ่ายตะวันตกต้องเอาชนะ การครองความเป็นใหญ่เหนือ #italic เบย์ลิก#! เพื่อนบ้าน จะช่วยเพิ่มทรัพยากรที่จำเป็นสำหรับชัยชนะ ในภายภาคหน้าได้อย่างมาก"
 CAS_scenario_desc: "พระเจ้าอัลฟอนโซที่ 11 'ผู้ล้างแค้น' ปกครอง #W กัสติยา#! โดยไร้ซึ่งแรงต้านทานภายในมากนัก หลังจากสถาปนาอำนาจเหนือเหล่าขุนนางในราชอาณาจักร บัดนี้พระองค์สามารถหันความสนใจไปทางทิศใต้ ที่ซึ่งรัฐเอมิเรตแห่งกรานาดายังคงอยู่ ในฐานะปราการด่านสุดท้ายของอิสลามในไอบีเรีย พันธมิตรผู้ทรงพลังของพระองค์อย่างรัฐสุลต่านโมร็อกโก ยังคงรักษาตำแหน่งทางยุทธศาสตร์บนคาบสมุทร โดยมีศูนย์กลางอยู่ที่อัลเฆซีรัส และรอนดา ทำให้สามารถเข้าแทรกแซง จากอีกฟากของช่องแคบยิบรอลตาร์ได้"

 #Deprecated
 ARA_scenario_desc: "ราชบัลลังก์อารากอนยืนหยัดอย่างภาคภูมิ ในฐานะมหาอำนาจสำคัญในภูมิภาคเมดิเตอร์เรเนียนตะวันตก ด้วยอิทธิพลทางทะเล บารมีทางการทูต และเครือข่ายการค้าที่เจริญรุ่งเรือง พร้อมสำหรับการขยายดินแดนต่อไป"
 FLA_scenario_desc: "ในฐานะหนึ่งในประเทศที่มั่งคั่งที่สุดในกลุ่มประเทศที่ราบลุ่ม ด้วยศูนย์กลางการค้าอันมั่งคั่งแห่งบรูช ฟลานเดอร์สอยู่ในตำแหน่งที่ดี ในการดำเนินนโยบายการทูตอันซับซ้อน โดยได้รับประโยชน์จากสถานะการเป็นตัวกลาง"
 VEN_scenario_desc: "สาธารณรัฐเวนิสอันประเสริฐยิ่ง เป็นสาธารณรัฐพ่อค้าที่สำคัญ และทรงอำนาจที่สุดในทะเลเมดิเตอร์เรเนียน และควบคุมท่าเรือพาณิชย์รวมถึงเกาะสำคัญต่าง ๆ ไว้ทั่วทั้งน่านน้ำ"
 FRA_scenario_desc: "การเถลิงราชย์ของพระเจ้าฟิลิปที่ 6 ถูกคัดค้านโดยพระเจ้าเอ็ดเวิร์ดที่ 3 แห่งอังกฤษ และบัดนี้พระองค์ต้องรับมือกับภัยคุกคามภายนอกจากอังกฤษ และเหล่าเจ้าขุนนางฝรั่งเศสผู้ทระนงไปพร้อม ๆ กัน ซึ่งถือเป็นภัยคุกคามต่อการคงอยู่ของฝรั่งเศส"