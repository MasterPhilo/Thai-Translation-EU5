 PLAYER_PROFILING_WELCOME_HEADER: "ยินดีต้อนรับสู่ #italic ยูโรปา ยูนิเวอร์ซาลิส 5#!!"
 PLAYER_PROFILING_WELCOME: "#italic ยูโรปา ยูนิเวอร์ซาลิส 5#! คือเกมแนววางแผนการรบระดับมหภาคที่ลงลึกในประวัติศาสตร์ ว่าด้วยชะตากรรมของนานาชาติในช่วงยุคกลางตอนปลาย และยุคสมัยใหม่ตอนต้น ในขณะที่พวกเขาแก่งแย่งชิงอำนาจระดับโลกผ่านทางสงคราม การทูต การตั้งนิคม และการเปลี่ยนแปลงทางสังคมและเศรษฐกิจ\n\nหากท่านเป็นมือใหม่สำหรับ #italic ยูโรปา ยูนิเวอร์ซาลิส#! และกลไกของเกม เราขอแนะนำให้เลือกหนึ่งใน #W $PLAYER_PROFILING_BT$#! \n\nหรือหากท่านเป็นประมุขระดับโลกผู้มากประสบการณ์อยู่แล้ว และต้องการข้ามการสอนเล่น ให้คลิกตัวเลือก #W $PLAYER_PROFILING_START_NEW_GAME_BT$#!"
