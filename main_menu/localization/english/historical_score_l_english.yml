l_english:
 ENDGAME_GREATEST_RULERS: "มหาราชผู้ปกครองในหน้าประวัติศาสตร์"
 
 hs_mansa_musa: "มันซา มูซา แห่งมาลี"
 hs_mansa_musa_desc: "มันซา มูซา ผู้ปกครองในตำนานแห่งมาลี เป็นที่เลื่องลือในด้านความมั่งคั่ง อันมหาศาลและความโอบอ้อมอารี การแสวงบุญ ณ นครเมกะของเขาในปี ค.ศ. 1324 ไม่เพียงแต่เป็นการสำแดง ความยิ่งใหญ่ของอาณาจักร แต่ยังขจรขจายชื่อเสียงของมาลี และส่งเสริมการค้าและทางวิชาการไปทั่วโลกอิสลาม"
 
 hs_peter_the_great: "ปีเตอร์ 'มหาราช' แห่งรัสเซีย"
 hs_peter_the_great_desc: "ปีเตอร์ 'มหาราช' ซาร์ผู้มีวิสัยทัศน์แห่งรัสเซีย ได้พลิกโฉมชาติของตน ให้กลายเป็นมหาอำนาจแห่งยุโรปที่น่าเกรงขาม ด้วยการปฏิรูปขนานใหญ่ การขยายอำนาจทางการทหาร และการสร้างนครเซนต์ปีเตอร์สเบิร์ก พระองค์ได้ทำให้รัสเซียทันสมัย และทิ้งมรดกแห่งความทะเยอทะยานเยี่ยงจักรวรรดิ และอิทธิพลตะวันตกไว้สืบไป"
 
 hs_enrique_de_impotent: "เอนริเกที่ 4 แห่งกัสติยา"
 hs_enrique_de_impotent_desc: "เอนริเกที่ 4 แห่งกัสติยา ผู้ได้รับฉายาว่า 'ผู้หย่อนความสามารถ' ต้องดิ้นรนเพื่อสำแดงอำนาจ ท่ามกลางความระส่ำระสายในหมู่ผู้สูงศักดิ์ และข้อสงสัยในความชอบธรรม รัชสมัยของพระองค์เต็มไปด้วยความขัดแย้งภายใน และการชิงดีชิงเด่นทางการเมือง ซึ่งเป็นการปูทางไปสู่การก้าวขึ้นสู่อำนาจของกษัตริย์คาทอลิก"
 
 hs_jan_sobieski: "ยัน โซบีแยสกี แห่งโปแลนด์"
 hs_jan_sobieski_desc: "ยัน โซบีแยสกี ราชสีห์แห่งเลค เป็นผู้นำทางการทหารผู้ปราดเปรื่อง และเจ้าแผ่นดินแห่งโปแลนด์ผู้ปกป้องยุโรป จากการขยายอำนาจของออตโตมัน ชัยชนะอย่างเด็ดขาดในยุทธการแห่งเวียนนาปี ค.ศ. 1683 ได้ตอกย้ำมรดกของพระองค์ ในฐานะผู้พิทักษ์คริสต์จักร และวีรบุรุษแห่งเครือจักรภพโปแลนด์-ลิทัวเนีย"
 
 hs_napoleon: "นโปเลียนที่ 1 แห่งฝรั่งเศส"
 hs_napoleon_desc: "นโปเลียน โบนาปาร์ต ยอดนักยุทธวิธีและจักรพรรดิแห่งฝรั่งเศส ได้ปรับเปลี่ยนโฉมหน้าของยุโรป ผ่านอัจฉริยภาพทางการทหาร และการปฏิรูปขนานใหญ่ ความทะเยอทะยานและการพิชิตของพระองค์ ได้แพร่กระจายอุดมการณ์แห่งการปฏิวัติ ไปทั่วทั้งทวีป ทว่าการล่มสลายของพระองค์คือจุดจบของยุคสมัย และการฟื้นฟูเหล่าเจ้าแผ่นดิน"
 
 hs_charles: "ชาร์ลส์ที่ 5 แห่งจักรวรรดิโรมันอันศักดิ์สิทธิ์"
 hs_charles_desc: "ชาร์ลส์ที่ 5 ผู้ปกครองจักรวรรดิอันกว้างใหญ่ที่ดวงอาทิตย์ไม่เคยตกดิน ทรงมุ่งหมายจะรวมคริสต์จักรให้เป็นหนึ่งเดียว ภายใต้การปกครองของพระองค์ การต่อสู้กับนิกายโปรเตสแตนต์ ออตโตมัน และขุมอำนาจคู่แข่งได้นิยามรัชสมัยของพระองค์ ทิ้งมรดกทั้งในด้านความยิ่งใหญ่ และความท้าทายในการปกครองจักรวรรดิที่แตกแยก"
 
 hs_fredrik_the_great: "เฟรเดอริก 'มหาราช' แห่งปรัสเซีย"
 hs_fredrik_the_great_desc: "เฟรเดอริก 'มหาราช' กษัตริย์ผู้รู้แจ้งแห่งปรัสเซีย ได้พลิกโฉมชาติของตน ให้กลายเป็นขุมอำนาจแห่งยุโรป ผ่านความปราดเปรื่องทางการทหาร และการปฏิรูปการบริหาร ชัยชนะในสงครามเจ็ดปี การอุปถัมภ์ศิลปวิทยาการ ทำให้พระองค์มีชื่อเสียงสืบมาในฐานะทั้งผู้พิชิต และนักปรัชญา"
 
 hs_gustavus_adolphus: "กุสตาวัส อะดอล์ฟัส แห่งสวีเดน"
 hs_gustavus_adolphus_desc: "กุสตาวัส อะดอล์ฟัส ราชสีห์แห่งแดนเหนือ ได้ปฏิวัติการทำสงคราม และสร้างฐานะมหาอำนาจ ให้แก่สวีเดนในช่วงสงครามสามสิบปี ยุทธวิธีทางการทหารที่ล้ำสมัย และการนำทัพในสนามรบ ได้ทิ้งมรดกอันยั่งยืนในฐานะหนึ่งในแม่ทัพบก ผู้ยิ่งใหญ่ที่สุดในประวัติศาสตร์"
 
 hs_aurangzeb: "ออรังเซบ แห่งจักรวรรดิโมกุล"
 hs_aurangzeb_desc: "ออรังเซบ จักรพรรดิโมกุลผู้ยิ่งใหญ่พระองค์สุดท้าย ทรงขยายอาณาจักรให้กว้างไกลที่สุด ทางดินแดนผ่านการทำศึกอย่างไม่ลดละ ทว่าการยึดมั่นในหลักธรรมอิสลามอย่างเคร่งครัด และการจัดเก็บภาษีอย่างหนัก กลับสร้างความแตกแยกที่ทำให้จักรวรรดิอ่อนแอ และเป็นลางบอกเหตุถึงความเสื่อมถอย"
 
 hs_elizabeth_i: "เอลิซาเบธที่ 1 แห่งอังกฤษ"
 hs_elizabeth_i_desc: "เอลิซาเบธที่ 1 ราชินีพรหมจรรย์ ทรงสร้างความเข้มแข็งให้อำนาจของอังกฤษ ผ่านความเฉลียวฉลาดทางการเมือง ชัยชนะทางนาวีอย่างการปราบกองเรืออาร์มาดาของสเปน และความรุ่งเรืองทางวัฒนธรรมในยุคเรเนสซองส์ของอังกฤษ รัชสมัยของพระองค์ถือเป็นการก้าวขึ้นมาเป็นมหาอำนาจโลก และยุคสมัยแห่งเสถียรภาพ และความมั่งคั่งที่ไม่มีใครเทียบได้"
 
 hs_tamerlane: "ตีมูร์ แห่งจักรวรรดิตีมูริด"
 hs_tamerlane_desc: "ตีมูร์ ผู้พิชิตผู้น่าสะพรึงกลัวแห่งเอเชียกลาง ได้สร้างจักรวรรดิอันกว้างใหญ่ ผ่านการทำศึกทางการทหารอย่างไม่หยุดยั้ง และอัจฉริยภาพทางยุทธวิธีที่ไร้ผู้ต้าน แม้รัชสมัยของพระองค์จะเต็มไปด้วยการทำลายล้าง แต่พระองค์ก็ทรงอุปถัมภ์ศิลปะ สถาปัตยกรรม ทิ้งมรดกที่มีทั้งความพินาศ และความรุ่งเรืองทางวัฒนธรรม"
 
 hs_tokugawa: "โทกูงาวะ อิเอยาซุ แห่งญี่ปุ่น"
 hs_tokugawa_desc: "โทกูงาวะ อิเอยาซุ ผู้รวมเป็นหนึ่งผู้ชาญฉลาดแห่งญี่ปุ่น ได้สถาปนาโชกุนโทกูงาวะ นำพาสันติภาพ และเสถียรภาพอันยั่งยืนมาสู่แผ่นดิน หลังจากความขัดแย้งนานนับศตวรรษ นโยบายการรวมศูนย์อำนาจ และการปิดประเทศของพระองค์ ได้กำหนดโชคชะตาของญี่ปุ่นไปอีกกว่าสองศตวรรษ"
 
 hs_suleyman: "สุไลมานที่ 1 แห่งจักรวรรดิออตโตมัน"
 hs_suleyman_desc: "สุไลมานที่ 1 ผู้เกรียงไกร ทรงนำจักรวรรดิออตโตมันไปสู่จุดสูงสุด โดยผสมผสานการพิชิตทางการทหาร เข้ากับความปราดเปรื่องด้านการบริหาร และการอุปถัมภ์ทางวัฒนธรรม รัชสมัยของพระองค์ถือเป็นยุคแห่งการขยายดินแดนที่ไร้ผู้เทียบ การปฏิรูปกฎหมาย และความสำเร็จทางศิลปะ"
 
 hs_pius_v: "ปีอุสที่ 5 แห่งรัฐสันตะปาปา"
 hs_pius_v_desc: "ปีอุสที่ 5 สันตะปาปานักปฏิรูปผู้เคร่งครัด เป็นแรงขับเคลื่อนสำคัญเบื้องหลังการต่อต้านการปฏิรูปศาสนา โดยการบังคับใช้กฤษฎีกาแห่งสภาเมืองเทรนต์ พระองค์เป็นที่รู้จักจากการปัพพาชนียกรรมเอลิซาเบธที่ 1 และการรวบรวมสันนิบาตศักดิ์สิทธิ์ที่เลปันโต รัชสมัยของพระองค์ได้ตอกย้ำจุดยืนของศาสนจักร ต่อนิกายโปรเตสแตนต์ และการขยายตัวของออตโตมัน"
 
 hs_willem_of_orange: "วิลเลิม แห่ง ออเรนจ์"
 hs_willem_of_orange_desc: "วิลเลิม แห่ง ออเรนจ์ บิดาแห่งสาธารณรัฐดัตช์ เป็นผู้นำการต่อสู้เพื่ออิสรภาพ จากการปกครองของสเปนในช่วงสงครามแปดสิบปี ความเป็นผู้นำและวิสัยทัศน์ของเขาได้วางรากฐาน สำหรับยุคทองของดัตช์ และการก้าวขึ้นมาของเนเธอร์แลนด์ที่เป็นอิสระ และรุ่งเรือง"
 
 hs_pachacuti: "ปาชากูตี แห่งอินคา"
 hs_pachacuti_desc: "ปาชากูตี ซาปา อินคา ผู้มีวิสัยทัศน์ ได้พลิกโฉมราชอาณาจักรคุซโก ให้กลายเป็นจักรวรรดิอินคา อันกว้างใหญ่ผ่านการพิชิต การปกครอง พระองค์มีชื่อเสียงจากการคิดค้นนวัตกรรมการบริหาร และสถาปัตยกรรมอันยิ่งใหญ่ เช่น มาชูปิกชู รัชสมัยของพระองค์ถือเป็นยุคทองของอารยธรรมอินคา"
 
 hs_hiawatha: "ไฮอาวาธา แห่งโฮเดโนโซนี"
 hs_hiawatha_desc: "ไฮอาวาธา ผู้นำและทูตในตำนาน ได้รับการยกย่องจากการรวมชนเผ่าโฮเดโนโซนี ให้เข้าเป็นหนึ่งเดียวในสันนิบาตสันติภาพอันยิ่งใหญ่ วิสัยทัศน์ด้านความเป็นเอกภาพ และการปกครองของเขา ได้สร้างสมาพันธรัฐอันทรงพลัง ที่เจริญรุ่งเรืองด้วยความร่วมมือ และจุดแข็งที่มั่นคงร่วมกัน"
 
 hs_charles_the_bold: "ชาร์ลส์ผู้กล้าหาญ แห่งบูร์กอญ"
 hs_charles_the_bold_desc: "ชาร์ลส์ผู้กล้าหาญ ดยุกแห่งบูร์กอญ มุ่งหมายจะสร้างอาณาจักรที่ทรงอำนาจ ระหว่างฝรั่งเศสและจักรวรรดิโรมันอันศักดิ์สิทธิ์ ด้วยความทะเยอทะยานและสงคราม มรณกรรมก่อนวัยอันควรของเขา ที่น็องซีได้ยุติความฝัน และถือเป็นจุดสิ้นสุดของบูร์กอญ ในฐานะมหาอำนาจของยุโรป"
 
 tag_montezuma: "มอกเตซูมาที่ 2 แห่งแอซเท็ก"
 tag_montezuma_desc: "มอกเตซูมาที่ 2 จักรพรรดิผู้ยิ่งใหญ่พระองค์สุดท้ายแห่งจักรวรรดิแอซเท็ก ทรงปกครองในช่วงที่รุ่งเรืองที่สุด และการล่มสลายอันน่าเศร้า รัชสมัยของพระองค์สิ้นสุดลงพร้อมกับการมาถึงของชาวสเปน เมื่อความแตกแยกภายในและกองกำลังของเอร์นัน กอร์เตส ได้ทำให้จักรวรรดิอันเกรียงไกรต้องคุกเข่าลง"
 
 hs_christian_ii: "คริสเตียนที่ 2 แห่งเดนมาร์ก"
 hs_christian_ii_desc: "คริสเตียนที่ 2 แห่งเดนมาร์ก ผู้ได้รับฉายาว่า 'ทรราช' ทรงมุ่งมั่นที่จะเสริมสร้างพระราชอำนาจ และรวมสแกนดิเนเวียเป็นหนึ่งเดียวภายใต้สหภาพคาลมาร์ นโยบายที่อื้อฉาวของพระองค์และเหตุการณ์ การสังหารหมู่ที่สตอกโฮล์มทำให้เหล่าบริวารใต้อาณัติเหินห่าง นำไปสู่การถูกถอดถอน และถูกเนรเทศในที่สุด"
 
 hs_may_stuart: "แมรี แห่งสกอตแลนด์"
 hs_may_stuart_desc: "แมรี ราชินีแห่งชาวสกอต เจ้าแผ่นดินผู้เปี่ยมด้วยสิริโฉม และโศกนาฏกรรม ต้องดิ้นรนเพื่อรักษาอำนาจ ท่ามกลางความวุ่นวายทางการเมือง และความขัดแย้งทางความเชื่อ รัชสมัยที่ปั่นป่วน การลี้ภัยของพระองค์จบลงด้วยการถูกประหารชีวิต ทิ้งมรดกที่ผูกพันอยู่กับการชิงดีชิงเด่น และโชคชะตาของสกอตแลนด์"