 lesson_basics_wrap_up_3: "@caesar! แผงสรุปรายการ"
 lesson_basics_wrap_up_3b: "@caesar! แผงสรุปรายการ"
 lesson_basics_wrap_up_3_desc: "ก่อนที่พวกเราจักสิ้นสุดลง ให้เรามาดูองค์ประกอบ ส่วนติดต่อผู้ใช้เพิ่มเติมอีกสองสามอย่างที่ท่านจำต้องทราบ เริ่มด้วย #high แผงสรุปรายการ#!\n\nแผงสรุปรายการจักให้ภาพรวมความเป็นไปใน [country] ของท่าน ตัวอย่างเช่น ท่านสามารถเห็น [road_with_icon|e] ที่ท่านเพิ่งสร้างขึ้น ภายใต้กลุ่ม [construction_with_icon|e]\n\nเนื้อหาในแผงสรุปรายการสามารถปรับแต่งได้ตามประสงค์ เช่นเดียวกับ #high กลุ่มควบคุม#! ท่านสามารถปักหมุดสิ่งต่าง ๆ ลงในแผงสรุปรายการได้หลากหลาย อาทิ [countries_with_icon|e], [markets_with_icon|e] หรือ [armies_with_icon|e]\n\nในการนี้ ท่านสามารถใช้ #high เมนูบริบท#! ซึ่งเข้าถึงได้โดยการ @rightclick!#high คลิกขวา#! บน [location_with_icon|e] หรือ $game_concept_country$ บนแผนที่\n\n@rightclick!คลิกขวาที่ใดก็ได้บนแผนที่ แล้วมองหาไอคอน @pin_icon!"
 lesson_basics_add_outliner: "ปักหมุด $game_concept_country$ หรือ $game_concept_location$ ลงใน #high แผงสรุปรายการ#!"
 lesson_basics_open_contextmenu: "เปิดเมนูบริบท"

 lesson_basics_wrap_up_4: "@automation! ระบบอัตโนมัติ"
 lesson_basics_wrap_up_4_desc: "ทำได้ดีมาก! ท่านจะสามารถเข้าถึงทุกสิ่งที่ท่านปักหมุดไว้ ทางด้านขวาของหน้าจอ\n\nเราเกือบจะถึงตอนจบของบทนำนี้แล้ว เราได้ตั้งค่า ระบบอัตโนมัติในบางกลไก เพื่อช่วยให้ท่านมุ่งเน้นที่การเรียนรู้พื้นฐาน แต่ท่านสามารถควบคุมได้ทุกเมื่อว่า จักให้สิ่งใดทำงานโดยอัตโนมัติผ่าน @automation! [Link('automation', '', 'หน้าต่างระบบอัตโนมัติ')]"
 lesson_basics_open_automation_view: "เปิดแผงระบบอัตโนมัติ (ที่เน้นไว้)"

 lesson_basics_wrap_up_4b: "@automation! ระบบอัตโนมัติ"
 lesson_basics_wrap_up_4b_desc: "จากแผงนี้ ท่านสามารถควบคุมแง่มุมต่าง ๆ ของ [country_with_icon|e] ที่ท่านจักให้เกมจัดการแทนท่าน เราขอแนะนำให้ท่าน ลองส่องดูตัวเลือกที่มีอยู่ และค่อยกลับมาที่แผงนี้ในภายหลัง เมื่อท่านมีแนวคิดที่ชัดเจนขึ้นว่าสิ่งใด ที่ต้องการควบคุมด้วยตนเอง\n\nตัวอย่างเช่น ท่านสามารถตัดสินใจได้ว่าต้องการให้ [advances_with_icon|e] และ [cabinet_with_icon|e] ของท่านทำงานโดยอัตโนมัติ หรือจะจัดการด้วยตนเอง\n\nท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับกลไกเหล่านั้น ได้ในคำแนะนำประกอบที่เกี่ยวข้อง หากท่านตัดสินใจที่จะจัดการด้วยตนเอง:\n\n$TAB$[Link('hints', 'selected_hint = hint_can_do_more_research', '@hint! คำแนะนำเกี่ยวกับความก้าวหน้า')]\n$TAB$[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! คำแนะนำเกี่ยวกับที่ปรึกษา')]"

 lesson_basics_wrap_up_5: "@caesar! การแจ้งเตือน"
 lesson_basics_wrap_up_3b_desc: "อีกหนึ่งองค์ประกอบสำคัญที่ท่านจักได้ใช้งาน ในระหว่างการรณรงค์คือ #high การแจ้งเตือน#! ซึ่งจะปรากฏอยู่ใต้ #high แถบด้านบน#! และจะแจ้งให้ท่านทราบถึงเรื่องต่าง ๆ ที่จำต้องได้รับความสนใจ โดยเรียงตามลำดับความเร่งด่วน ตั้งแต่เร่งด่วนที่สุด (#R สีแดง#!) ไปจนถึงเร่งด่วนน้อยที่สุด (#G สีเขียว#!)\n\nโปรดทราบว่าท่านจะไม่ได้รับการแจ้งเตือน ในส่วนของเกมที่ท่านได้ @automation! #high ตั้งค่าอัตโนมัติ#! ไว้\n\n@hint! การแจ้งเตือนส่วนใหญ่มีคำแนะนำประกอบที่เกี่ยวข้อง เพื่อช่วยในการจัดการ ท่านสามารถ #high Shift+คลิก#! ที่การแจ้งเตือนเพื่อเปิดคำแนะนำประกอบที่สอดคล้องกัน"

 lesson_basics_wrap_up_6: "@caesar! วาระ"
 lesson_basics_wrap_up_6_desc: "ท้ายที่สุดนี้ เราขอแนะนำให้ท่านพิจารณา @agenda! #high วาระ#! เมื่อเริ่มต้นเกมทุกครา ซึ่งท่านจะพบกับบริบททางประวัติศาสตร์ ของ [country_with_icon|e] และการรวบรวม @hint! #high คำแนะนำประกอบ#! ที่เกี่ยวข้องที่สุดกับสถานการณ์ปัจจุบันของท่าน"
 lesson_basics_open_agenda: "เปิดวาระ"

 lesson_basics_final: "[mission_icon] สู่ภารกิจ!"
 lesson_basics_final_desc: "ยามนี้พวกเรามาถึงตอนจบของ #W บทสอนเล่นพื้นฐาน#! แล้ว ท่านสามารถดำเนินการต่อได้ โดยการเลือกเข้าสู่บทสอนเล่นเฉพาะทางตามที่ท่านปรารถนา\n\nตามที่ท่านเลือก ท่านจะได้รับคำอธิบายสั้น ๆ ที่จะช่วยขยายพูนความรู้ในส่วนนั้นของประสบการณ์การเล่น หลังจากนั้นท่านจะพบกับเส้นทาง [missions_with_icon|e] ต่าง ๆ ซึ่งจะมอบเป้าหมายและรางวัลที่แตกต่างกันเพื่อนำทางท่านในก้าวแรกแห่ง @caesar!#W ยูโรปา ยูนิเวอร์ซาลิส 5#!\n\nขอให้โชคดี และขอให้ชาติของท่านจงเจริญรุ่งเรือง ผ่านพ้นกระแสธารแห่งกาลเวลา!"
 lesson_basics_mission_focus: "เลือกจุดเน้นของภารกิจ"


 ############ POLITICS ############

 lesson_diplomacy_0: "@diplomacy! บทสอนเล่นการเมือง"
 lesson_diplomacy_0b: "@diplomacy! บทสอนเล่นการเมือง"
 lesson_diplomacy_0_desc: "พวกเรากำลังเริ่มต้นบทสอนเล่นการเมือง ณ บัดนี้ เราจะเจาะลึกลงไปในความซับซ้อนของสังคม รัฐบาล และนโยบายต่างประเทศของท่าน\n\nให้เราเริ่มด้วยรากฐานของประเทศใด ๆ นั่นคือ [population_with_icon|e]\n\nพวกเราได้เห็นภาพรวมของ [pops] ที่อาศัยอยู่ใน [capital_with_icon|e] ของท่านไปบ้างแล้วในช่วงบทนำ ยามนี้เราจะดำดิ่งลงสู่ [Link('country_culture', '', '@society_panel! แผงสังคม')]"
 lesson_diplomacy_open_society: "เปิดแผงสังคม"
 lesson_diplomacy_open_pops: "เปิดแถบประชากร"
 lesson_diplomacy_1: "@society_panel! สังคม"
 lesson_diplomacy_1_desc: "ในแผงนี้ ท่านสามารถดูและเข้าถึงแง่มุมต่าง ๆ ที่เน้นประชากรของ [country_with_icon|e] รายการ [population_with_icon|e] ใน #high แถบด้านบน#! แสดงให้เห็นว่ามีประชากรอาศัยอยู่ใน [country] ของท่านจำนวนเท่าใด รวมถึงความผันแปรของค่านั้นในแต่ละเดือน\n\nประชากรของท่านถูกแบ่งออกเป็น [pops_with_icon|e] ซึ่งคือกลุ่มคนที่มี [culture_with_icon|e], [religion_with_icon|e] และ [pop_type_with_icon|e] เดียวกันที่อาศัยอยู่ใน [location_with_icon|e] เดียวกัน\n\nดังที่เราได้เห็นไปแล้ว ประชากรแต่ละประเภท จะสนับสนุน [estate_with_icon|e] เฉพาะกลุ่ม ยิ่งไปกว่านั้น [pops] ยังมีระดับ [literacy_with_icon|e], ระดับ [pop_satisfaction_with_icon|e] รวมถึงความต้องการ [food_with_icon|e] และ [pop_needs_with_icon|e] ที่พวกเขาจะเรียกร้องจาก [market_with_icon|e] ของตน\n\nความพึงพอใจของประชากรขึ้นอยู่กับปัจจัยต่าง ๆ เช่น [culture] และ [religion] ของพวกเขาได้รับการยอมรับเพียงใดภายในประเทศของท่าน และยังขึ้นอยู่กับ [estate_satisfaction_with_icon|e] ของเหล่า [estates] ที่เกี่ยวข้อง เมื่อความพึงพอใจของ [pop] ต่ำเกินไป พวกเขาจะหันไปสนับสนุน [rebellion_with_icon|e]\n\n@hint! เรียนรู้เพิ่มเติมเกี่ยวกับ [rebels] ใน [Link('hints', 'selected_hint = hint_rebels_growing', 'คำแนะนำเกี่ยวกับกบฏ')]" 

 lesson_diplomacy_2: "@culture! $game_concept_culture$"
 lesson_diplomacy_2_desc: "พวกเราได้กล่าวไปแล้วว่าทุก [pop_with_icon|e] สังกัดอยู่กับ [culture_with_icon|e] เฉพาะ ให้เราไปตรวจสอบที่ [Link('country_culture', '', '@society_panel! แถบวัฒนธรรม')]"
 lesson_diplomacy_open_culture: "เปิดแถบวัฒนธรรม"
 lesson_diplomacy_3: "@culture! $game_concept_culture$"
 lesson_diplomacy_3_desc: "โดยปกติแล้ว [country_with_icon|e] ของท่านจะเป็นที่พำนักของหลากหลาย [cultures_with_icon|e] ทุก [country] มี [primary_culture_with_icon|e] โดยที่ $game_concept_cultures$ อื่น ๆ ทั้งหมดจะมี [cultural_status|e] ที่แตกต่างกันออกไป\n\n[pops_with_icon|e] ที่สังกัดอยู่ใน [culture] ที่มี [cultural_status] ต่ำ โดยทั่วไปจะมี [pop_satisfaction_with_icon|e] ที่ต่ำกว่ามาก และจะมอบ [levies_with_icon|e] ให้แก่ท่านน้อยลง ท่านสามารถเพิ่ม [cultural_status] ของ [cultures] ภายในอาณาจักรของท่านได้โดยการจัดสรร [cultural_capacity_with_icon|e]\n\nท้ายที่สุด [pops] ใน [country] ของท่านจะ [assimilate_with_icon|e] เข้าสู่ [primary_culture] ของท่านโดยขึ้นอยู่กับปัจจัยต่าง ๆ ซึ่งสิ่งที่สำคัญที่สุดคือส่วนต่างระหว่าง [cultural_influence_with_icon|e] ของ [primary_culture] ของท่าน และ [cultural_tradition_with_icon|e] ของวัฒนธรรมพวกเขา"

 lesson_diplomacy_open_works_of_art: "เปิดแถบย่อยงานศิลป์"
 lesson_diplomacy_4: "@art_work! งานศิลป์"
 lesson_diplomacy_4_desc: "หนึ่งในเครื่องมือที่สำคัญที่สุดที่ท่านมีเพื่อเพิ่ม [cultural_influence_with_icon|e] ของ [primary_culture_with_icon|e] คือ [works_of_art_with_icon|e]\n\nให้เรามาตรวจสอบที่ #high แถบงานศิลป์#! เป็นลำดับถัดไป เชิญไปยังแถบย่อยที่เน้นไว้"
 lesson_diplomacy_open_culture_breakdown: "เปิดแถบย่อยการจำแนกวัฒนธรรม"
 lesson_diplomacy_5: "@art_work! งานศิลป์"
 lesson_diplomacy_5_desc: "[works_of_art_with_icon|e] คือผลงานที่สร้างขึ้นโดย [artists_with_icon|e] ใน [country_with_icon|e] ของท่าน ตัวอย่างเช่น [ShowArtistTypeName('painter')] อาจผลิต [ShowWorkOfArtTypeName('painting')] หรือ [ShowArtistTypeName('writer')] อาจสร้างสรรค์ [ShowWorkOfArtTypeName('novel')]\n\nเมื่อ $game_concept_work_of_art$ ถูกสร้างขึ้น [cultural_influence_with_icon|e] จำนวนหนึ่งจะถูกมอบให้แก่ [primary_culture_with_icon|e] ของท่าน\n\nเมื่อสร้างขึ้นแล้ว มันจะยังคงมอบผลประโยชน์ให้แก่ [cultural_tradition_with_icon|e] ของ $game_concept_primary_culture$ ของท่าน รวมถึงโบนัสรายเดือนให้แก่ [prestige_with_icon|e] ตาม [art_quality|e]\n\n[prestige] เป็นอีกหนึ่งค่าสถิติที่ท่านสามารถติดตามได้บน #high แถบด้านบน#! และเป็นมาตรวัดการปรากฏตัวทางวัฒนธรรมของ [country] ท่านบนเวทีโลก เหนือสิ่งอื่นใด ระดับ [prestige] ที่สูงจะช่วยท่านในด้าน [diplomacy|e] และ [integration|e]"
 lesson_diplomacy_open_religion: "เปิดแถบศาสนา"
 lesson_diplomacy_6: "[religion_icon] ศาสนา"
 lesson_diplomacy_6_desc: "นอกจาก [culture_with_icon|e] แล้ว อีกหนึ่งลักษณะเฉพาะของ [pops_with_icon|e] คือ [religion_with_icon|e] ของพวกเขา ให้เราไปดูที่ [Link('country_religion', '', '@society_panel! แถบศาสนา')] เป็นลำดับถัดไป!"
 lesson_diplomacy_7: "[religion_icon] ศาสนา"
 lesson_diplomacy_7_desc: "ในแถบนี้ ท่านสามารถดู [primary_religion_with_icon|e] ของท่าน รวมถึง [religions_with_icon|e] อื่น ๆ ที่ปรากฏอยู่ใน [country_with_icon|e] ของท่าน\n\nท่านสามารถใช้ [religious_influence_with_icon|e] เพื่อสร้างปฏิสัมพันธ์กับ $game_concept_religion$ ของท่าน ในหลากหลายวิถีทาง ขึ้นอยู่กับความเชื่อเฉพาะของ $game_concept_country$ ของท่าน\n\nเช่นเดียวกับ [culture_with_icon|e] ทุก $game_concept_religions$ ใน $game_concept_country$ จะมี [religious_status|e] ที่เกี่ยวข้องด้วย"

 lesson_diplomacy_8: "@population! ประชากร"
 lesson_diplomacy_8_desc: "ลำดับถัดไป ให้เรามาตรวจสอบที่ #high แถบประชากร#!"
 lesson_diplomacy_open_people: "เปิดแถบประชากร"
 lesson_diplomacy_8b: "@population! ประชากร"
 lesson_diplomacy_8b_desc: "ในที่นี้ ท่านจะพบข้อมูลเกี่ยวกับ [pops_with_icon|e] ใน [country_with_icon|e] ของท่าน $game_concept_pops$ ของท่านพำนักอยู่ใน [location_with_icon|e] เฉพาะ และถูกระบุผ่าน [culture_with_icon|e], [religion_with_icon|e] และ [pop_type|e]\n\nท่านจะพบข้อมูลเกี่ยวกับ [rebels_with_icon|e] ในแผงนี้ด้วย โดยทั่วไปแล้ว $game_concept_rebels$ สามารถจัดการได้โดยการเพิ่ม [pop_satisfaction|e] ของพวกเขา"

 lesson_diplomacy_8c: "@characters! ตัวละคร"
 lesson_diplomacy_8c_desc: "ให้เราไปส่องดู [characters_with_icon|e] เป็นลำดับถัดไป เชิญไปยัง #high แถบตัวละคร#!"
 lesson_diplomacy_open_character: "เปิดแถบย่อยตัวละคร"
 lesson_diplomacy_8d: "@characters! ตัวละคร"
 lesson_diplomacy_8d_desc: "ในระหว่างการดำเนินเกมของท่าน ท่านจำต้องปฏิสัมพันธ์กับ [characters_with_icon|e] จำนวนมาก ซึ่งเป็นบุคคลสำคัญที่ท่านสามารถจ้างงานใน [roles|e] ต่าง ๆ\n\nในแถบนี้ ท่านสามารถเห็นรายชื่อของ [characters] ทั้งหมดที่ปรากฏอยู่ในราชสำนักของท่าน และ [role] ปัจจุบันของพวกเขา ตัวละครมีความสามารถ [abilities_with_icon|e] ที่จะกำหนดประสิทธิภาพในการปฏิบัติหน้าที่ใน [roles] ต่าง ๆ:\n\n[adm_with_icon|e]\n[dip_with_icon|e]\n[mil_with_icon|e]\n\nนอกเหนือจาก 3 [abilities] พื้นฐาน [characters] อาจพัฒนา [traits|e] เฉพาะที่ทำให้พวกเขามีความสามารถมากขึ้น ในงานบางอย่าง [characters] ยังสังกัดอยู่กับ [estate_with_icon|e] และบางคนจะสังกัดอยู่ใน [dynasty_with_icon|e] ที่มีชื่อเสียง\n\n#weak ท่านยังสามารถ @rightclick!#high คลิกขวา#! บนชื่อหรือภาพเหมือนของ [character] ที่ใดก็ได้ในเกมเพื่อเปิด #high เมนูบริบท#!#!"

 lesson_diplomacy_8e: "[character_icon] ตัวละคร"
 lesson_diplomacy_8e_desc: "พวกเราได้เห็นการใช้งาน [artists] ใน [court] ของท่านไปแล้ว แต่ [character_with_icon|e] ที่สำคัญที่สุดของท่านคือ [ruler_with_icon|e]\n\nให้เรากลับไปยังแผงการปกครองอีกครั้ง เพื่อส่องดูหลักอภิบาลอันสูงส่ง"

 lesson_admin_1: "[ruler_icon] ประมุข"
 lesson_admin_1_desc: "นี่คือ [ruler_with_icon|e] ของท่าน ซึ่งเป็น [character_with_icon|e] ที่สำคัญที่สุด [abilities_with_icon|e] ของ [ruler] มีผลกระทบอย่างมีนัยสำคัญต่อ [country_with_icon|e] ของท่าน ท่านสามารถตรวจสอบผลลัพธ์ได้ โดยการเลื่อนเมาส์วางเหนือสิ่งเหล่านั้น\n\nในภาพรวมนี้ ท่านยังสามารถเห็น [consort_with_icon|e], [heir_with_icon|e] และ [regent_with_icon|e] ของท่าน หากท่านมีผู้ครอง [roles|e] เหล่านั้นอยู่"
 lesson_admin_open_government: "เปิดแผง $game_concept_government$"

 lesson_admin_9: "[cabinet_icon] $game_concept_cabinet$"
 lesson_admin_9_desc: "เมื่อกล่าวถึง [characters_with_icon|e] ที่สำคัญ ให้เรามาสนทนาถึงหนึ่งในเครื่องมือ ที่ทรงพลังที่สุดที่ท่านมีเพื่อปกครอง [country_with_icon|e] นั่นคือ [cabinet_with_icon|e] ของท่าน\n\nเชิญไปยังแถบย่อยที่ปรึกษาที่เน้นไว้"
 lesson_admin_open_cabinet: "เปิดแถบย่อยที่ปรึกษา"

 lesson_admin_10: "[cabinet_icon] $game_concept_cabinet$"
 lesson_admin_10_desc: "นี่คือ [cabinet_with_icon|e] ของท่าน ประกอบด้วย [cabinet_seats_with_icon|e] หลายตำแหน่ง ซึ่งสามารถเติมเต็มได้โดย [characters_with_icon|e] ที่จะทำหน้าที่เป็น [cabinet_members_with_icon|e] ท่านสามารถมอบหมายงานให้ $game_concept_cabinet_members$ ด้วย [cabinet_actions_with_icon|e] ที่หลากหลาย อาทิ [ShowCabinetActionName('increase_control_province')] หรือ [ShowCabinetActionName('develop_province')]\n\n$game_concept_cabinet_actions$ ขึ้นอยู่กับหนึ่งในสาม [abilities_with_icon|e] โดยที่ $game_concept_abilities$ ของ [ruler_with_icon|e] และ [cabinet_member] ที่ได้รับมอบหมายให้ปฏิบัติหน้าที่ จะส่งผลต่ออิทธิพลของการออกคำสั่งนั้น\n\nตัวอย่างเช่น การออกคำสั่งอย่าง [ShowCabinetActionName('change_societal_values')] จะก้าวหน้าเร็วขึ้นหาก [dip_with_icon|e] ของ $game_concept_cabinet_member$ ที่ได้รับมอบหมายนั้นสูง [cabinet_efficiency_with_icon|e] โดยรวมของ [country_with_icon|e] จะส่งผลต่อความเร็ว และประสิทธิภาพของการออกคำสั่งด้วยเช่นกัน\n\n@hint! ท่านสามารถเรียนรู้เกี่ยวกับที่ปรึกษาได้ใน [Link('hints', 'selected_hint = hint_has_possible_cabinet_action', 'คำแนะนำเกี่ยวกับที่ปรึกษา')]"

 lesson_admin_5: "[estates_icon] $game_concept_estates$"
 lesson_admin_5_desc: "ให้เราไปยัง #high แถบย่อยฐานันดร#! ท่านสามารถดู และปฏิสัมพันธ์กับ $game_concept_estates$ ต่าง ๆ ใน [country_with_icon|e] ของท่านได้โดยการเปิด #high แถบย่อยฐานันดร#! ภายในแถบ $game_concept_country$ ของแผง [government|e]"

 lesson_admin_6: "[government_type_icon] การปกครอง"
 lesson_admin_6_desc: "ทุก [country_with_icon|e] ล้วนแตกต่างกันใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! ลักษณะทางการเมืองของ [country] ของท่าน จะขึ้นอยู่กับ [government_type_with_icon|e] เป็นประการสำคัญ\n\nในฐานะ [Player.GetGovernment.GetGovernmentType.GetName] การดำเนินงานของ [country] ของท่านย่อมแตกต่างจากเพื่อนบ้าน ในแง่มุมที่สำคัญ ยิ่งไปกว่านั้น ลักษณะและโครงสร้างทางการเมืองของ [country] ใด ๆ ย่อมขึ้นอยู่กับการตั้งค่า [government_reforms_with_icon|e], [privileges_with_icon|e] และ [laws_with_icon|e]\n\nการแก้ไขสิ่งใดในสามอย่างนี้มักมาพร้อมกับราคาที่ต้องจ่าย ด้วย [stability_with_icon|e] อันมหาศาล\n\nให้เราไปดูว่าสิ่งเหล่านั้นอยู่ที่ใด เริ่มจากที่คุ้นเคยกันดีอย่าง [Link('government', 'tabcontent = estates', '@government_panel! แถบย่อยฐานันดร')]"

 lesson_admin_6b: "[government_reform_icon] ร่างปฏิรูปการปกครอง"
 lesson_admin_6b_desc: "[government_reforms_with_icon|e] ของท่านคือหนึ่งในลักษณะเฉพาะที่บ่งบอกตัวตนของ [country_with_icon|e] มากที่สุด มักจะมีผลกระทบอย่างมาก ดังนั้นการตั้งค่าสิ่งเหล่านี้ จึงควรเป็นสิ่งแรก ๆ ที่ท่านทำเมื่อเริ่มเกมใหม่\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [government_reforms] ได้ใน [Link('hints', 'selected_hint = hint_has_possible_reform', 'คำแนะนำเกี่ยวกับร่างปฏิรูปการปกครอง')]"

 lesson_admin_open_country: "เปิดแถบประเทศ"
 lesson_admin_open_estates: "เปิดแถบย่อยฐานันดร"

 lesson_admin_6c: "[privileges_icon] เอกสิทธิ์"
 lesson_admin_6c_desc: "พวกเราได้สนทนาเรื่อง [privileges_with_icon|e] ไปแล้วเมื่อตอนที่กล่าวถึง [estates_with_icon|e] นอกเหนือจากผลกระทบต่อ [estate_satisfaction_with_icon|e] และ [estate_power_with_icon|e] แล้ว [privileges] ยังส่งผลกระทบอย่างลึกซึ้งต่อวิธีการเล่น [country_with_icon|e] ของท่าน ซึ่งมักจะเปิดความเป็นไปได้ใหม่ ๆ หรือจำกัดเสรีภาพในการออกคำสั่งของท่าน"

 lesson_admin_open_laws: "เปิดแถบย่อยกฎหมาย"
 lesson_admin_11: "[laws_icon] $game_concept_laws$"
 lesson_admin_11_desc: "ประการสุดท้าย ทุกประเทศเริ่มต้นด้วยชุด [laws_with_icon|e] ที่แตกต่างกัน เชิญท่านไปยัง #high แถบย่อยกฎหมาย#! ใน #high แถบประเทศ#!"

 lesson_admin_12: "[law_icon] $game_concept_laws$"
 lesson_admin_12_desc: "[laws_with_icon|e] มีอยู่หลากหลายหมวดหมู่และช่วยให้ท่านปรับแต่ง [country_with_icon|e] ของท่าน ทุก [law] ประกอบด้วย [policies_with_icon|e] หลายประการให้เลือกใช้\n\nตัวอย่างเช่น ท่านอาจเลือกใช้ [ShowPolicyName('no_censorship')] เป็น $game_concept_policy$ ที่มีผลสำหรับ $game_concept_law$ [ShowLawName('censorship')] ซึ่งจะส่งผลที่หลากหลายทั้งในทางลบ และทางบวก ความเร็วที่ท่านสามารถเปลี่ยน $game_concept_policy$ ขึ้นอยู่กับ [legislative_efficiency_with_icon|e] ของท่าน\n\n#weak $game_concept_laws$ สามารถเปลี่ยนได้ทุกเมื่อโดยต้องแลกด้วย [gold_with_icon|e] และ [stability_with_icon|e] ทว่าโดยปกติแล้วการรอให้มีการประชุม [parliament_with_icon|e] จะเป็นการชาญฉลาดกว่า#!"
 lesson_admin_open_values: "เปิดแถบค่าความนิยม"

 lesson_admin_13: "[societal_value_icon] $game_concept_societal_values$"
 lesson_admin_13_desc: "ยามนี้ ท่านสามารถประกาศใช้ [government_reforms_with_icon|e], [laws_with_icon|e] และ [privileges_with_icon|e] ใน [country_with_icon|e] ของท่านได้ตามปรารถนา ตราบเท่าที่ท่านสามารถแบกรับราคาของ [stability_with_icon|e] ทว่าบางสิ่งมิอาจเปลี่ยนได้ในชั่วข้ามคืน และสังคมนั้นมักจะปรับตัวต่อกฎหมายใหม่ได้ช้าอย่างยิ่ง\n\nเพื่อแสดงถึงเอกลักษณ์เชิงโครงสร้างที่ลึกซึ้งยิ่งขึ้น ของประเทศและราษฎรของท่าน เรามี [societal_values_with_icon|e] ให้เราไปพิจารณาสิ่งเหล่านั้นกันเถิด"

 lesson_admin_14: "[societal_value_icon] $game_concept_societal_values$"
 lesson_admin_14_desc: "[societal_values_with_icon|e] ของ [country_with_icon|e] แสดงถึงขนบธรรมเนียมที่หยั่งรากลึกของประชากร ความเฉื่อยชาของสถาบันต่าง ๆ และรอยประทับที่มีต่อลักษณะนิสัยของผู้อยู่อาศัย สิ่งเหล่านี้เปลี่ยนแปลงอย่างช้ ๆ ตามกาลเวลา และปรับตัวตามลักษณะของกฎหมาย\n\n[reforms_with_icon|e], [privileges_with_icon|e], [laws_with_icon|e] และการออกคำสั่งเฉพาะที่ท่านทำในระหว่างการปกครอง จะทำให้ [societal_values] ค่อย ๆ เคลื่อนเข้าสู่ค่าเป้าหมาย\n\n#weak ตัวอย่างเช่น การมอบ [privileges] บางประการให้แก่ [GetEstateName('nobles_estate')] ของ $game_concept_country$ จะผลักดันประเทศของท่านไปสู่ [ShowSocietyDirectionName('aristocracy')]#!"

 lesson_admin_15: "[crown_power_icon] $game_concept_crown_power$"
 lesson_admin_15_desc: "การคานอำนาจของ [GetEstateName('crown_estate')] ต่อเหล่า [estates_with_icon|e] อื่น ๆ คือหนึ่งในรากฐานสำคัญของการปกครองใน @caesar!#high ยูโรปา ยูนิเวอร์ซาลิส 5#!\n\n[crown_power_with_icon|e] ของท่านขึ้นอยู่กับค่าเฉลี่ยของ [control_with_icon|e] ใน [locations] ทั้งปวงของท่านเป็นหลัก และมันจะลดลงตาม [privileges_with_icon|e] ของเหล่าฐานันดร ทั้งนี้ [government_reforms_with_icon|e], [laws_with_icon|e] และ [societal_values_with_icon|e] จำนวนมากล้วนส่งผลกระทบต่อสิ่งนี้เช่นกัน\n\nการรักษา [crown_power] ให้สูงไว้นั้นสำคัญยิ่ง เพราะมิมเพียงแต่ช่วยเพิ่ม [cabinet_efficiency_with_icon|e] และแรงสนับสนุนของท่านใน [parliament_with_icon|e] เท่านั้น แต่มันยังกำหนดสัดส่วนของ [trade_income_with_icon|e] ที่จะไหลเข้าสู่ [treasury_with_icon|e] ของท่านโดยตรง"

 lesson_economy_1: "@adm! บทสรุปเศรษฐกิจ"
 lesson_economy_1_desc: "พวกเรากำลังเริ่มต้น @adm! #high บทสรุปเศรษฐกิจ#! ณ บัดนี้ พวกเราจะดำดิ่งลงไปในระบบเศรษฐกิจของ #high ยูโรปา ยูนิเวอร์ซาลิส 5#! ให้ลึกซึ้งยิ่งขึ้น โดยเริ่มจากรากฐานของมัน นั่นคือ [markets_with_icon|e]"

 lesson_economy_2: "[market_icon] $game_concept_markets$"
 lesson_economy_2_desc: "ที่นี่ท่านจะเห็นรายชื่อของ [markets_with_icon|e] ที่ [country_with_icon|e] ของท่านมีบทบาทอยู่ ในขณะที่บนแผนที่ท่านจะเห็น [markets] ทั้งหมดในโลกที่รู้จัก ทุก [location_with_icon|e] สังกัดอยู่กับ [market] แห่งหนึ่ง ซึ่งเป็นที่ที่พวกเขาส่ง [goods_with_icon|e] ที่ผลิตได้ไปขาย และซื้อ [goods] ที่พวกเขาจำเป็นต้องใช้\n\nหลายสิ่งในเกมนี้ล้วนต้องการสินค้า: [pops_with_icon|e] ต้องการ [goods] เพื่อดำรงชีพ, [constructions_with_icon|e] ต้องการ [goods] เพื่อให้รุดหน้า, [buildings_with_icon|e] ต้องการ [goods] เพื่อให้ทำงานได้, [armies_with_icon|e] ต้องการ [goods] เพื่อทำการรบ\n\nตัวอย่างเช่น ท่านสามารถเห็นได้บนแผนที่ว่า [capital_with_icon|e] เมืองหลวงของท่าน [Player.GetCapital.GetName] สังกัดอยู่กับ [market_icon][Player.GetCapital.GetMarket.GetName] ดังนั้นสิ่งใดก็ตามที่ท่านสร้างในที่แห่งนั้นจะใช้ [goods] จาก [market] ดังกล่าว\n\n#weak ท่านยังสามารถ @rightclick!#high คลิกขวา#! บนชื่อหรือบัตร [market] ที่ใดก็ได้ในเกมเพื่อเปิด #high เมนูบริบท#!#!"

 lesson_economy_3: "[market_icon] $game_concept_markets$"
 lesson_economy_3_desc: "ผลผลิตจาก [locations_with_icon|e] ทั้งหมดจะถูกขายในทุก ๆ เดือนให้แก่ [stockpile_with_icon|e] ของ [market_with_icon|e] เพื่อสร้าง [wealth_with_icon|e] ในทางกลับกัน ทุก [locations] จะพยายามซื้อ [goods_with_icon|e] ที่จำเป็นจาก [market] ของตน ตามลำดับของ [market_access_with_icon|e] ส่วนต่างระหว่าง [supply_with_icon|e] และ [demand_with_icon|e] ของสินค้าหนึ่งในตลาดจะส่งผลต่อ [market_price_with_icon|e]\n\nโปรดทราบว่า [markets] นั้นอยู่เหนือพรมแดนของ [country_with_icon|e] ผลผลิตจากทำเลของท่านจะมุ่งตรงสู่ [market] ที่เกี่ยวข้องเสมอ ดังนั้นทำเลต่างแดนในตลาดเดียวกันอาจซื้อ [goods] เหล่านั้นตัดหน้าทำเลของท่านเอง หากพวกเขามี [market_access] ที่สูงกว่า\n\n[market_access_with_icon|e] ของทำเลขึ้นอยู่กับระยะห่างจาก [market_center_with_icon|e] และท่านสามารถปรับปรุงมันได้ด้วย [roads_with_icon|e] เช่นเดียวกับ [proximity_with_icon|e] โดยทั่วไปแล้วทำเลมักจะสังกัดอยู่กับ [market] ที่ใกล้ที่สุด ซึ่งก็คือแห่งที่พวกเขามี [market_access] สูงกว่า\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับตลาดได้ใน [Link('hints', 'selected_hint = hint_markets', 'คำแนะนำเกี่ยวกับตลาด')]"

 lesson_economy_4: "[trade_icon] $game_concept_trade$"
 lesson_economy_4_desc: "ยามนี้ [markets_with_icon|e] มิเคยถูกตัดขาดจากกันโดยสิ้นเชิง การเคลื่อนย้าย [goods_with_icon|e] ระหว่างสองตลาดนั้นเรียกว่า [trade_with_icon|e]\n\n[countries_with_icon|e] สามารถเคลื่อนย้าย [goods] ระหว่างตลาดได้โดยใช้ [merchant_capacity_with_icon|e] ของตน ซึ่งจะสร้างผลกำไร (หรือขาดทุน) ในกระบวนการดังกล่าว ยิ่งไปกว่านั้นเหล่า @burghers! [ShowPopTypeName('burghers')] ที่อาศัยอยู่ในตลาดจะดำเนินการ [trade] ด้วยตนเองอีกทอดหนึ่ง\n\nตามค่าเริ่มต้น การค้าจะถูกตั้งค่าเป็น @automation! #high อัตโนมัติ#! ในทุกตลาด ซึ่งหมายความว่า [merchant_capacity] ใด ๆ ที่ท่านมีในตลาดนั้นจะถูกใช้งาน โดยอัตโนมัติกับข้อเสนอที่ดีที่สุด เราขอแนะนำให้ท่านปล่อยให้การค้าดำเนินไป โดยอัตโนมัติจนกว่าท่านจะมีประสบการณ์มากขึ้น\n\nเมื่อถึงเวลา ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับการค้าได้ที่นี่:\n$TAB$[Link('hints', 'selected_hint = hint_trade', '@hint! คำแนะนำเกี่ยวกับการค้า')]"

 lesson_economy_5: "[food_icon] $game_concept_food$"
 lesson_economy_5_desc: "ประการสุดท้าย [pops_with_icon|e] ยังมีการผลิตและบริโภค [food_with_icon|e] ด้วย\n\n[food] ถูกผลิตขึ้นหลัก ๆ โดย @laborers! [ShowPopTypeName('laborers')] ที่ทำงานใน [rgo_with_icon|e] ที่มี [food_raw_materials|e] อาทิ [ShowGoodsName('wheat')] แม้ว่าเหล่า @peasants! [ShowPopTypeName('peasants')] ที่ทำ [subsistence_agriculture_with_icon|e] จะช่วยสมทบในจำนวนเล็กน้อยก็ตาม\n\nทุก [market_with_icon|e] มี [food_stockpile_with_icon|e] ซึ่งจะเพิ่มขึ้นหรือลดลงในทุกเดือน หากตลาดใดขาดแคลน [food] ประชากรจะประสบกับ [starvation_with_icon|e] ท่านสามารถดูงบดุลเสบียงของตลาดได้ในบัตรตลาด\n\nท่านสามารถเรียนรู้เกี่ยวกับวิธีการทำงาน ของการจัดหาเสบียงได้ใน [Link('hints', 'selected_hint = hint_food', '@hint! คำแนะนำเกี่ยวกับเสบียง')]"

 lesson_admin_21: "[good_icon] $game_concept_goods$"
 lesson_admin_21_desc: "ให้เราไปสำรวจ [goods|e] ใน [markets_with_icon|e] ของท่านกันต่อเถิด!\n\nในการนี้ ท่านสามารถคลิกที่ปุ่ม [good_icon|e] [goods] ใน #high บัตรตลาด#! [market_icon] ซึ่งจะนำท่านไปยังแถบสินค้าของแผงการผลิต โดยที่กรองข้อมูลตามตลาดแห่งนี้ไว้แล้ว"

 lesson_admin_22: "[good_icon] $game_concept_goods$"
 lesson_admin_22_desc: "ที่นี่ท่านจะเห็น [goods_with_icon|e] ทั้งหมดใน [market_with_icon|e] แห่งหนึ่ง\n\n#weak ท่านสามารถนำการกรองใน #high บัตรตลาด#! [market_icon] ออกเพื่อดูสินค้าใน [country] ทั้งหมดของท่าน รวมถึงตลาดทุกแห่งที่ท่านถือครอง [locations] อยู่#!\n\nท่านสามารถเพิ่ม [supply_with_icon|e] ของสินค้าใด ๆ ในตลาดได้ผ่านสามวิถีทาง:\n\n$BULLET$ [rgo_icon] การขยาย [rgo|e]\n[rgo] สามารถขยายเพื่อผลิต [raw_materials_with_icon|e] ได้ หากท่าน [own|e] ทำเล [locations_with_icon|e] ที่เหมาะสม\n\n$BULLET$ [building_icon|e] การก่อสร้าง [buildings|e]\nแม้ว่าบางแห่งจะสามารถผลิต [raw_materials] ได้ ทว่า [buildings] นั้นโดดเด่นในการแปรรูป [raw_materials] ให้กลายเป็น [produced_goods_with_icon|e]\n\n$BULLET$ [import_icon|e] การนำเข้าผ่าน [trade_with_icon|e]\nท่านสามารถนำเข้า [goods] ที่จำเป็นจากตลาดอื่นได้เสมอ หากท่านมี [merchant_capacity_with_icon|e] ที่ว่างอยู่\n\n#weak ตัวอย่างเช่น ท่านอาจสร้าง $game_concept_rgo$ เพื่อรวบรวม @wool! [ShowGoodsName('wool')] จากนั้นจึงสร้าง $game_concept_building$ ประเภท @cloth_guild![ShowBuildingTypeName('cloth_guild')] เพื่อแปรรูปขนสัตว์นั้นให้เป็น @cloth! [ShowGoodsName('cloth')] ซึ่งถูกใช้งานโดย [buildings], [pops] และ [armies] อื่น ๆ อีกมากมาย#!"

 lesson_admin_25: "[building_icon] $game_concept_buildings$"
 lesson_admin_25_desc: "สุดท้ายนี้ ให้เรามาสนทนาเรื่อง [buildings_with_icon|e]\n\nให้เราไปดูรายชื่อทั้งหมดของ [buildings] ที่ท่านมี หรือที่ท่านสามารถสร้างได้ใน [country_with_icon|e] ท่านสามารถเข้าถึงได้โดยการคลิกที่ #high แถบสิ่งปลูกสร้าง#! ของแผงการผลิต\n\nหรืออีกทางหนึ่ง ท่านสามารถกดปุ่ม [building_icon] สิ่งปลูกสร้าง ใน #high บัตรตลาด#! [market_icon] เพื่อดูรายชื่อสิ่งปลูกสร้างในตลาดเฉพาะแห่งนั้น"

 lesson_admin_26: "[building_icon] $game_concept_buildings$"
 lesson_admin_26_desc: "ต่างจาก [rgo_with_icon|e] เพราะ [buildings_with_icon|e] ทั้งหมดล้วนต้องการ [goods_with_icon|e] นำเข้าเพื่อให้ทำงานได้ แต่มีเพียงบางแห่งเท่านั้นที่ผลิตสินค้า และสร้าง [wealth_with_icon|e] ออกมา\n\nสิ่งปลูกสร้างอื่น ๆ มีวัตถุประสงค์ที่ต่างออกไป อาทิ การจัดหา [manpower_with_icon|e], การเปิดให้เกณฑ์ [regulars_with_icon|e], การปรับปรุง [crown_power_with_icon|e] ของท่าน หรือการเพิ่ม [control_with_icon|e] ให้แก่ [location_with_icon|e] ของมัน\n\n$game_concept_buildings$ เช่นเดียวกับ [rgo_with_icon|e] จะมีราคาในการ [construction_with_icon|e] และต้องใช้เวลาในเกมเพื่อสร้าง เมื่อสร้างเสร็จแล้ว ทุก [building] จำต้องเข้าถึงสินค้า นำเข้าจากตลาดของตนเพื่อให้ทำงานได้อย่างเหมาะสม\n\n#weak โปรดจำไว้ว่าประเทศ [country|e] ของท่านอาจมีตลาดมากกว่าหนึ่งแห่ง #high บัตรตลาด#! [market_icon] ที่อยู่ด้านบนของ #high แผงการผลิต#! ช่วยให้ท่านกรองเนื้อหาตามรายตลาดได้#!\n\nท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับสิ่งปลูกสร้างได้ ในคำแนะนำประกอบที่เกี่ยวข้อง:\n[Link('hints', 'selected_hint = hint_lack_pop_promotion_to_fill_buildings', '@hint! สิ่งปลูกสร้างที่ขาดพนักงาน')]\n[Link('hints', 'selected_hint = hint_unprofitable_buildings', '@hint! สิ่งปลูกสร้างที่มิทำกำไร')]\n[Link('hints', 'selected_hint = hint_has_buildings_missing_input', '@hint! สิ่งปลูกสร้างที่ขาดสินค้านำเข้า')]"
 
 lesson_admin_27: "[mission_icon] $game_concept_missions$"
 lesson_admin_27b: "[mission_icon] $game_concept_missions$"
 lesson_admin_27_desc: "ประการสุดท้าย ให้เรามาพิจารณา [missions_with_icon|e]"

 lesson_admin_28: "[mission_icon] $game_concept_missions$"
 lesson_admin_28_desc: "[missions_with_icon|e] คือชุดภารกิจที่จะช่วยนำทางว่ามีสิ่งใดบ้าง ที่ท่านสามารถกระทำได้ใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! เกมนี้ช่างกว้างขวางนัก และมีหลายสิ่งให้ต้องเรียนรู้ แต่นั่นคือส่วนหนึ่งของความสำราญ!\n\nท่านเพิ่งเสร็จสิ้นบทนำ #high รูปแบบการเล่นเศรษฐกิจ#! @adm! ซึ่งหมายความว่ายามนี้ท่านสามารถเข้าถึง $game_concept_missions$ ที่จะช่วยให้ท่านดำดิ่งลงสู่วิธีการใช้งานแผงควบคุม และกลไกต่าง ๆ ที่เราเพิ่งได้กล่าวถึงไป\n\nเพื่อช่วยให้ท่านก้าวสู่ขั้นถัดไปได้ง่ายขึ้น เราได้เตรียม $game_concept_missions$ บางส่วนไว้เพื่อเป็นการเริ่มต้นให้แก่ท่าน"

 lesson_admin_29: "@caesar! สรุปทิ้งท้าย"
 lesson_admin_29_desc: "ยอดเยี่ยม! ยามนี้ ท่านมี [missions_with_icon|e] บางประการที่สามารถเข้าถึงได้ภายใน #high แถบภารกิจ#!\n\nเราขอแนะนำให้ท่านดำเนินการตามภารกิจเหล่านั้น เพื่อสร้างความมั่นคง และขยายสิ่งที่ท่านเพิ่งได้เรียนรู้ไป แต่จำไว้ว่าท่านสามารถเริ่มบทสรุปอื่น ๆ และ [missions] ที่เกี่ยวข้องได้ทุกเมื่อจาก #high แถบภารกิจ#!\n\nขอให้โชคดีในโลกกว้าง!"

