 lesson_diplomacy_open_current_relations: "เปิดแถบย่อยความสัมพันธ์ปัจจุบัน"
 lesson_diplomacy_10: "@diplomacy! การทูต"
 lesson_diplomacy_10_desc: "มิว่าท่านจักแผ่ขยายแสนยานุภาพเพียงใด ท่านย่อมจำต้องพึ่งพา [diplomacy_with_icon|e] หากประสงค์จักดำรงสถิตอยู่รอด ผ่านพ้นผันแปรแห่งยุคสมัย เนื่องด้วยท่านจำต้องลงนามใน [alliances_with_icon|e] เพื่อปกปักษ์ตนจากอริราชศัตรู หรือเจรจาขอ [peace_with_icon|e] ภายหลังเสร็จสิ้น [war_with_icon|e] อันยาวนาน\n\nมีสองประการสำคัญที่ควรพิจารณาในที่นี้:\n\n$BULLET$ท่านจำต้องใช้ [diplomats_with_icon|e] เพื่อดำเนิน [diplomatic_action_with_icon|e] กับ [countries_with_icon|e] อื่น ๆ อาทิ [improve_relations_with_icon|e] สร้าง [spy_networks_with_icon|e] หรือประกาศ [wars_with_icon|e] ท่านสามารถดูจำนวน [diplomats] ปัจจุบันได้ที่ #high แถบด้านบน#!\n\n$BULLET$การมี [treaties_with_icon|e] ทางการทูตกับ [countries] อื่น ๆ อาทิ [alliance] หรือ [subject_with_icon|e] จักต้องใช้ [diplomatic_capacity_with_icon|e] จำนวนหนึ่ง ท่านสามารถเพิ่ม [diplomatic_capacity] ที่มีอยู่ได้ด้วยการจ่าย [gold_with_icon|e] จากแผงงบประมาณ"
 lesson_diplomacy_11: "@diplomacy! ความสัมพันธ์ปัจจุบัน"
 lesson_diplomacy_11_desc: "ให้เรามุ่งไปยัง #high แถบย่อยความสัมพันธ์ปัจจุบัน#! เพื่อดำดิ่งสู่รายละเอียดว่า [country_with_icon|e] ของท่านมีพันธะใดอยู่บ้าง"
 lesson_diplomacy_12: "@diplomacy! ความสัมพันธ์ปัจจุบัน"
 lesson_diplomacy_12_desc: "#high แถบย่อยความสัมพันธ์ปัจจุบัน#! ประกอบด้วยข้อมูลเกี่ยวกับ [treaties_with_icon|e] ทั้งปวงที่ท่านได้ลงนามกับ [countries_with_icon|e] อื่น ๆ รวมถึง [international_organizations_with_icon|e] ที่ท่านสังกัดอยู่\n\nหากท่านมี [subjects_with_icon|e] ท่านจะสามารถจัดการพวกเขาได้จากแผงควบคุมนี้"
 lesson_diplomacy_13: "[country_icon] ประเทศที่รู้จัก"
 lesson_diplomacy_13_desc: "ลำดับถัดไป ให้เรามาตรวจสอบ [countries_with_icon|e] ที่ท่านรู้จัก"
 lesson_diplomacy_open_known_countries: "เปิดแถบย่อยประเทศที่รู้จัก"
 lesson_diplomacy_14: "[country_icon] ประเทศที่รู้จัก"
 lesson_diplomacy_14_desc: "จาก #high แถบย่อย#! นี้ ท่านสามารถดู [countries_with_icon|e] ทั้งหมดที่ท่านได้ [discovered_with_icon|e] โดยตามค่าเริ่มต้นจะมีการกรองข้อมูล เพื่อให้ท่านเห็นเพียง $game_concept_countries$ ที่อยู่ใน [diplomatic_range_with_icon|e] ของท่านเท่านั้น\n\nนี่ยังเป็นจุดที่ดีในการเรียกดู [great_power_score_with_icon|e] ของท่าน หาก $game_concept_great_power_score$ ของท่านอยู่ในกลุ่มที่สูงที่สุดในโลก ท่านจะถือว่าเป็น [great_power_with_icon|e] ซึ่งจะช่วยให้ท่านสามารถแผ่อิทธิพล เหนือประเทศเพื่อนบ้านได้มากขึ้น"
 lesson_diplomacy_15: "[international_organizations_icon] องค์การ"
 lesson_diplomacy_15_desc: "ให้เรามาตรวจสอบ [international_organizations_with_icon|e] กันเถิด!"
 lesson_diplomacy_open_known_orgs: "เปิดแถบย่อยองค์การ"
 lesson_diplomacy_16: "[international_organization_icon] องค์การ"
 lesson_diplomacy_16_desc: "จากที่นี่ ท่านสามารถเรียกดู [international_organization_icon] [international_organizations|e] ทั้งมวลในโลก ท่ามกลางองค์การเหล่านั้นมี อาทิ [GetUniqueInternationalOrganization('hre').GetName], [GetUniqueInternationalOrganization('catholic_church').GetName] หรือ [personal_unions_with_icon|e]\n\nการดำเนินงานใดที่ท่านสามารถกระทำได้ภายใน $game_concept_international_organizations$ ที่ท่านเป็นส่วนหนึ่งนั้น ขึ้นอยู่กับตัวองค์การเอง รวมถึง [special_status|e] ใด ๆ ที่ท่านอาจถือครองอยู่ภายในองค์การนั้น"
 lesson_diplomacy_17: "[country_icon] ประเทศต่างแดน"
 lesson_diplomacy_17_desc: "ให้เราใช้เวลาครู่หนึ่งเพื่อสนทนาเรื่อง [countries_with_icon|e] ต่างแดน เชิญท่าน @leftclick!#high คลิก#! บนประเทศในแผนที่เพื่อเปิดแผงควบคุมขึ้นมา\n\n#weak ท่านอาจจำต้องขยายภาพออกเพื่อเลือก [country] เนื่องจากท่านจะเลือกได้เพียง [locations_with_icon|e] เมื่อขยายภาพเข้าใกล้#!"
 lesson_diplomacy_open_foreign_country: "เปิดแผงควบคุมประเทศต่างแดนโดยการ @leftclick!#high คลิก#! ที่ประเทศบนแผนที่"
 lesson_diplomacy_18: "[countries_icon] ประเทศต่างแดน"
 lesson_diplomacy_18_desc: "ที่นี่ท่านจะเห็นภาพรวมของ [country_with_icon|e] ต่างแดน รวมถึง [ruler_with_icon|e] แถบ [diplomacy_with_icon|e] จะมีลักษณะคล้ายคลึงกับส่วนความสัมพันธ์ปัจจุบัน ที่เราได้สนทนากันไปก่อนหน้า และแสดงสิ่งต่าง ๆ อาทิ [allies_with_icon|e], [rivals_with_icon|e] และ [subjects_with_icon|e]\n\nสำหรับตอนนี้ ให้เราพิจารณาบัตรการทูตที่เน้นไว้ ซึ่งประกอบด้วยปุ่มสำหรับเข้าถึง [diplomatic_actions_with_icon|e] ทั่วไปอย่างรวดเร็ว อาทิ การปรับปรุง [opinion_with_icon|e] หรือการสะสม [favors_with_icon|e]\n\n#weak ท่านยังสามารถ #high คลิกขวา#! บนชื่อประเทศหรือธงที่ใดก็ได้ในเกมเพื่อเปิด #high เมนูบริบท#!#!"
 lesson_diplomacy_19: "[diplomatic_action_icon] คำสั่งทางการทูต"
 lesson_diplomacy_19b: "[diplomatic_action_icon] คำสั่งทางการทูต"
 lesson_diplomacy_19_desc: "นอกเหนือจาก [diplomatic_actions_with_icon|e] ทั่วไปที่เข้าถึงได้ผ่านบัตร [diplomacy_with_icon|e] ท่านยังสามารถ #high คลิก#! ที่ชื่อของ [country_with_icon|e] เพื่อไปยัง #high แถบคำสั่ง#! ของ [Link('diplomacy', '', '@diplomacy_panel! แผงการทูต')] โดยที่ $game_concept_country$ เฉพาะเจาะจงที่ท่านกำลังดูอยู่ จะถูกเลือกไว้ล่วงหน้าแล้ว\n\n#weak ท่านยังสามารถ #high คลิกขวา#! บนชื่อประเทศหรือธงที่ใดก็ได้ในเกมเพื่อเปิด #high เมนูบริบท#! และเลือกตัวเลือก #high $SELECT_ACTIONS$#!#!"
 lesson_diplomacy_open_actions: "เปิดคำสั่งทางการทูตโดยการ @leftclick!#high คลิก#! ที่ชื่อในบัตรประเทศ"
 lesson_diplomacy_20: "[diplomatic_action_icon] คำสั่งทางการทูต"
 lesson_diplomacy_20b: "[diplomatic_action_icon] คำสั่งทางการทูต"
 lesson_diplomacy_20_desc: "จาก #high แถบคำสั่งทางการทูต#! พวกเราสามารถดำเนิน [diplomatic_actions_with_icon|e] ที่แตกต่างกันได้มากมาย เนื่องด้วยพวกเรามุ่งมายังที่นี่โดยการเลือก [country_with_icon|e] บนแผนที่ $game_concept_country$ นั้นจึงถูกเลือกไว้เป็นเป้าหมายสำหรับคำสั่งเรียบร้อยแล้ว\n\nมี $game_concept_diplomatic_actions$ หลากหลายที่ท่านสามารถกระทำได้ ซึ่งบางคำสั่งจักใช้ได้เพียงในสถานการณ์เฉพาะ หากท่านประสงค์จักปฏิสัมพันธ์กับ $game_concept_countries$ อื่นอย่างสันติ มีสามสิ่งด้วยกันที่ท่านควรใส่ใจ: [opinion_with_icon|e], [trust_with_icon|e] และ [favors_with_icon|e]\n\nสำหรับตอนนี้ ให้เราลองใช้คำสั่ง [improve_relations_with_icon|e]"
 lesson_diplomacy_confirm_diplo_action: "@leftclick!คลิกที่ปุ่มปรับปรุงทัศนคติสำหรับประเทศที่เลือก"
 lesson_diplomacy_21: "[diplomatic_action_icon] คำสั่งทางการทูต"
 lesson_diplomacy_21_desc: "ทำได้ดีมาก! เมื่อท่านยืนยัน [diplomatic_action_with_icon|e] ของท่านแล้ว [diplomats_with_icon|e] ของท่านจักออกเดินทางไปยัง [country_with_icon|e] ที่ระบุ และเริ่มดำเนินคำสั่งที่ท่านได้เลือกไว้\n\nคำสั่ง [improve_relation_with_icon|e] จักมิส่งผลในทันที ทว่าจักค่อย ๆ เพิ่ม [opinion_with_icon|e] ตลอดช่วงเวลาหลายเดือน และหลายปี เช่นเดียวกับ $game_concept_diplomatic_actions$ อื่น ๆ อีกจำนวนมาก"
 lesson_admin_28b_desc: "[missions_with_icon|e] คือชุดภารกิจที่จะช่วยนำทางว่า มีสิ่งใดบ้างที่ท่านสามารถกระทำได้ใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! เกมนี้ช่างกว้างขวางนัก และมีหลายสิ่งให้ต้องเรียนรู้ แต่นั่นคือส่วนหนึ่งของความสำราญ!\n\nท่านเพิ่งเสร็จสิ้นบทนำ #high รูปแบบการเล่นการเมือง#! @dip! ซึ่งหมายความว่ายามนี้ท่านสามารถเข้าถึง $game_concept_missions$ ที่จะช่วยให้ท่านดำดิ่งลงสู่วิธีการใช้งานแผงควบคุมและกลไกต่าง ๆ ที่เราเพิ่งได้กล่าวถึงไป\n\nเพื่อช่วยให้ท่านก้าวสู่ขั้นถัดไปได้ง่ายขึ้น เราได้เตรียม $game_concept_missions$ บางส่วนไว้เพื่อเป็นการเริ่มต้นให้แก่ท่าน"
 lesson_diplomacy_has_mission_active: "เริ่มภารกิจการเมือง"

 ############ MILITARY ############

 lesson_military_open_military: "เปิดแผงการทหาร"
 lesson_military_0: "[war_icon] บทสรุป $PLAYER_PLAYSTYLE_MILITARY$" 
 lesson_military_0b: "[war_icon] บทสรุป $PLAYER_PLAYSTYLE_MILITARY$"
 lesson_military_0_desc: "ลำดับถัดไป เราจะไปพิจารณาบทสรุป $PLAYER_PLAYSTYLE_MILITARY$! เริ่มต้นด้วยการตรวจสอบแผงการทหารกันเถิด"
 lesson_military_1: "@military_panel! การทหาร"
 lesson_military_1_desc: "ในที่นี้ ท่านจะเห็นภาพรวมของ [armies_with_icon|e] ของท่าน ในกรณีที่เกิด [war_with_icon|e] [armies] สามารถเคลื่อนย้ายไปตามแผนที่ เพื่อเข้าปะทะกับ [armies] ของข้าศึก และเข้า [occupy_with_icon|e] [locations_with_icon|e] ของศัตรู\n\n[armies] ประกอบด้วย [regiments_with_icon|e] สามประเภทที่แตกต่างกัน:\n\n$BULLET$[levies_with_icon|e] ถูกเรียกเกณฑ์จาก [population_with_icon|e] ของท่านผ่านเหล่า [estates_with_icon|e] โดยทั่วไปจะอ่อนแอ แต่มีค่าบำรุงรักษาที่ถูก\n\n$BULLET$[regulars_with_icon|e] คือทหารประจำการมืออาชีพที่ท่านจำต้องจ่ายเบี้ยเลี้ยง และฝึกฝน และจำเป็นต้องใช้ [manpower_with_icon|e]\n\n$BULLET$[mercenaries_with_icon|e] สามารถจ้างวานได้ด้วย [gold_with_icon|e] เพื่อให้มาพลีชีพเพื่อ [country] ของท่าน... ตราบเท่าที่ท่านยังคงจ่ายเบี้ยเลี้ยง\n\nเมื่อเริ่มต้นเกม [countries_with_icon|e] ส่วนใหญ่จะพึ่งพา [levies] จากเหล่าฐานันดรของตนเป็นหลักในการทำ [wars] ทว่าเมื่อเวลาผ่านไปและมีความก้าวหน้า [advances_with_icon|e] เกิดขึ้น จะมีการเปลี่ยนไปใช้ [regiments] แบบมืออาชีพ ซึ่งจำเป็นต้องใช้ [manpower]\n\n[navies_with_icon|e] คือทัพเรือที่เทียบเท่ากับ [armies] และมีรูปแบบการดำเนินงานที่คล้ายคลึงกัน โดยมี [navy_levies_with_icon|e] และ [ships_with_icon|e] แบบมืออาชีพซึ่งจำต้องใช้ [sailors_with_icon|e]"
 lesson_military_2: "[manpower_icon] กำลังพล"
 lesson_military_2_desc: "เราควรใช้เวลาครู่หนึ่งเพื่อสนทนาเรื่อง [manpower_with_icon|e] ดังที่ได้กล่าวไปแล้ว [regular_regiments_with_icon|e] จำเป็นต้องใช้ [manpower] ในการเกณฑ์ทหาร รวมถึงการเติมเต็มกำลังพล หากพวกเขาได้รับความสูญเสีย\n\n[manpower] ได้มาจาก [buildings_with_icon|e] ทางการทหาร ที่จ้างงานกลุ่มประชากร @soldiers! [ShowPopTypeName('soldiers')] [pops]\n\n#weak ในช่วงแรก ท่านสามารถสร้าง $game_concept_manpower$ ได้ด้วยการก่อสร้าง [ShowBuildingTypeName('sergeantry')] [building] ผ่านแผงการผลิต ทว่าท่านจะเข้าถึงแหล่งกำลังพลได้มากขึ้น เมื่อท่านค้นพบ [advances_with_icon|e] ใหม่ ๆ#!\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [manpower] ได้ใน [Link('hints', 'selected_hint = hint_manpower', 'คำแนะนำเกี่ยวกับกำลังพล')]"

 lesson_military_war_0: "[casus_belli_icon] เหตุแห่งสงคราม"
 lesson_military_war_0_desc: "เมื่อเราได้กล่าวถึง [armies_with_icon|e] และ [navies_with_icon|e] ไปแล้ว เราควรสนทนาในภาพรวมเกี่ยวกับ [war_with_icon|e] และ [casus_belli_with_icon|e]\n\n[war] เริ่มต้นขึ้นเมื่อ [country_with_icon|e] ส่งคำประกาศสงครามต่ออีกฝ่ายหนึ่ง สงครามสามารถประกาศได้ ด้วยเหตุผลอันชอบธรรม ซึ่งเรียกว่า [casus_belli_with_icon|e] ซึ่งจะทำให้การเจรจาสันติภาพง่ายขึ้นสำหรับท่าน การเข้าสู่ [war] โดยปราศจาก [casus_belli] นั้นยังคงเป็นไปได้ แต่จะส่งผลกระทบที่รุนแรงกว่าต่อ [stability_with_icon|e] และ [opinion_with_icon|e] ของเพื่อนบ้านท่าน\n\nวิธีที่ดีที่สุดในการได้รับเหตุแห่งสงคราม คือการยื่นขอจาก [parliament_with_icon|e] ของท่านผ่านแผงการปกครอง การสร้าง [spy_networks_with_icon|e] ในต่างแดนจะช่วยให้ท่านสร้างหลักฐาน [casus_belli] ต่อพวกเขาได้ หากท่านมี [cores_with_icon|e] ในดินแดนของพวกเขา หรือหากพวกท่านเป็น [rivals_with_icon|e]\n\n#weak เมื่อประกาศ [war] โปรดจำไว้ว่าเหล่า [allies_with_icon|e] และ [subjects_with_icon|e] ของข้าศึกมักจะเข้าร่วมสงคราม ในฝ่ายของพวกเขาด้วย! #!\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [casus_belli] ได้ใน [Link('hints', 'selected_hint = hint_casus_belli', 'คำแนะนำเกี่ยวกับเหตุแห่งสงคราม')]"
 lesson_military_war_1: "[war_icon] สงคราม"
 lesson_military_war_1_desc: "ทุก [war_with_icon|e] ย่อมมีชัยได้ด้วยการสะสม [war_score_with_icon|e] ซึ่งได้รับจากการชนะ [battles_with_icon|e], การพยายาม [occupy_with_icon|e] [locations_with_icon|e] ของข้าศึก และที่สำคัญที่สุดคือการบรรลุ [war_goal|e] ทุก [war_with_icon|e] ล้วนมีเป้าหมาย [war_goal|e] ซึ่งขึ้นอยู่กับ [casus_belli_with_icon|e] ของผู้เข้าตี\n\nในหนึ่ง $game_concept_war$ จะมี [war_leaders_with_icon|e] สองฝ่าย ซึ่งทั้งคู่สามารถมี [war_allies_with_icon|e] ได้มากมาย ท้ายที่สุดแล้ว $game_concept_war$ จะสิ้นสุดลงเมื่อทั้งสองฝ่ายตกลงยินยอมใน [peace_treaty_with_icon|e]\n\nในขณะที่ท่านสามารถ [occupy] ดินแดนข้าศึกในระหว่างดำเนิน $game_concept_war$ ดินแดนเหล่านั้นจะยังมิเปลี่ยนเจ้าของจนกว่า $game_concept_war$ จะสิ้นสุดลง และมี [peace_treaty] มายืนยันการโอนย้าย [ownership|e]\n\nท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [war], [battles] และ [occupation] ได้ในคำแนะนำประกอบที่เกี่ยวข้อง:\n[Link('hints', 'selected_hint = hint_war', '@hint! คำแนะนำเกี่ยวกับสงคราม')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! คำแนะนำเกี่ยวกับยุทธการ')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! คำแนะนำเกี่ยวกับการยึดครอง และการปิดล้อม')]"
 lesson_military_war_2: "[war_exhaustion_icon] ความเหนื่อยล้าจากสงคราม"
 lesson_military_war_2_desc: "ในระหว่างที่อยู่ใน [war_with_icon|e] ท่านจะสะสม [war_exhaustion_with_icon|e] หากค่านี้สูงเพียงพอ [armies_with_icon|e] และ [levies_with_icon|e] ของท่านจะมีประสิทธิภาพลดลงใน [battle_with_icon|e] และ [population_with_icon|e] ของท่านจะเริ่มลดจำนวนลง\n\nวิธีที่ดีที่สุดในการลด $game_concept_war_exhaustion$ คือการอยู่ในภาวะ [peace_with_icon|e] อย่างไรก็ตาม ยังมี [laws_with_icon|e] และ [estate_privileges_with_icon|e] บางประการที่จะช่วยลด $game_concept_war_exhaustion$ เมื่อเวลาผ่านไป\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [war_exhaustion] ได้ใน [Link('hints', 'selected_hint = hint_war_exhaustion', 'คำแนะนำเกี่ยวกับความเหนื่อยล้าจากสงคราม')]"
 lesson_military_war_3: "[war_icon] การควบคุมดินแดนใหม่"
 lesson_military_war_3_desc: "ดินแดนใหม่ที่ท่านพิชิตได้จะมิมอบประโยชน์ให้แก่ท่านในทันที โปรดจำไว้ว่าท่านจำเป็นต้องมี [control_with_icon|e] เพื่อให้ [locations_with_icon|e] ของท่านใช้งานได้ และนั่นอาจต้องอาศัยการลงทุนมหาศาลในโครงสร้างพื้นฐาน เพื่อแผ่ขยายระยะของ [proximity_with_icon|e]\n\nนอกจากนี้ ดินแดนที่ถูก [conquered_with_icon|e] จะได้รับบทลงโทษอย่างหนัก จนกว่าท่านจะทำการ [integrate_with_icon|e] ดินแดนนั้นด้วย [cabinet_action_with_icon|e] ด้วยเหตุผลเหล่านี้ การสร้าง [subject_with_icon|e] ในดินแดนที่พิชิตได้ใหม่ เพื่อปกครองดินแดนในนามของท่านจึงเป็นเรื่องที่ชาญฉลาด\n\n#italic หากต้องการเรียนรู้เพิ่มเติมเกี่ยวกับ [integration] ท่านสามารถตรวจสอบคำแนะนำประกอบ [Link('hints', 'selected_hint = hint_has_conquered_provinces', '@hint! $hint_has_conquered_provinces$')] ได้"
 lesson_military_open_geopolitics: "เปิดแผงภูมิรัฐศาสตร์"
 lesson_military_8: "@geopolitics_panel! ภูมิรัฐศาสตร์"
 lesson_military_8_desc: "สุดท้ายนี้ เราควรพิจารณา @geopolitics_panel! #high แผงภูมิรัฐศาสตร์#! เพื่อกล่าวถึงอีกหนึ่งกลไกที่อาจมีความสำคัญใน [ages|e] ภายหน้า: [exploration_with_icon|e] และ [colonization_with_icon|e]!"
 lesson_military_9: "@geopolitics_panel! ภูมิรัฐศาสตร์"
 lesson_military_9_desc: "ในท้ายที่สุด และโดยเฉพาะในช่วง [ShowAgeName('age_3_discovery')] หลาย [countries_with_icon|e] จะเริ่มความพยายามในการ [exploration_with_icon|e] จากแผงนี้ ท่านจะเห็นภาพรวมของโอกาสใน $game_concept_exploration$ รวมถึงดินแดนที่เหมาะสมต่อการ [colonization_with_icon|e] หากท่านมีหนทางเข้าถึงดินแดนนั้น ท่านจะได้รับ [colonial_range_with_icon|e] หากวิจัย [advances_with_icon|e] ที่เหมาะสม\n\nแถบอื่น ๆ ของแผงนี้ยังประกอบด้วยข้อมูลที่เป็นประโยชน์ เกี่ยวกับดินแดนที่ท่านปกครอง: ท่านสามารถดู [provinces_with_icon|e] ต่าง ๆ ภายใน [country_with_icon|e] ของท่าน รวมถึง [diseases_with_icon|e] ที่ปรากฏอยู่ในโลก หากท่าน [own|e] ทำเล [coastal] [location_with_icon|e] ท่านจะเห็นรายชื่อของ [seazones_with_icon|e] ที่เกี่ยวข้องกับท่าน [maritime_presence_with_icon|e] ที่ท่านมีในเขตนั้น และอันตรายจากเหล่า [pirates_with_icon|e] และ [privateers_with_icon|e]"
 lesson_admin_28c_desc: "[missions_with_icon|e] คือชุดภารกิจที่จะช่วยนำทางว่ามีสิ่งใดบ้าง ที่ท่านสามารถกระทำได้ใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! เกมนี้ช่างกว้างขวางนัก และมีหลายสิ่งให้ต้องเรียนรู้ แต่นั่นคือส่วนหนึ่งของความสำราญ!\n\nท่านเพิ่งเสร็จสิ้นบทนำ #high รูปแบบการเล่นขยายอำนาจ#! @mil! ซึ่งหมายความว่ายามนี้ท่านสามารถเข้าถึง $game_concept_missions$ ที่จะช่วยให้ท่านดำดิ่งลงสู่วิธีการใช้งานแผงควบคุม และกลไกต่าง ๆ ที่เราเพิ่งได้กล่าวถึงไป\n\nเพื่อช่วยให้ท่านก้าวสู่ขั้นถัดไปได้ง่ายขึ้น เราได้เตรียม $game_concept_missions$ บางส่วนไว้เพื่อเป็นการเริ่มต้นให้แก่ท่าน"
 lesson_military_has_mission_active: "เริ่มภารกิจ $PLAYER_PLAYSTYLE_MILITARY$"