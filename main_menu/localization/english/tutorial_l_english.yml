 ############ CORE ############

 lesson_basics_welcome: "@caesar! ขอต้อนรับสู่ #italic ยูโรปา ยูนิเวอร์ซาลิส 5#!"
 lesson_welcome_desc: "ประวัติศาสตร์เกือบห้าศตวรรษกำลังจะคลี่ขยายต่อหน้าท่าน ในฐานะจิตวิญญาณแห่งชาติ ท่านมีอำนาจที่จะเลือกวิถีทางได้ตามประสงค์\n\nท่านอาจพิชิตโลก พัฒนาสังคมให้รุ่งเรืองเป็นแดนอุดมคติ หรือก้าวสู่เป็นมหาอำนาจทางเศรษฐกิจที่ไร้คู่เปรียบ ไม่ว่าท่านจะเลือกสิ่งใด ประวัติศาสตร์ล้วนอยู่ในกำมือท่าน"

 lesson_basics_camera: "@caesar! กล้องและการควบคุม"
 lesson_basics_camera_desc: "ให้เรามาทบทวนพื้นฐานกันครู่หนึ่งก่อนเริ่มต้น สิ่งที่สำคัญที่สุดในเกมคือแผนที่ และการหาเส้นทางไปรอบ ๆ แผนที่นั้นถือเป็นสิ่งจำเป็น\n\nใช้ปุ่ม @key_w!, @key_a!, @key_s!, และ @key_d! เพื่อส่องสำรวจไปรอบแผนที่\n\nใช้ @centerscroll! #high ปุ่มลูกกลิ้งเมาส์#! เพื่อขยายเข้าและออก\n\nการกด @key_tab! ค้างไว้จะทำให้ท่านเห็นภาพรวมของโลกทั้งใบ"

 lesson_basics_nested_tooltips: "@caesar! คำแนะนำประกอบ"
 lesson_basics_nested_tooltips_complete: "@caesar! คำแนะนำประกอบ"
 lesson_basics_nested_tooltips_desc: "แนวคิดในเกมจะถูกเน้นด้วยสีฟ้าและมีข้อมูลเกี่ยวกับกลไก เฉพาะที่ท่านอาจพบเจอภายในเกม ตัวอย่างเช่น เราอาจกล่าวว่าท่านเล่นเป็น [country_with_icon|e]\n\nตามค่าเริ่มต้น ท่านสามารถเข้าถึงคำแนะนำซ้อนได้โดยการรอสักครู่ เพื่อให้มันล็อกไว้ หลังจากนั้นท่านสามารถเลื่อนเมาส์ไปดูคำแนะนำ ด้านในต่อได้ นอกจากนี้ท่านยังล็อกคำแนะนำได้ด้วย @centerclick!#high ปุ่มกลางของเมาส์#!\n\nพฤติกรรมนี้สามารถเปลี่ยนได้ใน #high การตั้งค่า (@key_escape!) > ส่วนติดต่อผู้ใช้ > การตั้งค่าคำแนะนำ#!"
 lesson_basics_tooltips_in_tooltips_hover_word: "เลื่อนเมาส์ไปวางเหนือข้อความสีฟ้า"
 lesson_basics_nested_tooltips_continue: "เลื่อนเมาส์ไปวางเหนือคำแนะนำซ้อน"

 lesson_basics_your_nation: "[country_icon] ชาติของท่าน"
 lesson_basics_your_nation_desc: "ใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! ท่านจะได้สวมบทบาทเป็น #high จิตวิญญาณแห่งชาติ#! ซึ่งเป็นตัวแทนเชิงนามธรรมของ [country_with_icon|e]\n\nปัจจุบันท่านกำลังเล่นเป็น [country_icon] [GetPlayer.GetLongName] อันเป็น [country] ที่มี [GetPlayer.GetGovernment.GetRuler.GetShortName] เป็น [ruler_with_icon|e]"

 lesson_basics_top_bar: "@caesar! แถบด้านบน"
 lesson_basics_top_bar_desc: "#high แถบด้านบน#! ประกอบด้วยองค์ประกอบที่หลากหลาย มันจะคงอยู่ที่ด้านบนของหน้าจอตั้งแต่นี้เป็นต้นไป เพื่อให้ท่านเห็นภาพรวมของ [country_with_icon|e]\n\nท่านอาจสังเกตเห็นว่ามีวันที่อยู่ที่มุมขวาบน ทั้งนี้เพราะตัวเกมดำเนินไปในแบบ #high เวลาจริง#! แต่โปรดอย่ากังวลไป ขณะนี้เราได้หยุดเวลาไว้และไม่มีสิ่งใดเกิดขึ้น"

 lesson_basics_estates: "@caesar! แถบด้านบน"
 lesson_basics_estates_desc: "ส่วนซ้ายสุดของแถบด้านบนจะแสดง [estates_with_icon|e] ของท่าน ซึ่งเป็นกลุ่มขั้วอำนาจภายใน [country_with_icon|e] ในฐานะผู้เล่น ท่านจะถูกแทนด้วย [GetEstateName('crown_estate')]\n\nเราจะกลับมาที่เหล่าฐานันดรในภายหลัง แต่สำหรับตอนนี้ โปรดจำไว้ว่าทุกฐานันดรจะถือครองสัดส่วนความมั่งคั่ง และอำนาจ ของประเทศ และมีระดับ [estate_satisfaction_with_icon|e] ที่ท่านสามารถติดตามได้บนแถบด้านบน\n\nการจัดสรรอำนาจระหว่าง $game_concept_estates$ จะแตกต่างกันไปในแต่ละ $game_concept_country$ โดยที่บาง $game_concept_countries$ อาจเข้าถึง $game_concept_estates$ ที่มีเอกลักษณ์เฉพาะตัว"
 
 lesson_basics_resources: "@caesar! แถบด้านบน"
 lesson_basics_resources_desc: "ลำดับถัดไป ให้เรามาดูทรัพยากรและสถิติต่าง ๆ ในแถบด้านบน นี่คือส่วนกลางของแถบซึ่งประกอบด้วยทรัพยากรที่สำคัญที่สุด ที่ท่านต้องคอยติดตามในขณะปกครอง [country_with_icon|e]\n\nท่านจำเป็นต้องใช้ [gold_with_icon|e] สำหรับการออกคำสั่งหลายอย่างในเกมนี้ ตั้งแต่การจ่ายเบี้ยเลี้ยงทหารไปจนถึงการสร้างเมืองของท่าน แต่ทรัพยากรที่สำคัญที่สุดของท่านคือ [population_with_icon|e] เพราะพวกเขาคือรากฐานของการเมือง เศรษฐกิจ และกองทัพของท่าน\n\nตัวเลขอีกชุดหนึ่งที่สำคัญเป็นพิเศษคือ [stability_with_icon|e] ซึ่งเป็นมาตรวัดความยืดหยุ่นภายในที่จะช่วยให้ท่านรักษา [estates] และ [population] ให้ภักดี และท่านสามารถใช้มันเพื่อใช้อิทธิพลต่อการเมืองใน [country] ของท่าน\n\nเราจะไปดูตัวเลขส่วนที่เหลือเมื่อถึงเวลาที่จำเป็น สำหรับตอนนี้ ให้เราดำเนินการต่อ"

 lesson_basics_time_and_research: "@caesar! เวลา"
 lesson_basics_time_and_research_desc: "#high ยูโรปา ยูนิเวอร์ซาลิส 5#! ดำเนินไปในช่วงเวลาหลายร้อยปี ท่านสามารถดูวันที่ปัจจุบันได้ที่มุมบนขวาของหน้าจอ ซึ่งเป็นจุดที่ท่านใช้ควบคุมความเร็วของเกมด้วยเช่นกัน\n\nเวลาจะถูกแบ่งออกเป็นหก [ages|e] ที่แตกต่างกัน ในขณะนี้เราอยู่ใน [ShowAgeName('age_1_traditions')] ซึ่งจะสิ้นสุดในปี #high 1342#! เพื่อส่งไม้ต่อให้แก่ [ShowAgeName('age_2_renaissance')] ในแต่ละ $game_concept_age$ ท่านจะสามารถเข้าถึง [advances_with_icon|e] ใหม่ ๆ เพื่อทำการวิจัย\n\nดังที่ได้กล่าวไว้ก่อนหน้า ขณะนี้ตัวเกมกำลังหยุดเวลาอยู่ ดังนั้นท่านจะมิพลาดเหตุการณ์ใดไปอย่างแน่นอน"

 lesson_basics_wrap_up_0: "@caesar! แผงควบคุมหลัก"
 lesson_basics_wrap_up_0_desc: "ขอเชิญท่านพิจารณาองค์ประกอบพื้นฐานของส่วนติดต่อผู้ใช้ เริ่มจากแถบที่มุมบนซ้าย มีแผงควบคุม 8 แบบที่เข้าถึงได้จากที่นี่ ซึ่งท่านจะต้องใช้เวลาคลุกคลีกับมันอย่างมาก\n\nประกอบด้วย @government_panel![Link('government', '', 'การปกครอง')], @economy_panel![Link('economy', '', 'เศรษฐกิจ')], @production_panel![Link('production', '', 'การผลิต')], @society_panel![Link('country_culture', '', 'สังคม')], @diplomacy_panel![Link('diplomacy', '', 'การทูต')], @military_panel![Link('unit_overview', '', 'การทหาร')], @geopolitics_panel![Link('expansion', '', 'ภูมิรัฐศาสตร์')] และ @advances_panel![Link('advances', '', 'ความก้าวหน้า')]"

 lesson_basics_wrap_up_2: "@hint! คำแนะนำ"
 lesson_basics_wrap_up_2b: "คำแนะนำ 2b"
 lesson_basics_wrap_up_2_desc: "นอกจากแนวคิดในเกมที่ท่านพบได้ทั่วไปแล้ว กลไกสำคัญบางอย่างจะมีคำแนะนำที่เกี่ยวข้อง ซึ่งจะอธิบายรายละเอียดอย่างถี่ถ้วน พร้อมข้อเสนอแนะต่าง ๆ\n\nท่านสามารถเรียกดูคำแนะนำได้ทุกเมื่อใน @hint![Link('hints', '', 'แผงคำแนะนำ')]\n\n@hint! เมื่อใดก็ตามที่ท่านเห็นไอคอนนี้ ในคำแนะนำประกอบ การกดที่ไอคอนจะนำท่านไปยังคำแนะนำที่เกี่ยวข้อง"
 lesson_basics_open_hints: "เปิดแผงคำแนะนำ"
 lesson_basics_close_hints: "ปิดแผงคำแนะนำ"


 lesson_core_loop_0: "@caesar! บทนำการเล่น"
 lesson_core_loop_0_desc: "#high ยูโรปา ยูนิเวอร์ซาลิส 5#! เป็นเกมที่กว้างขวางซึ่งเปิดโอกาส ให้มีรูปแบบการเล่นและความเป็นไปได้นับไม่ถ้วน\n\nไม่ว่าท่านจะมองตนเองเป็นผู้พิชิตอันโหดเหี้ยม นักการเมืองผู้ชาญฉลาด หรือผู้บริหารที่มีสัมผัสแห่งไมดัส แต่มีพื้นฐานบางประการที่ผู้ปกครอง ที่ประสบความสำเร็จทุกคนจำต้องเชี่ยวชาญ ให้เราไปพิจารณาสิ่งเหล่านั้นกันเถิด!" 

 lesson_core_loop_1: "[gold_icon] งบดุล"
 lesson_core_loop_1_desc: "ดังที่เราได้กล่าวไป [gold_with_icon|e] คือหนึ่งในทรัพยากรที่สำคัญที่สุดในเกม การออกคำสั่งส่วนใหญ่ล้วนต้องใช้ [gold] และบ่อยครั้งที่ความสามารถในการบังคับใช้ เจตจำนงของท่านในฐานะผู้ปกครอง ทั้งภายนอกและภายใน [country_with_icon|e] จะขึ้นอยู่กับความมั่งคั่งที่ท่านสามารถรวบรวมมาไว้ในมือ เส้นทางสู่การครองโลกนั้นถูกปูด้วยทองคำและโลหิต\n\nการเงินส่วนใหญ่ของท่านจะถูกควบคุมจาก [Link('economy', '', '@economy_panel! แผงงบดุล')] ดังนั้นให้เราพิจารณามันอย่างใกล้ชิด" 
 lesson_core_loop_open_balance: "เปิดแผงงบดุล"

 lesson_core_loop_2: "[gold_icon] งบดุล"
 lesson_core_loop_2_desc: "ที่นี่ท่านจะพบภาพรวมของ [budget_with_icon|e] ส่วนต่างระหว่าง [income_with_icon|e] และ [expenses_with_icon|e] ของท่านจะถูกนำไปเพิ่มใน [treasury_with_icon|e] เมื่อสิ้นสุดในทุก ๆ เดือน ท่านสามารถปรับเปลี่ยนแถบเลื่อนต่าง ๆ ในแผงนี้เพื่อแก้ไข [balance] รายเดือนของท่าน\n\nดังที่เพิ่งได้เห็นไป ส่วนต่างระหว่างรายรับและรายจ่ายรายเดือนจะแสดงอยู่ที่ #high แถบด้านบน#! ด้วยเช่นกัน" 

 lesson_core_loop_3: "[taxes_icon] ภาษี"
 lesson_core_loop_3_desc: "ความมั่งคั่งส่วนใหญ่ใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! จะถูกสร้างขึ้นเป็นรายเดือนในดินแดนที่ท่านถือครอง นั่นคือ [locations_with_icon|e] ของท่าน\n\nเราจะพูดถึงทำเลในภายหลัง สำหรับตอนนี้ท่านสามารถเลื่อนเมาส์ไปวางเหนือตัวเลข [tax_base_with_icon|e] ที่มุมบนซ้ายเพื่อดูการแจกแจง รายละเอียดของทำเลที่มั่งคั่งที่สุดของท่าน นั่นคือจุดที่ [gold_with_icon|e] กำลังถูกสร้างขึ้นใน [country_icon] [Player.GetLongName]" 

 lesson_core_loop_4: "[taxes_icon] ภาษี"
 lesson_core_loop_4_desc: "อย่างไรก็ตาม [gold_with_icon|e] เหล่านั้นมิได้ไหลเข้าสู่ [treasury_with_icon|e] ของท่านโดยตรง ในฐานะรัฐบาล ท่านจะเก็บเกี่ยวผลประโยชน์เพียงส่วนเสี้ยวของ [tax_base_with_icon|e] โดยการเรียกเก็บ [taxes_with_icon|e] จากเหล่า [estates_with_icon|e] ของท่าน\n\nท่านสามารถกำหนดระดับการเก็บภาษีได้ โดยการปรับแถบเลื่อนภาษีในแผงงบประมาณ โปรดสังเกตว่า [estate_satisfaction_with_icon|e] ของพวกเขาจะลดลงยิ่งท่านเก็บภาษีมากขึ้น เหล่าฐานันดรมิใคร่ชอบใจในการเสียภาษีนัก\n\n[maximum_tax_with_icon|e] ที่ท่านสามารถกำหนดให้แต่ละฐานันดร ขึ้นอยู่กับปัจจัยหลายประการ เช่น อำนาจที่พวกเขามี บางครั้งท่านอาจมิสามารถเก็บภาษีจากฐานันดรเฉพาะบางกลุ่มได้เลย\n\nสำหรับตอนนี้ เราขอแนะนำให้ท่านตั้งค่าภาษีอัตโนมัติโดยการคลิกที่ไอคอน #W เฟือง#! @automation! ซึ่งจะเก็บภาษีในจำนวนที่เหมาะสม เพื่อรักษาความพึงพอใจของพวกเขาให้สูงกว่า #G 50%#! [estate_satisfaction_icon] ทันทีที่ท่านเริ่มเดินเวลาเกม" 
 lesson_core_loop_automate_taxes: "เก็บภาษีอัตโนมัติสำหรับทุกฐานันดร"

 lesson_core_loop_5: "[income_icon] รายรับรายเดือน"
 lesson_core_loop_5_desc: "นอกเหนือจาก [taxes_with_icon|e] อีกหนึ่งแหล่งที่มาสำคัญของ [income_with_icon|e] คือ [minting_with_icon|e] ท่านสามารถกษาปณ์เหรียญ ได้ตามใจปรารถนาเพื่อแก้ไขงบประมาณ แต่การกษาปณ์มากเกินไปจะทำให้เกิด [inflation_with_icon|e]\n\nท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [inflation] ได้ใน [Link('hints', 'selected_hint = hint_inflation', '@hint! คำแนะนำเกี่ยวกับภาวะเงินเฟ้อ')]" 
 lesson_core_loop_minting: "เลื่อนแถบการกษาปณ์เพื่อผลิตเหรียญดัคเกิตอันเงางาม"
 lesson_core_loop_inflation: "ตรวจสอบให้แน่ใจว่าท่านมิได้ก่อให้เกิดภาวะเงินเฟ้อ"

 lesson_core_loop_6: "[income_icon] รายรับรายเดือน"
 lesson_core_loop_6_desc: "แหล่งที่มาของ [income_with_icon|e] อีกสองแห่งที่พบได้บ่อยที่สุดคือ [trade_with_icon|e] และ [food_with_icon|e] เนื่องจากสิ่งเหล่านี้เป็นแนวคิดที่ซับซ้อนกว่า เราจะยังไม่กล่าวถึงในตอนนี้ ท่านสามารถเรียนรู้เกี่ยวกับสิ่งเหล่านี้ได้ เมื่อท่านพร้อมในคำแนะนำที่เกี่ยวข้อง:\n\n$TAB$[Link('hints', 'selected_hint = hint_trade', '@hint! คำแนะนำเกี่ยวกับการค้า')]\n$TAB$[Link('hints', 'selected_hint = hint_food', '@hint! คำแนะนำเกี่ยวกับเสบียง')]"


 lesson_core_loop_7: "@caesar! เริ่มเดินเวลา"
 lesson_core_loop_7_desc: "ให้เราเริ่มเดินเวลาสักครู่ก่อนจะไปดูในส่วนของ [expenses_with_icon|e]\n\nท่านสามารถปรับ #high ความเร็ว#! ที่เกมดำเนินไปได้จาก #high แถบด้านบน#! ความเร็วระดับ #high 3#! หรือ #high 4#! เป็นจังหวะที่ดีสำหรับการเริ่มต้น แต่ผู้เล่นแต่ละคนล้วนมีความชอบที่แตกต่างกันไป\n\nท่านยังสามารถกด @key_space! เพื่อ #high หยุด#! และ #high เริ่มเดินเวลา#! เกมได้ทุกเมื่อที่ต้องการ"
 lesson_core_loop_unpause_month: "เริ่มเดินเวลาและปล่อยให้เวลาผ่านไป หนึ่งเดือนเพื่อดูตัวเลขที่อัปเดต"

 lesson_core_loop_7b: "@caesar! เริ่มเดินเวลา"
 lesson_core_loop_7b_desc: "ยอดเยี่ยม! เวลาผ่านไปหนึ่งเดือนแล้ว และเราได้ #high หยุด#! เกมไว้ให้ท่าน\n\nท่านจะเห็นว่าตัวเลขต่าง ๆ ได้รับการอัปเดตแล้ว และเหล่า [estates_with_icon|e] ของท่านกำลังจ่าย [taxes_with_icon|e] ตามหน้าที่ การคำนวณหลายอย่างในเกมนี้ จะเกิดขึ้นเมื่อสิ้นสุดเดือน\n\nให้เรามาพิจารณา [expenses_with_icon|e] กันในตอนนี้"

 lesson_core_loop_8: "[expenses_icon] รายจ่ายรายเดือน"
 lesson_core_loop_8_desc: "การออกคำสั่งหลายอย่างในเกมต้องใช้ [gold_with_icon|e] ในทันทีที่ท่านสั่งการ แต่แม้ในยามที่ท่านมิได้ใช้จ่าย [gold] อย่างแข็งขัน [budget_with_icon|e] ของท่านก็ยังต้องแบกรับภาระของ [expenses_with_icon|e] รายเดือนตามปกติ\n\nท่านสามารถจ่าย [gold] เพื่อเพิ่ม [stability_with_icon|e] และ [legitimacy_with_icon|e] ซึ่งเป็นค่าสถิติสำคัญสองประการที่เราเห็นบน #high แถบด้านบน#! เราขอแนะนำให้ท่านจ่ายอย่างน้อย ให้เพียงพอเพื่อมิให้ค่าเหล่านี้ลดลง\n\nค่า [maintenance_with_icon|e] ของ [armies_with_icon|e] ประจำการ, [navies_with_icon|e] และ [fortifications_with_icon|e] ที่เปิดใช้งานอยู่อาจกลายเป็นอุปสรรคสำคัญต่อ [budget] ของท่าน การลด [maintenance] ในยามสงบถือเป็นความคิดที่สมเหตุสมผล" 
 lesson_core_loop_positive_income: "ปรับแถบเลื่อนงบประมาณเพื่อให้มีงบดุลรายเดือนเป็นบวก"
 

 lesson_core_loop_9: "[budget_icon] สรุปงบประมาณ"
 lesson_core_loop_9_desc: "ยอดเยี่ยมยิ่งนัก! ท่านได้เข้าใจพื้นฐานการจัดการ [budget_with_icon|e] แล้ว ให้เรามาสรุปกันสักเล็กน้อย:\n\n$BULLET$[income_with_icon|e] และ [expenses_with_icon|e] จะถูกคำนวณเมื่อสิ้นสุดเดือน\n\n$BULLET$[gold_with_icon|e] จะถูกสร้างขึ้นใน [locations_with_icon|e] ของท่าน และถูกจัดเก็บโดย [estates] ซึ่งท่านจะเก็บ [tax_with_icon|e] เพื่อนำไปเติมใน [treasury_with_icon|e]\n\n$BULLET$[estates_with_icon|e] มิได้ชื่นชอบการถูกเก็บภาษีเป็นพิเศษ\n\n\nแต่ [estates] เหล่านี้คือใครกันแน่ ข้าแว่วเสียงท่านถามเช่นนั้น และเหตุใดพวกมันจึงมิยอมสยบต่อทุกความปรารถนาของท่าน?" 

 lesson_estates_1: "[estates_icon] ส่วนกลางและเหล่าฐานันดร"
 lesson_estates_1_desc: "เหล่า [estates_with_icon|e] คือหนึ่งในเสาหลักของการปกครองใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! พวกมันมิได้เป็นเพียงแหล่งที่มาของ [taxes_with_icon|e] เท่านั้น แต่ยังสามารถเป็นขุมกำลังอันทรงพลังเมื่อมีความจงรักภักดี หรือเป็นศัตรูที่น่าสะพรึงกลัวเมื่อไร้ซึ่งความภักดี\n\nให้เรามาพิจารณาพวกมันอย่างใกล้ชิดใน @government_panel![Link('government', 'tabcontent = estates', 'หน้าต่างฐานันดร')]"

 lesson_estates_2: "[crown_power_icon] ส่วนกลาง"
 lesson_estates_2_desc: "ที่นี่ท่านจะเห็นกลุ่มต่าง ๆ ที่ถือครอง [political_power] ใน [country_with_icon|e] ของท่าน ซึ่งก็คือเหล่า [estates_with_icon|e] โดยที่แต่ละ [estate] จะมีสัดส่วนของ [estate_power_with_icon|e] ในฐานะตัวแทนของชาติ ท่านจะถูกแทนด้วย [GetEstateName('crown_estate')]\n\n[crown_power_with_icon|e] ของท่านแสดงถึงความสามารถในการต่อต้าน ผลประโยชน์เฉพาะส่วนของเหล่าฐานันดร กล่าวคือ มันช่วยให้ท่านเรียกเก็บ [taxes_with_icon|e] ได้สูงขึ้น ทั้งยังเพิ่ม [estate_satisfaction_with_icon|e] และแรงสนับสนุนใน [parliament_with_icon|e] ทำให้การเปลี่ยน [laws_with_icon|e] ง่ายขึ้น และมอบส่วนแบ่งกำไรจาก [trade_with_icon|e]\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับอำนาจส่วนกลางได้ใน [Link('hints', 'selected_hint = hint_crown_power', 'คำแนะนำเกี่ยวกับอำนาจส่วนกลาง')]"

 lesson_estates_3: "[estates_icon] เหล่าฐานันดร"
 lesson_estates_3_desc: "เหล่า [estates_with_icon|e] ของท่านสามารถเป็นขุมกำลัง ที่ทรงคุณค่าหากจัดการอย่างถูกต้อง แต่หากพวกมันมิพอใจ ก็อาจกลายเป็นหนามยอกอกที่แสนอันตรายได้อย่างรวดเร็ว\n\nนอกจากการส่งส่วยให้แก่เงินคลังของท่านด้วย [taxes_with_icon|e] แล้ว เหล่า [estates] ยังมีความสำคัญยิ่งต่อกิจการแห่ง [war_with_icon|e] เนื่องจากท่านจำต้องพึ่งพา [levies_with_icon|e] ของพวกมันในการทำศึกสงคราม จนกว่าท่านจะมีกำลังทรัพย์พอที่จะแทนที่พวกมันด้วย [regular_regiments_with_icon|e]\n\nอย่างไรก็ตาม หากพวกมันไร้ซึ่งความภักดี พวกมันอาจเริ่มสนับสนุน [rebellions_with_icon|e] เพื่อต่อต้านอำนาจของท่าน และอาจโค่นล้มการปกครองของท่านผ่าน [civil_war_with_icon|e]\n\nท้ายที่สุด ฐานันดรที่มีความพึงพอใจสูงกว่า #G 50%#! [estate_satisfaction_icon] จะมอบโบนัสที่หลากหลายให้แก่ [country_with_icon|e] ของท่านตามประเภทของพวกมัน ในขณะที่ฐานันดรที่มิพอใจจะสร้างบทลงโทษแทน"

 lesson_estates_4: "[privileges_icon] เอกสิทธิ์"
 lesson_estates_4_desc: "[estates] สามารถได้รับมอบ [privileges_with_icon|e] ซึ่งโดยปกติแล้วจะเพิ่มทั้ง [estate_satisfaction_with_icon|e] และ [estate_power_with_icon|e] อีกทั้งยังมาพร้อมกับผลลัพธ์เพิ่มเติม สำหรับประเทศและประชากรของท่าน\n\nการเพิกถอนเอกสิทธิ์จะทั้งสร้างความโกรธเคือง และทำให้อ่อนแอลงแก่ฐานันดรเป้าหมาย แม้ว่านั่นจะเป็นความพยายาม ที่ต้องแลกมาด้วยราคาแพงซึ่งอาจทำลาย [stability_with_icon|e] ของท่านได้\n\nแม้ว่าพวกมันจะเพิ่มอำนาจ ให้แก่เหล่าฐานันดร (และส่งผลให้ [crown_power_with_icon|e] ของท่านลดลง) แต่เอกสิทธิ์บางอย่างอาจสอดคล้องกับผลประโยชน์ของท่าน การมอบเอกสิทธิ์บางประการในยามคับขัน อาจเป็นวิถีทางที่ชาญฉลาด เพื่อเพียงมอดดับเปลวเพลิงแห่ง [rebellion_with_icon|e] หามีกษัตริย์องค์ใดปกครองได้โดยลำพังไม่"

 lesson_estates_5: "[pop_type_icon|e] ชนชั้นทางสังคม"
 lesson_estates_5_desc: "นอกเหนือจาก [privileges] แล้ว เหล่า [estates_with_icon|e] จะได้รับ [estate_power_with_icon|e] หลัก ๆ มาจากโครงสร้างทางสังคมของ [population_with_icon|e]\n\n[population] ของท่านถูกแบ่งออกเป็น [pop_types_with_icon|e] ที่แตกต่างกัน ซึ่งแต่ละประเภท จะสนับสนุนฐานันดรที่ต่างกันไป:\n\n$BULLET_WITH_TAB$[GetEstateName('nobles_estate')] ได้รับการสนับสนุนโดย @nobles! [ShowPopTypeName('nobles')]\n$BULLET_WITH_TAB$[GetEstateName('clergy_estate')] ได้รับการสนับสนุนโดย @clergy! [ShowPopTypeName('clergy')]\n$BULLET_WITH_TAB$[GetEstateName('burghers_estate')] ได้รับการสนับสนุนโดย @burghers! [ShowPopTypeName('burghers')]\n$BULLET_WITH_TAB$[GetEstateName('peasants_estate')] ได้รับการสนับสนุนโดย:\n$TAB$$BULLET_WITH_TAB$@peasants! [ShowPopTypeName('peasants')], @laborers! [ShowPopTypeName('laborers')] และ @soldiers! [ShowPopTypeName('soldiers')]\n\n[population] ของท่านดำรงชีวิตและล้มตายใน [locations_with_icon|e] ของท่าน ซึ่งก็คือบนแผนที่นั่นเอง ให้เรามาพิจารณาสิ่งเหล่านั้นกันเถิด"

 lesson_map_1: "[known_world_icon] แผนที่"
 lesson_map_1_desc: "โลกแห่ง #high ยูโรปา ยูนิเวอร์ซาลิส 5#! ประกอบขึ้นจาก [countries_with_icon|e] ต่าง ๆ ที่ถือครอง [locations_with_icon|e] บนแผนที่ อันเป็นแหล่งที่พวกมันสกัดทรัพยากร และกำลังพลที่จำเป็นเพื่อให้อยู่เหนือเพื่อนบ้าน\n\nหากท่านขยายภาพออก ท่านจะเห็นชื่อ [country] ปรากฏบนแผนที่ การเลื่อนเมาส์ไปวางเหนือชื่อเหล่านั้นจะแสดงคำแนะนำประกอบของ [country] และการคลิกจะเปิด #high แผงควบคุมประเทศต่างแดน#! ซึ่งท่านสามารถเรียนรู้และสร้างปฏิสัมพันธ์กับ [country] นั้นได้"
 lesson_trigger_zoom_out: "@centerscroll! ขยายภาพออกเพื่อดูประเทศต่าง ๆ"
 lesson_trigger_foreign_country: "เปิดแผงควบคุมประเทศโดยการ @leftclick!#high คลิกซ้าย#! บนประเทศต่างแดน" 

 lesson_map_2: "[known_world_icon] แผนที่"
 lesson_map_2_desc: "[countries_with_icon|e] นั้นหามีค่าไม่หากไร้ซึ่ง [locations_with_icon|e] เพราะ [locations] คือหัวใจของเศรษฐกิจและการเมืองของทุก [country] ใน #high ยูโรปา ยูนิเวอร์ซาลิส 5#! พวกมันผลิต [goods_with_icon|e] และสร้าง [tax_base_with_icon|e] อีกทั้งยังเป็นบ้านของ [population_with_icon|e] ที่มี [pop_types_with_icon|e], [religions_with_icon|e] และ [cultures_with_icon|e] ที่หลากหลาย\n\n[locations] สามารถมี [location_rank_with_icon|e] ได้ 3 ระดับ:\n$BULLET_WITH_TAB$@city! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement! [ShowLocationRankName('rural_settlement')]\n\nลำดับศักดิ์ทำเลที่ต่างกันจะมี [pop_types], [buildings_with_icon|e] และตัวผันแปรที่ต่างกันไป"

 lesson_map_3: "[known_world_icon] แผนที่"
 lesson_map_3_desc: "[location_with_icon|e] ที่สำคัญที่สุดสำหรับทุก [country_with_icon|e] คือ [capital_with_icon|e] เมืองหลวงของท่านคือ [Player.GetCapital.GetName] ท่านจะจำมันได้บนแผนที่จากรูปดาวสีทองภายในไอคอน [location_rank|e] ของมัน (@city_capital!/@town_capital!/@rural_settlement_capital!)\n\n$BULLET$ท่านสามารถ @leftclick!#high ดับเบิลคลิก#! ที่ธงของท่านบน #high แถบด้านบน#! เพื่อเคลื่อนกล้องไปยังเมืองหลวงของท่าน\n\n$BULLET$ท่านยังสามารถค้นหา [location] ใด ๆ ได้โดยการกด @key_f! เพื่อเปิด [Link('find_location', '', '@finder_panel! เครื่องมือค้นหา')] และพิมพ์ชื่อลงไป"
 lesson_trigger_zoom_in: " @centerscroll! ขยายภาพเข้าเพื่อดู [locations]"
 lesson_trigger_capital: "@leftclick!#high คลิก#! ที่เมืองหลวงของท่าน [Player.GetCapital.GetNameWithNoTooltip]"

 lesson_control_groups_1: "@caesar! กลุ่มควบคุม"
 lesson_control_groups_1_desc: "ก่อนที่จะพิจารณา [location_icon] [Player.GetCapital.GetName] ให้เราหยุดครู่หนึ่งเพื่อดู #high กลุ่มควบคุม#! สิ่งเหล่านี้อยู่ที่ด้านล่างของหน้าจอ และทำหน้าที่เป็นทางลัดในการเข้าถึงสิ่งต่าง ๆ ในโลกของเกมได้อย่างรวดเร็ว\n\nท่านสามารถกำหนด [locations_with_icon|e], [countries_with_icon|e], [markets_with_icon|e], [armies_with_icon|e] และอื่น ๆ ให้กับปุ่มหมายเลขเฉพาะได้ ให้เราลองทำโดยการกำหนดเมืองหลวงของท่าน [Player.GetCapital.GetName]\n\nเมื่อเปิดแผงควบคุมของ [Player.GetCapital.GetNameWithNoTooltip] แล้ว ให้กด #high CTRL+1#! เพื่อกำหนดให้เป็นกลุ่มควบคุมใหม่"
 lesson_basics_click_map: "@leftclick!#high คลิก#! ที่ [Player.GetCapital.GetNameWithNoTooltip]"
 lesson_basics_assign_control_group: "กด #high CTRL+1#! เพื่อกำหนดให้เป็นกลุ่มควบคุม"

 lesson_control_groups_2: "@caesar! กลุ่มควบคุม"
 lesson_control_groups_2_desc: "ยอดเยี่ยม! บัดนี้การกดหมายเลขที่กำหนดไว้จะเคลื่อนกล้องไปยัง [location_icon] [Player.GetCapital.GetName] และเปิดแผงควบคุมขึ้นมา\n\nหากต้องการล้างกลุ่มควบคุม ท่านสามารถ @rightclick!#high คลิกขวา#! หรือกด #high CTRL#! พร้อมกับหมายเลขที่สอดคล้องกัน"


 lesson_location_1: "[location_icon] ทำเล"
 lesson_location_1_desc: "ให้เรามาดู #high แผงทำเล#! กันในตอนนี้:\n\n[location_with_icon|e] ใด ๆ ล้วนมีประชากรประกอบด้วย [pop_types_with_icon|e] ที่หลากหลาย ดังที่เราเพิ่งได้เห็นไป [pops_with_icon|e] จะเพิ่ม [estate_power_with_icon|e] ให้แก่ [estate_with_icon|e] ที่เกี่ยวข้อง\n\nจำนวนของ [pops] ในแต่ละประเภทประชากรขึ้นอยู่กับ [buildings_with_icon|e] ที่มีอยู่ใน [location] เป็นหลัก สิ่งปลูกสร้างสามารถสร้างขึ้นได้โดยท่าน หรือเหล่าฐานันดรของท่าน และจำเป็นต้องจ้างงาน [pop_type] เฉพาะเพื่อให้สามารถทำงานได้ เมื่อมีการสร้างสิ่งปลูกสร้าง เหล่า @peasants! [ShowPopTypeName('peasants')] จะ [promote_with_icon|e] ไปสู่ [pop_type] ที่จำเป็นเพื่อเติมเต็มตำแหน่งงานเหล่านั้น\n\nสิ่งปลูกสร้างบางแห่งจะผลิต [goods_with_icon|e] ซึ่งเมื่อนำไปขายใน [market_with_icon|e] จะสร้าง [wealth_with_icon|e] ให้แก่ [location]"

 lesson_location_2: "[rgo_icon] RGO"
 lesson_location_2_desc: "มิใช่ทุก [locations_with_icon|e] ที่จะมี [buildings_with_icon|e] ในช่วงเริ่มต้นเกม แต่ทว่าทุก [location] จะมีความเชี่ยวชาญในการผลิต [good_with_icon|e] เฉพาะอย่างหนึ่งใน #high [resource_gathering_operations]#! หรือ [rgo_with_icon|e] ของทำเลนั้น ๆ ซึ่งนั่นคือสิ่งปลูกสร้างประเภทพิเศษที่จ้างงาน @laborers! [ShowPopTypeName('laborers')] เพื่อผลิต [raw_materials_with_icon|e]\n\nเช่นเดียวกับ [buildings] เหล่า [rgo] จะขาย [goods] ของพวกมันใน [market_with_icon|e] ของ [location] เพื่อสร้าง [tax_base_with_icon|e] ในช่วงเริ่มต้นเกม [tax_base] ส่วนใหญ่ของท่านจะมาจากผลผลิตของ [rgo] ของท่าน\n\n@hint! ท่านสามารถเรียนรู้เกี่ยวกับ [markets] ได้ที่นี่: [Link('hints', 'selected_hint = hint_markets', 'คำแนะนำเกี่ยวกับตลาด')]"

 lesson_location_3: "[wealth_icon] ความมั่งคั่งของทำเล"
 lesson_location_3b: "[wealth_icon] ความมั่งคั่งของทำเล"
 lesson_location_3_desc: "ดังที่ได้เห็นไป ผลกำไรที่เพิ่มขึ้นของ [buildings_with_icon|e] และ [rgo_with_icon|e] ประกอบกันเป็น [wealth_with_icon|e] ของ [location_with_icon|e] จากนั้น [wealth] จะถูกจัดเก็บโดยเหล่า [estates_with_icon|e] ตามการปรากฏอยู่ของพวกมันใน [location]\n\nโปรดจำไว้ว่าในท้ายที่สุดท่านจะได้รับเพียงเศษเสี้ยวของ [gold_with_icon|e] เหล่านั้นในรูปแบบของ [taxes_with_icon|e]\n\n#weak ตัวอย่างเช่น ความมั่งคั่งรวมใน [location_icon] [Player.GetCapital.GetName] มีจำนวนถึง [Player.GetCapital.GetTotalPossibleTaxBase|2W] [tax_base_icon] ซึ่งท่านได้เรียกเก็บภาษีเป็นจำนวน [Player.GetCapital.GetTotalIncome|2g][gold_icon] จากเหล่า [estates] ของท่าน#!"
 lesson_basics_hover_tax_base: "เลื่อนเมาส์วางเหนือความมั่งคั่ง เพื่อดูการจัดสรรในหมู่ฐานันดร"

 lesson_location_3_recap: "@caesar! ให้เรามาสรุปกันเถิด!"
 lesson_location_3_recap_desc: "[buildings_with_icon|e] และ [rgo_with_icon|e] ใน [locations_with_icon|e] ของท่าน จ้างงาน [pops_with_icon|e] เพื่อสร้าง [wealth_with_icon|e] โดยที่ [wealth] จะถูกแบ่งสรรในหมู่ [estates_with_icon|e] ซึ่งจะมอบ [taxes_with_icon|e] และ [levies_with_icon|e] ให้แก่ท่านเป็นการตอบแทน"

 lesson_location_4: "[control_icon] อำนาจปกครอง"
 lesson_location_4_desc: "ทว่ามิใช่ทุก [locations_with_icon|e] จะเท่าเทียมกันภายใต้ดวงตะวัน ให้เรามาสนทนาถึงหนึ่งในค่าสถิติที่สำคัญที่สุดของ [location] นั่นคือ [control_with_icon|e]\n\n[control] แสดงถึงขอบเขตอำนาจของรัฐบาลส่วนกลางใน [location] และเหนือสิ่งอื่นใด อำนาจปกครองเป็นตัวกำหนด [tax_base_with_icon|e] ของทำเล ซึ่งก็คือส่วนแบ่งของ [wealth_with_icon|e] ที่จะได้รับผลจาก [taxes_with_icon|e] ของท่าน ความมั่งคั่งใดที่อยู่นอกเหนือขอบเขตอำนาจปกครองของท่าน จะตกสู่กระเป๋าของ [estates_with_icon|e] โดยตรงและปลอดจาก [taxes] ทั้งปวง\n\n#weak เนื่องด้วยท่านมี [control] #W 100%#! ใน [capital] ของท่าน [wealth] ทั้งหมด #W 100%#! จึงถูกนับเป็นฐานภาษี ทำให้ไม่มีภาษีสูญเปล่าไป#!"

 lesson_location_5: "[proximity_icon] ค่าความใกล้ชิด"
 lesson_location_5_desc: "[control_with_icon|e] ของ [location_with_icon|e] ขึ้นอยู่กับ [proximity_with_icon|e] ที่มีต่อ [capital_with_icon|e] ของท่านโดยตรง\n\nนั่นคือเหตุผลที่ [capital] เป็นหนึ่งใน [locations] ที่สำคัญที่สุดของท่าน เพราะมันจะมี [control] ที่สูงอยู่เสมอ ซึ่งหมายความว่า [buildings_with_icon|e] และ [rgo_with_icon|e] ในเมืองหลวงของท่านจะสร้าง [income_with_icon|e] ให้แก่ท่านได้มากที่สุดเสมอ\n\n@hint! ท่านสามารถเรียนรู้เพิ่มเติมเกี่ยวกับ [proximity] และ [control] ได้ที่นี่: [Link('hints', 'selected_hint = hint_control', 'คำแนะนำเกี่ยวกับค่าความใกล้ชิด และอำนาจปกครอง')]"


 lesson_mapmodes_1: "@mapmode! โหมดแผนที่"
 lesson_mapmodes_1_desc: "ในยามนี้ ให้เรามาดู #high โหมดแผนที่#! กันเถิด สิ่งเหล่านี้คือมุมมองที่แตกต่างกัน ซึ่งช่วยให้ท่านเห็นแง่มุมต่าง ๆ ของโลกที่ปรากฏบนแผนที่\n\nหากท่านเลื่อนเมาส์ไปวางเหนือคำแนะนำประกอบ [control_with_icon|e] ในแผงทำเล ท่านจะเห็นปุ่มโหมดแผนที่ที่มุมขวาบนของคำแนะนำประกอบ เมื่อท่าน @leftclick!#high คลิก#! ปุ่มดังกล่าว โหมดแผนที่จะเปลี่ยนไปเพื่อแสดง [control] ใน [locations_with_icon|e] ทั้งหมดของท่าน"
 lesson_basics_control_mapmode: "เลื่อนเมาส์วางเหนือคำแนะนำประกอบอำนาจปกครอง"
 lesson_basics_control_mapmode_2: "@leftclick!#high คลิก#! ที่ปุ่มโหมดแผนที่บนส่วนหัวคำแนะนำประกอบ เพื่อเปิดใช้งานโหมดแผนที่อำนาจปกครอง"

 lesson_mapmodes_1b: "@mapmode! โหมดแผนที่"
 lesson_mapmodes_1c: "@mapmode! โหมดแผนที่"
 lesson_mapmodes_1b_desc: "ยามนี้ท่านกำลังเห็นการกระจายตัวของ [control_with_icon|e] ทั่วดินแดนของท่านบนแผนที่ โปรดสังเกตว่า [control] มีแนวโน้มที่จะลดลง เมื่อ [locations_with_icon|e] อยู่ห่างจาก [capital_with_icon|e] มากขึ้น เนื่องด้วยปัจจัยด้านอำนาจปกครองนี้เอง [locations] ในพื้นที่ชายขอบของท่านจึงมิอาจ สร้างประโยชน์ได้เทียบเท่าทำเลอื่น เว้นแต่จะมีการวางโครงสร้างพื้นฐานที่เหมาะสม\n\nในขณะที่อยู่ในโหมดแผนที่นี้ ท่านยังสามารถ @leftclick!#high คลิก#! บน [countries_with_icon|e] อื่น ๆ เพื่อดู [control] ของพวกเขาที่แสดงบนแผนที่ได้เช่นกัน"

 lesson_mapmodes_2: "@mapmode! โหมดแผนที่"
 lesson_mapmodes_2a: "@mapmode! โหมดแผนที่"
 lesson_mapmodes_2_desc: "คราวนี้ให้เรามาดูโหมดแผนที่ [proximity_with_icon|e] ท่านสามารถเข้าถึงได้ จากคำแนะนำประกอบค่าความใกล้ชิด เช่นเดียวกับที่ท่านทำกับ [control_with_icon|e]"
 lesson_basics_proximity_mapmode: "เลื่อนเมาส์วางเหนือคำแนะนำประกอบค่าความใกล้ชิด"
 lesson_basics_proximity_mapmode_2: "@leftclick!#high คลิก#! ที่ปุ่มโหมดแผนที่บนส่วนหัวคำแนะนำประกอบ เพื่อเปิดใช้งานโหมดแผนที่ค่าความใกล้ชิด"

 lesson_mapmodes_2b: "@mapmode! โหมดแผนที่"
 lesson_mapmodes_2b_desc: "โหมดแผนที่ [proximity_with_icon|e] แสดงให้เห็นว่า [locations_with_icon|e] อยู่ห่างจาก [capital_with_icon|e] ของท่านเพียงใดในทางปฏิบัติ\n\nท่านอาจสังเกตได้ว่า [proximity] แผ่ขยายไปได้ไกลขึ้นตามทุ่งราบ และแม่น้ำ ทว่ากลับถูกขัดขวางอย่างหนักโดยเทือกเขาหรือผืนป่า แท้จริงแล้ว [topography_with_icon|e] และ [vegetation_with_icon|e] มีบทบาทสำคัญยิ่งในการคำนวณ [proximity] เช่นเดียวกับการมีอยู่ของโครงสร้างพื้นฐานที่สร้างโดยมนุษย์ อาทิ [roads_with_icon|e] หรือ [ports_with_icon|e]\n\nการ @leftclick!#high คลิก#! บน [locations_with_icon|e] ต่าง ๆ ในขณะที่อยู่ในโหมดแผนที่นี้ จะแสดงเส้นทางที่ทำเลเหล่านั้นใช้เพื่อเข้าถึงเมืองหลวง"

 lesson_basics_map_modes: "@mapmode! โหมดแผนที่"
 lesson_basics_map_modes_complete: "@mapmode! โหมดแผนที่"
 lesson_basics_map_modes_desc: "มี #high โหมดแผนที่#! ที่แตกต่างกันนับสิบในเกมนี้ ซึ่งสามารถใช้เพื่อแสดงข้อมูลได้ทุกประเภท\n\nตัวอย่างเช่น ท่านอาจสนใจใคร่รู้เกี่ยวกับ [markets_with_icon|e] ต่าง ๆ ทั่วโลก หรือการกระจายตัวของ [population_with_icon|e] ภายใน [country_with_icon|e] ของท่าน\n\nท่านสามารถเข้าถึง #high โหมดแผนที่#! ทั้งหมดได้โดยการเลื่อนเมาส์ไปวาง เหนือวิดเจ็ตที่ด้านล่างของหน้าจอ และเลือกโหมดแผนที่ที่ต้องการ เชิญท่านสำรวจได้ตามอัธยาศัย ทว่ามิสมควรต้องเร่งรีบทำความคุ้นเคย กับมันทั้งหมดในคราเดียว\n\nอย่าลืมกลับไปยังโหมดแผนที่เริ่มต้นด้วยการกด #high Ctrl+Q#! หรือเลือกจากแผงโหมดแผนที่"
 lesson_basics_open_map_mode_widget: "เปิดแผงโหมดแผนที่ (ที่เน้นไว้)" 
 lesson_basics_return_map_mode_widget: "กลับสู่โหมดแผนที่ภูมิประเทศเริ่มต้น (#high Ctrl+Q#!)"

 lesson_road: "[road_icon] ถนน"
 lesson_road_desc: "ดังที่เราได้กล่าวไปว่าท่านจำเป็นต้องมี [proximity_with_icon|e] เพื่อให้ได้มาซึ่ง [control_with_icon|e] แต่ท่านจะปรับปรุง [proximity] ของท่านได้อย่างไร?\n\nมีหลากหลายวิธีในการทำเช่นนั้น แต่วิธีหนึ่งที่สำคัญที่สุดคือการสร้าง [roads_with_icon|e] โดยที่ [roads] จะช่วยปรับปรุงการเชื่อมต่อระหว่าง [locations_with_icon|e] สองแห่ง ซึ่งจะช่วยลดค่าความใกล้ชิดที่สูญเสียไป สำหรับทุกทำเลที่ใช้เส้นทางนั้นเพื่อเข้าถึง [capital_with_icon|e]\n\nให้เรามาสร้าง [road] จาก [location_icon] [Player.GetCapital.GetName] โปรดสังเกตว่าสิ่งนี้จะต้องแลกมาด้วย [gold_with_icon|e]"
 lesson_basics_road1: "เปิดแผงควบคุมของ [Player.GetCapital.GetNameWithNoTooltip]"
 lesson_basics_road2: "@leftclick!#high คลิก#! ที่ปุ่มสร้างถนนเพื่อสร้าง [road] จากเมืองหลวงของท่าน"
 lesson_basics_road3: "@leftclick!#high คลิก#! บน [location] ข้างเคียงบนแผนที่เพื่อเริ่มการก่อสร้าง"

 lesson_road_2: "[road_icon] ถนน"
 lesson_road_2_desc: "ยอดเยี่ยม! ยามนี้ [road_with_icon|e] อยู่ในระหว่าง [construction_with_icon|e] และจะใช้เวลาหลายเดือนกว่าจะเสร็จสิ้น ท่านสามารถดูความคืบหน้าการก่อสร้างได้ ในวิดเจ็ตทรงกลมบนแผนที่ เหนือ [capital_with_icon|e] ของท่าน\n\nเมื่อการสร้างเสร็จสมบูรณ์ [proximity_with_icon|e] ในทำเลเป้าหมายจะปรับปรุงให้ดียิ่งขึ้น และท่านจะเห็น [control_with_icon|e] เพิ่มสูงขึ้นตามไป\n\n[construction] ของ [buildings_with_icon|e], [rgo_with_icon|e] และ [regiments_with_icon|e] นั้นมีหลักการทำงานที่คล้ายคลึงกัน โดยจะต้องใช้ [gold_with_icon|e], จำต้องมี [goods_with_icon|e] จาก [market_with_icon|e] และต้องใช้เวลาในการดำเนินการให้แล้วเสร็จ"

 lesson_road_3: "[road_icon] ถนนทุกสายมุ่งสู่ [Player.GetCapital.GetNameWithNoTooltip]"
 lesson_road_3_desc: "[proximity_with_icon|e] และ [control_with_icon|e] คือหนึ่งในกลไกที่สำคัญที่สุดที่ท่านต้องเชี่ยวชาญใน @caesar!#W ยูโรปา ยูนิเวอร์ซาลิส 5#! ทั้ง [crown_power_with_icon|e], [tax_base_with_icon|e] และขนาดของ [levies_with_icon|e] ล้วนขึ้นอยู่กับ [control] ที่ท่านมีต่อทำเลต่าง ๆ ของท่านโดยตรง ซึ่งจะขึ้นอยู่กับ [proximity] จาก [capital_with_icon|e] อีกทอดหนึ่ง นั่นหมายความว่าการตัด [roads_with_icon|e] จากเมืองหลวงจึงเป็นเรื่องที่สำคัญยิ่งยวดสำหรับทุก [countries] ไม่ว่าใหญ่หรือน้อย\n\nนอกเหนือจาก [roads] แล้ว [proximity] ยังสามารถแพร่ขยายไปทางทะเลได้เช่นกัน แม้ว่าการออกคำสั่งเช่นนั้นให้มีประสิทธิภาพจำต้องมี [harbor_capacity_with_icon|e] และ [maritime_presence_with_icon|e] ที่ดี"

