 lesson_diplomacy_9: "@diplomacy! การทูต"
 lesson_diplomacy_9_desc: "ทว่ามิใช่กิจการบ้านเมืองทุกประการ จักอุบัติขึ้นเพียงภายในขอบเขตแดนของพวกเรา ให้เรากล่าวถึง [diplomacy_with_icon|e] ในลำดับถัดไป โดยเริ่มจาก #high แถบความสัมพันธ์#! ใน @diplomacy_panel![Link('diplomacy', '', 'แผงการทูต')]"
